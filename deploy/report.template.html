<script>
/* 最早注入错误钩子：脚本块语法错之外的运行时错误都能抓到（探针用） */
window.__RPT_ERR = [];
window.onerror = function(m, s, l, c){ window.__RPT_ERR.push(String(m) + ' @' + l + ':' + c); };
window.addEventListener('unhandledrejection', function(e){ window.__RPT_ERR.push('unhandled: ' + String(e.reason && e.reason.message || e.reason)); });
</script>
<script>/*__ECHARTS__*/</script>
<!-- 合规世界地图（build/make_worldmap.py 生成）。必须在 ECharts 之后 —— 它调 echarts.registerMap。
     为什么不用 ECharts 自带的 world：那份数据的中国画法不合国标（缺台湾、藏南归印度、无九段线）。 -->

<style>
/*__REPORTCSS__*/

/* ============================================================
   研报页附加样式（顶部操作条 / 编辑抽屉 / 图表工具条 / 空态）
   主题色：正红 #d0202f · 深红 #a30f24 · 亮红 #e43644 · 金 #c9a227
   ============================================================ */
:root{
  --brand:#d0202f; --brand-deep:#a30f24; --brand-bright:#e43644;
  --brand-soft:#f1f0ee; --brand-line:rgba(208,32,47,.18); --gold2:#c9a227;
}
body{font-size:15.5px}

/* ---------- 顶部操作条 ---------- */
.rbar{
  position:sticky;top:10px;z-index:60;display:flex;align-items:center;gap:9px;flex-wrap:wrap;
  padding:9px 12px;margin:0 0 18px;border-radius:14px;
  background:rgba(255,255,255,.94);
  backdrop-filter:saturate(180%) blur(12px);-webkit-backdrop-filter:saturate(180%) blur(12px);
  border:1px solid var(--brand-line);box-shadow:0 6px 22px rgba(51,49,53,.08);
}
.rbar .rb-brand{font-weight:800;color:var(--brand-deep);font-size:15px;letter-spacing:.2px;white-space:nowrap}
.rbar .rb-brand em{font-style:normal;color:var(--brand)}
.rbar .rb-sp{flex:1;min-width:8px}
.rbar .rb-tag{font-size:12px;padding:2px 9px;border-radius:999px;background:var(--brand-soft);
  color:var(--brand-deep);border:1px solid var(--brand-line);white-space:nowrap}
.rbar .rb-tag.ok{background:#eefaf3;color:#0b8a5c;border-color:rgba(11,138,92,.25)}
.rbar .rb-tag.warn{background:#fff8e8;color:#8a6d10;border-color:rgba(201,162,39,.35)}
.rbtn{
  font:inherit;font-size:13px;line-height:1;padding:8px 13px;border-radius:10px;cursor:pointer;
  border:1px solid var(--brand-line);background:#fff;color:var(--brand-deep);
  transition:.16s;white-space:nowrap;
}
.rbtn:hover{background:var(--brand-soft);border-color:var(--brand)}
.rbtn.pri{background:linear-gradient(135deg,var(--brand),var(--brand-deep));color:#fff;border-color:transparent;
  box-shadow:0 4px 14px rgba(74,72,76,.24)}
.rbtn.pri:hover{filter:brightness(1.08)}
.rbtn.on{background:linear-gradient(135deg,#e43644,#d0202f);color:#fff;border-color:transparent}
.rbtn.gh{background:transparent;border-color:rgba(163,15,36,.22);color:#6a6a6f}
.rbtn.sm{font-size:12px;padding:6px 10px;border-radius:8px}
.rbtn:disabled{opacity:.55;cursor:default}
.rsel{font:inherit;font-size:13px;padding:7px 9px;border-radius:10px;
  border:1px solid var(--brand-line);background:#fff;color:var(--brand-deep);cursor:pointer;max-width:190px}

/* ---------- 模块上的编辑按钮（仅编辑模式显示） ---------- */
.rpt-ops{position:absolute;top:14px;right:16px;display:none;gap:6px;z-index:5}
html.edit .rpt-ops{display:flex}
.rpt-ops .rbtn{background:rgba(255,255,255,.96);box-shadow:0 3px 10px rgba(51,49,53,.12)}
.rpt-chartwrap{position:relative}
html.edit .rpt-chartwrap::after{
  content:'📊 点右上角按钮编辑图表数据';position:absolute;inset:0;pointer-events:none;
  border:2px dashed rgba(208,32,47,.30);border-radius:12px;background:rgba(244,244,243,.10);
}
html.edit .rpt-chartwrap>.rpt-cops{display:flex}
.rpt-cops{position:absolute;top:6px;right:8px;display:none;gap:6px;z-index:6}

/* ---------- 图表占位 / 失败 ---------- */
.rpt-chartmiss{display:flex;align-items:center;justify-content:center;height:100%;min-height:120px;
  color:#8a8a8f;font-size:13px;background:repeating-linear-gradient(45deg,#fcfcfc,#fcfcfc 10px,#f8f8f8 10px,#f8f8f8 20px);
  border-radius:10px}
.rpt-toolbar{display:flex;justify-content:flex-end;gap:3px;margin:2px 0 4px}
.rpt-toolbar button{font:inherit;font-size:11.5px;padding:3px 9px;border-radius:7px;cursor:pointer;
  border:1px solid #e7e7e7;background:#fff;color:#8a8a8f;transition:.14s}
.rpt-toolbar button:hover{border-color:var(--brand);color:var(--brand)}
.rpt-toolbar button.on{background:var(--brand);border-color:var(--brand);color:#fff}

/* ---------- 空态 ---------- */
.rpt-empty{background:#fff;border:1px dashed var(--brand-line);border-radius:16px;
  padding:44px 26px;text-align:center;color:#6a6a6f;box-shadow:0 4px 18px rgba(51,49,53,.05)}
.rpt-empty .big{font-size:38px;line-height:1;margin-bottom:12px}
.rpt-empty h3{font-size:19px;color:var(--brand-deep);margin-bottom:8px;font-weight:800}
.rpt-empty p{font-size:13.5px;line-height:2;max-width:620px;margin:0 auto}

/* ---------- 编辑抽屉 ---------- */
.rpt-mask{position:fixed;inset:0;z-index:200;display:none;background:rgba(74,10,21,.44)}
.rpt-mask.on{display:block;animation:rptFade .18s ease}
@keyframes rptFade{from{opacity:0}to{opacity:1}}
.rpt-drawer{
  position:absolute;top:0;right:0;bottom:0;width:min(880px,94vw);
  display:flex;flex-direction:column;background:#fefefe;
  box-shadow:-16px 0 50px rgba(40,38,42,.22);
  animation:rptSlide .24s cubic-bezier(.22,.8,.36,1);
}
@keyframes rptSlide{from{transform:translateX(30px);opacity:.5}to{transform:none;opacity:1}}
.rpt-dhead{display:flex;align-items:center;gap:10px;padding:14px 18px;
  background:linear-gradient(135deg,#a30f24,#d0202f);color:#fff}
.rpt-dhead b{font-size:16px;font-weight:800}
.rpt-dhead .sub{font-size:12px;opacity:.82}
.rpt-dhead .x{margin-left:auto;cursor:pointer;font-size:20px;line-height:1;opacity:.9;padding:2px 6px;
  border-radius:8px}
.rpt-dhead .x:hover{background:rgba(255,255,255,.16)}
.rpt-tabs{display:flex;gap:6px;padding:10px 18px 0;background:#fff;border-bottom:1px solid #efeeec}
.rpt-tabs button{font:inherit;font-size:13.5px;padding:8px 14px;border:0;background:transparent;cursor:pointer;
  color:#85858a;border-bottom:2px solid transparent;transition:.15s}
.rpt-tabs button:hover{color:var(--brand)}
.rpt-tabs button.on{color:var(--brand-deep);font-weight:700;border-bottom-color:var(--brand)}
.rpt-dbody{flex:1;overflow:auto;padding:16px 18px 26px}
.rpt-dfoot{display:flex;gap:8px;justify-content:flex-end;align-items:center;
  padding:11px 18px;border-top:1px solid #efeeec;background:#fcfcfc}
.rpt-dfoot .lf{margin-right:auto;font-size:12px;color:#8a8a8f}

.rfld{margin-bottom:14px}
.rfld>label{display:block;font-size:12.5px;font-weight:700;color:#6a6a6f;margin-bottom:6px}
.rfld>label em{font-style:normal;font-weight:400;color:#9c9ca1;margin-left:6px}
.rinp,.rtxt,.rsel2{width:100%;font:inherit;font-size:13.5px;padding:9px 11px;border-radius:10px;
  border:1px solid #e6e5e3;background:#fff;color:#3a2024;transition:.15s}
.rinp:focus,.rtxt:focus,.rsel2:focus{outline:0;border-color:var(--brand);box-shadow:0 0 0 3px rgba(74,72,76,.10)}
.rtxt{font-family:ui-monospace,Consolas,"Courier New",monospace;font-size:12.5px;line-height:1.75;
  resize:vertical;min-height:260px;white-space:pre;overflow-wrap:normal;overflow-x:auto}
.rtxt.js{min-height:200px}
.rgrid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.rgrid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 14px}
.rhint{font-size:12px;color:#8a8a8f;line-height:1.85;margin:-4px 0 12px}
.rhint code{background:#f8f8f8;padding:1px 5px;border-radius:5px;color:var(--brand-deep);font-size:11.5px}

/* 抽屉里的列表 */
.rlist{display:flex;flex-direction:column;gap:6px}
.rlist .it{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:11px;
  border:1px solid #efeeec;background:#fff;cursor:pointer;transition:.14s}
.rlist .it:hover{border-color:var(--brand);background:#fcfcfc;transform:translateX(2px)}
.rlist .it .no{flex:0 0 30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#d0202f,#a30f24);color:#fff;font-size:12.5px;font-weight:800}
.rlist .it .tx{flex:1;min-width:0}
.rlist .it .tx b{display:block;font-size:13.5px;color:#3a2024;font-weight:700;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rlist .it .tx span{font-size:11.5px;color:#8a8a8f}

/* 可视化编辑区（所见即所得，用户不必面对 HTML 代码） */
.rtebar{display:flex;flex-wrap:wrap;gap:4px;align-items:center;padding:6px 8px;
  background:#f8f8f8;border:1px solid #e6e5e3;border-bottom:none;border-radius:10px 10px 0 0}
.rteb{font:inherit;font-size:12px;line-height:1;padding:6px 9px;border-radius:8px;cursor:pointer;
  border:1px solid #e6e5e3;background:#fff;color:#6a6a6f;transition:.14s}
.rteb:hover{border-color:var(--brand);color:var(--brand-deep);background:#fcfcfc}
.rteb:active{transform:translateY(1px)}
.rteb b,.rteb i,.rteb u,.rteb s{font-size:12.5px}
.rteSep{width:1px;height:17px;background:#e2e1df;margin:0 3px}
.rtesel{font:inherit;font-size:12px;padding:5px 6px;border-radius:8px;border:1px solid #e6e5e3;
  background:#fff;color:#6a6a6f;max-width:150px}
.rtebar-tip{margin-left:auto;font-size:11.5px;color:#9c9ca1;padding-right:4px}

.rte{min-height:170px;max-height:50vh;overflow:auto;padding:14px 16px;background:#fff;
  border:1px solid #e6e5e3;border-radius:0 0 10px 10px;font-size:14px;line-height:1.78;color:#3a2024;
  outline:0;transition:.15s}
.rte:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(74,72,76,.10)}
.rte>*:first-child{margin-top:0}
.rte>*:last-child{margin-bottom:0}
.rte img{max-width:100%}
.rte table{max-width:100%}

/* 图表位置：受保护的标签，点不动、改不了，避免误删代码 */
.rte-chip{display:inline-block;vertical-align:middle;margin:3px 2px;padding:4px 11px;border-radius:20px;
  background:#f2f1ef;border:1px dashed #c2c2c6;color:#c81a33;font-size:12.5px;font-weight:700;
  user-select:none;-webkit-user-select:none;cursor:default;white-space:nowrap}
.rte-chip::before{content:'📊 ';font-weight:400}

.rsrc{margin-top:9px}
.rsrc>summary{cursor:pointer;font-size:12px;color:#8a8a8f;list-style:none;padding:3px 0}
.rsrc>summary::-webkit-details-marker{display:none}
.rsrc>summary::before{content:'▸ '}
.rsrc[open]>summary::before{content:'▾ '}
.rsrc-warn{font-size:12px;color:#c81a33;background:#f1f0ee;border:1px solid #e4e3e1;
  border-radius:9px;padding:7px 10px;margin:4px 0 7px;line-height:1.7}
.rsrc-txt{min-height:120px !important;font-size:12px;line-height:1.6}

/* 新建研报：代码已存在时的拒绝提示（防止整份覆盖） */
.n-warn{margin:4px 0 12px;padding:11px 13px;border-radius:11px;font-size:13px;line-height:1.8;
  background:#f1f0ee;border:1px solid #dedddb;color:#a30f24}
.n-warn b{color:#c81a33}

/* 数据表格编辑器 */
/* 数据表上方的「导入 Excel / CSV」工具条（放在 .rpt-gridwrap 上面，别塞进滚动区里） */
.rpt-iotools{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 9px}
.rpt-iotools .tip{flex:1;min-width:170px;font-size:11.5px;line-height:1.7;color:#9c9ca1}
.rpt-iotools .tip code{background:#f8f8f8;color:#c81a33;padding:1px 4px;border-radius:4px;font-size:11px}
.rpt-gridwrap{border:1px solid #e7e7e7;border-radius:12px;overflow:auto;max-height:52vh;background:#fff}
table.rpt-grid{border-collapse:separate;border-spacing:0;width:100%;font-size:12.5px}
table.rpt-grid th{position:sticky;top:0;z-index:2;background:#f8f8f8;color:#a30f24;font-weight:700;
  padding:7px 8px;border-bottom:1px solid #e7e7e7;white-space:nowrap;font-size:12px}
table.rpt-grid td{padding:2px 4px;border-bottom:1px solid #f6f6f6}
table.rpt-grid td input{width:100%;font:inherit;font-size:12.5px;padding:5px 7px;border-radius:7px;
  border:1px solid transparent;background:transparent;color:#3a2024}
table.rpt-grid td input:hover{border-color:#e7e7e7}
table.rpt-grid td input:focus{outline:0;background:#fff;border-color:var(--brand);box-shadow:0 0 0 3px rgba(74,72,76,.09)}
table.rpt-grid td.ix{width:58px;text-align:center;color:#b4b4b8;font-size:11px;white-space:nowrap}
table.rpt-grid tr:hover td{background:#fcfcfc}
/* 行号列里的「删这一行」小按钮。常显但很淡 —— 别做成 hover 才出现，
   藏起来的功能等于没有（上一版导入按钮就吃过这个亏）；悬停才变红。 */
table.rpt-grid td.ix .gx{font:inherit;font-size:11px;line-height:1;margin-left:4px;padding:2px 4px;
  border:1px solid #e7e7e7;border-radius:6px;background:#fff;color:#c6c6ca;cursor:pointer;vertical-align:middle}
table.rpt-grid td.ix .gx:hover{background:#f1f0ee;border-color:#e0a4ab;color:#d0202f}

/* 提示条 */
.rpt-toast{position:fixed;left:50%;bottom:34px;transform:translate(-50%,20px);z-index:600;
  padding:11px 20px;border-radius:12px;font-size:13.5px;font-weight:600;color:#fff;
  background:linear-gradient(135deg,#a30f24,#d0202f);box-shadow:0 10px 30px rgba(51,49,53,.3);
  opacity:0;pointer-events:none;transition:.24s;max-width:80vw;text-align:center}
.rpt-toast.on{opacity:1;transform:translate(-50%,0)}
.rpt-toast.bad{background:linear-gradient(135deg,#4a0a15,#8f0f22)}
.rpt-toast.ok{background:linear-gradient(135deg,#0b6b47,#0b8a5c)}

/* 密码弹窗 */
.rpt-pmask{position:fixed;inset:0;z-index:500;display:none;align-items:center;justify-content:center;
  background:rgba(74,10,21,.5)}
.rpt-pmask.on{display:flex}
.rpt-pbox{width:min(420px,92vw);background:#fff;border-radius:16px;overflow:hidden;
  box-shadow:0 24px 70px rgba(40,38,42,.35);animation:rptSlide .2s ease}
.rpt-pbox .hd{padding:14px 18px;background:linear-gradient(135deg,#a30f24,#d0202f);color:#fff;font-weight:800}
.rpt-pbox .bd{padding:16px 18px}
.rpt-pbox .warn{background:#fafafa;border:1px solid #e4e3e1;border-radius:10px;padding:11px 13px;
  font-size:12.5px;color:#a30f24;line-height:1.9;margin-bottom:12px}
.rpt-pbox .err{color:#d0202f;font-size:12.5px;min-height:18px}
.rpt-pbox .ft{display:flex;gap:8px;justify-content:flex-end;padding:0 18px 16px}
.rpt-pbox .rkeep{display:flex;align-items:flex-start;gap:7px;font-size:12.2px;color:#6a6a6f;
  margin:2px 0 8px;cursor:pointer;user-select:none;line-height:1.55}
/* ⚠️ 文字必须裹在单个 <span>：flex 会把每段文本 / 每个内联元素当独立子项横排，
   否则「…仍需输入（<b>…</b>）」会被拆成三列、括号飘到下一行。 */
.rpt-pbox .rkeep>span{flex:1 1 auto;min-width:0}
.rpt-pbox .rkeep input{width:15px;height:15px;accent-color:#d0202f;margin:0;margin-top:1px;flex:0 0 auto;cursor:pointer}
.rpt-pbox .rkeep b{color:#a30f24}
.rbtn.red{background:linear-gradient(135deg,#c81a33,#a30f24);color:#fff;border-color:transparent;
  box-shadow:0 4px 14px -6px rgba(51,49,53,.85)}
.rbtn.red:hover{background:linear-gradient(135deg,#c81a33,#a30f24)}
.shake{animation:rptShake .38s}
@keyframes rptShake{0%,100%{transform:none}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}

/* ---------- 报告说明弹窗（2026-10-14）----------
   用户口径：「研报里不要有『本报告按 31 模块标准模板建档…』这种注解，在头部做一个点击弹窗，
   注解之类的全部归到一起」。所以：建档说明 / 数据口径 / 正文标记图例 一律不再占正文，
   统一收进页头这个弹窗；正文只留结论本身。
   复用密码弹窗的 .rpt-* 命名与前缀，避免与抽屉 (.rpt-mask/.rpt-drawer) 打架。 */
.rpt-nmask{position:fixed;inset:0;z-index:520;display:none;align-items:center;justify-content:center;
  background:rgba(74,10,21,.5);padding:22px}
.rpt-nmask.on{display:flex}
.rpt-nbox{width:min(780px,94vw);max-height:86vh;display:flex;flex-direction:column;background:#fff;
  border-radius:16px;overflow:hidden;box-shadow:0 24px 70px rgba(40,38,42,.42);animation:rptSlide .2s ease}
.rpt-nbox .hd{display:flex;align-items:center;gap:9px;padding:14px 18px;
  background:linear-gradient(135deg,#a30f24,#d0202f);color:#fff;font-weight:800;font-size:15px}
.rpt-nbox .hd .cnt{font-weight:600;font-size:12px;background:rgba(255,255,255,.2);border-radius:999px;padding:2px 9px}
.rpt-nbox .hd .x{margin-left:auto;cursor:pointer;font-weight:400;font-size:16px;opacity:.88;line-height:1}
.rpt-nbox .hd .x:hover{opacity:1}
.rpt-nbox .bd{padding:16px 20px 4px;overflow:auto;font-size:13.5px;line-height:1.88;color:#3d3a33}
.rpt-nbox .ns{border:1px solid #f0e3c2;background:linear-gradient(135deg,#fffdf6,#fffbf0);
  border-radius:12px;padding:13px 16px;margin-bottom:12px}
.rpt-nbox .ns .nt{display:flex;align-items:center;gap:7px;font-weight:800;color:#8a6a0e;font-size:13px;margin-bottom:8px}
.rpt-nbox .ns .nt .ic{font-weight:400;font-size:14px}
.rpt-nbox .ns .nb>*:first-child{margin-top:0}
.rpt-nbox .ns .nb>*:last-child{margin-bottom:0}
.rpt-nbox .legend{display:grid;gap:9px}
.rpt-nbox .legend .lg{display:flex;gap:9px;align-items:flex-start}
.rpt-nbox .legend .mk{flex:0 0 auto;font-weight:800;color:#a3122a;background:#fff4f4;
  border:1px solid #f2d2d6;border-radius:6px;padding:1px 7px;font-size:11.5px;white-space:nowrap;margin-top:3px}
.rpt-nbox .ft{padding:12px 18px;border-top:1px solid #f0efed;display:flex;justify-content:flex-end;gap:8px}

/* 页头「报告说明」入口（在 hero 的 .meta 行里，与徽标同排） */
.notebtn{display:inline-flex;align-items:center;gap:6px;cursor:pointer;font:inherit;font-size:12.5px;
  font-weight:700;padding:5px 12px;border-radius:999px;line-height:1.4;
  border:1px solid rgba(255,255,255,.5);background:rgba(255,255,255,.15);color:#fff;transition:.18s}
.notebtn:hover{background:rgba(255,255,255,.3);transform:translateY(-1px)}
.notebtn em{font-style:normal;font-size:10.5px;font-weight:800;background:#f4e0a4;color:#8a1a14;
  border-radius:999px;padding:1px 6px;line-height:1.5}
/* 屏幕隐藏、打印显示：弹窗点不开，PDF 里必须把说明印出来 */
#printNotes{display:none}

/* ---------- 时间轴卡片「展开全文」弹窗（2026-10-14）----------
   用户口径：「文字多的帮我隐藏部分文字，增加一个点击弹窗查看全部」。
   卡片正文由 CSS 截到 7 行（.hist .h-card .h-txt 的 -webkit-line-clamp，见 report_theme.css），
   点卡片 → 这里弹出全文。全文**只从卡片自身的 DOM 里取**，不往库里加字段 ——
   已入库的研报 HTML 一个字都不用改，改这一处就是全站生效。
   命名沿用 .rpt-* 前缀，避免和抽屉 (.rpt-mask) / 密码 (.rpt-pmask) 打架。 */
.rpt-hmask{position:fixed;inset:0;z-index:530;display:none;align-items:center;justify-content:center;
  background:rgba(74,10,21,.5);padding:22px}
.rpt-hmask.on{display:flex}
.rpt-hbox{width:min(560px,94vw);max-height:80vh;display:flex;flex-direction:column;background:#fff;
  border-radius:16px;overflow:hidden;box-shadow:0 24px 70px rgba(40,38,42,.42);animation:rptSlide .2s ease}
.rpt-hbox .hd{display:flex;align-items:center;gap:10px;padding:12px 18px;
  background:linear-gradient(135deg,#a30f24,#d0202f);color:#fff}
.rpt-hbox .hd .yr{font-weight:800;font-size:19px;letter-spacing:1px;line-height:1.45;
  background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.28);border-radius:999px;padding:2px 15px}
.rpt-hbox .hd .tt{font-size:12px;font-weight:600;letter-spacing:2px;opacity:.88}
.rpt-hbox .hd .x{margin-left:auto;cursor:pointer;font-size:16px;opacity:.88;line-height:1}
.rpt-hbox .hd .x:hover{opacity:1}
.rpt-hbox .bd{padding:16px 20px 18px;overflow:auto;font-size:13.5px;line-height:1.95;color:#3d3830}
.rpt-hbox .bd b{color:#d0202f;font-weight:700}
.rpt-hbox .ft{display:flex;align-items:center;gap:8px;padding:11px 18px;background:#fcfcfc;
  border-top:1px solid #f0efed}
.rpt-hbox .ft .pg{font-size:12px;color:#9a9490;margin:0 auto;letter-spacing:.5px}
.rpt-hbox .ft .rbtn[disabled]{opacity:.36;cursor:not-allowed;pointer-events:none}

/* ---------- 公司资料库（顶部操作条「📂 公司资料库」） ----------
   文件本体存在 CloudBase 存储 bucket `company-files`（公开读，前端直传），
   元数据（原始文件名 / 类型 / 大小 / 上传时间）存在同环境的 wb_company_files 表。
   层级：资料库 .rpt-fmask(545) < 预览 .rpt-vmask(550)，两者都在其它弹窗之上。 */
.rpt-fmask{position:fixed;inset:0;z-index:545;display:none;align-items:center;justify-content:center;
  background:rgba(74,10,21,.5);padding:22px}
.rpt-fmask.on{display:flex}
.rpt-fbox{position:relative;width:min(1020px,96vw);max-height:min(86vh,840px);display:flex;flex-direction:column;
  background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 24px 70px rgba(40,38,42,.42);
  animation:rptSlide .2s ease}
.rpt-fbox .hd{display:flex;align-items:center;gap:10px;padding:13px 18px;flex-wrap:wrap;
  background:linear-gradient(135deg,#a30f24,#d0202f);color:#fff}
.rpt-fbox .hd .t{font-weight:800;font-size:15.5px;letter-spacing:.3px}
.rpt-fbox .hd .co{font-size:12px;background:rgba(255,255,255,.2);border-radius:999px;padding:2px 10px}
/* 统计做成一枚描边胶囊：半透明白字压在红底上截图/缩小时会糊成一团，
   给它一层底 + 不透明字，任何缩放下都读得清 */
.rpt-fbox .hd .stat{font-size:12px;white-space:nowrap;padding:3px 10px;border-radius:999px;
  background:rgba(0,0,0,.16);border:1px solid rgba(255,255,255,.28);color:#fff}
/* 空柜 / 读取失败时 fStat('') 会把文字清空 ⇒ 胶囊只剩一圈红边，像渲染坏了。:empty 直接收掉。 */
.rpt-fbox .hd .stat:empty{display:none}
.rpt-fbox .hd .x{margin-left:auto;cursor:pointer;font-size:17px;opacity:.88;line-height:1;padding:1px 4px}
.rpt-fbox .hd .x:hover{opacity:1}
.rpt-fbox .bar{display:flex;align-items:center;gap:10px;padding:11px 18px;flex-wrap:wrap;
  border-bottom:1px solid #f0efed;background:#fcfbfb}
.rpt-fbox .bar .tip{font-size:12px;color:#9a9490}
.rpt-fbox .bar .finp{margin-left:auto;font:inherit;font-size:12.5px;padding:7px 11px;border-radius:9px;
  border:1px solid #e6e4e1;background:#fff;color:#3d3a33;width:190px;min-width:110px}
.rpt-fbox .bar .finp:focus{outline:none;border-color:#e8899a;box-shadow:0 0 0 3px rgba(208,32,47,.08)}
.rpt-fbox .bd{flex:1 1 auto;min-height:0;overflow:auto;padding:2px 12px 12px}
.rpt-fbox .ft{display:flex;align-items:center;gap:8px;padding:11px 18px;border-top:1px solid #f0efed;
  background:#fcfcfc}
.rpt-fbox .ft .hint{font-size:11.5px;color:#a9a4a0;margin-right:auto;line-height:1.6}
/* 拖拽态：整张卡盖一层粉底提示（pointer-events:none，不然 drop 事件收不到） */
.rpt-fbox.drag::after{content:'松开即上传到「公司资料库」';position:absolute;inset:0;z-index:9;
  display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;color:#c8102e;
  background:rgba(255,246,247,.94);border:2px dashed #e88c98;border-radius:16px;pointer-events:none}
/* 文件行 */
.fl{display:flex;align-items:center;gap:10px;padding:9px 10px;border-bottom:1px solid #f4f2f0}
.fl:hover{background:#fffafa}
.fl .fi{flex:0 0 30px;height:30px;display:flex;align-items:center;justify-content:center;font-size:16px;
  border-radius:8px;background:#f6f3f3}
.fl .fi.k-pdf{background:#fdecee;color:#c8102e}
.fl .fi.k-doc{background:#eaf1fd;color:#2b5fc7}
.fl .fi.k-xls{background:#eaf7ef;color:#1a8a54}
.fl .fi.k-ppt{background:#fdf1e7;color:#c1651a}

.fl .fn:hover{color:#c8102e}

.fl .fs{flex:0 0 66px;text-align:right;font-size:12px;color:#8d8783}
.fl .fd{flex:0 0 116px;text-align:right;font-size:12px;color:#a9a4a0}
.fl .fo{flex:0 0 auto;display:flex;gap:4px}
.fl .fo .ib{font:inherit;font-size:12px;line-height:1;padding:6px 9px;border-radius:8px;cursor:pointer;
  border:1px solid #eae7e4;background:#fff;color:#6f6a66;transition:.14s}
.fl .fo .ib:hover{background:#fff4f4;border-color:#e8899a;color:#c8102e}
.fl .fo .ib.del:hover{background:#fdecee;border-color:#e05a6a;color:#a30f24}
.fempty{padding:52px 20px;text-align:center;color:#a9a4a0;font-size:13px;line-height:2.1}
.fempty .big{display:block;font-size:34px;opacity:.45;margin-bottom:8px}
.fempty b{color:#c8102e}
/* 上传进度条 */
.fqueue{margin:10px 0 4px;border:1px solid #f2e6e8;border-radius:10px;background:#fffcfc;padding:4px 0}
.fprog{display:flex;align-items:center;gap:10px;padding:8px 12px;font-size:12.5px;color:#6f6a66}
.fprog .nm{flex:0 0 34%;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#3d3830}
.fprog .pb{flex:1 1 auto;height:6px;border-radius:99px;background:#f2efee;overflow:hidden}
.fprog .pb i{display:block;height:100%;width:0;background:linear-gradient(90deg,#e43644,#c8102e);
  transition:width .18s ease}
.fprog .st{flex:0 0 54px;text-align:right;font-size:11.5px;color:#a9a4a0}
.fprog.ok .st{color:#0b8a5c}
.fprog.bad .st{color:#c8102e}
/* ---------- 资料预览（图片 / PDF / 文本内嵌） ---------- */
.rpt-vmask{position:fixed;inset:0;z-index:550;display:none;align-items:center;justify-content:center;
  background:rgba(30,22,22,.74);padding:22px}
.rpt-vmask.on{display:flex}
.rpt-vbox{width:min(1200px,96vw);height:min(92vh,900px);display:flex;flex-direction:column;background:#fff;
  border-radius:16px;overflow:hidden;box-shadow:0 24px 70px rgba(0,0,0,.45);animation:rptSlide .2s ease}
.rpt-vbox .hd{display:flex;align-items:center;gap:10px;padding:12px 18px;
  background:linear-gradient(135deg,#a30f24,#d0202f);color:#fff}
.rpt-vbox .hd .tt{flex:1 1 auto;min-width:0;font-weight:700;font-size:14px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rpt-vbox .hd .x{cursor:pointer;font-size:17px;opacity:.88;line-height:1;padding:1px 4px}
.rpt-vbox .hd .x:hover{opacity:1}
.rpt-vbox .bd{flex:1 1 auto;min-height:0;overflow:auto;display:flex;align-items:center;justify-content:center;
  background:repeating-conic-gradient(#fbfafa 0 25%,#f5f3f3 0 50%) 50%/22px 22px}
.rpt-vbox .bd img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.rpt-vbox .bd iframe{width:100%;height:100%;border:0;background:#fff;display:block}
/* PDF：浏览器自带阅读器不保证内嵌（手机 Safari / 关掉阅读器时是一片空白）⇒ 图下挂一条降级提示 */
.rpt-vbox .bd .vpdf{width:100%;height:100%;display:flex;flex-direction:column;min-height:0;background:#fff}
.rpt-vbox .bd .vpdf iframe{flex:1 1 auto;min-height:0}
.rpt-vbox .bd .vpdf .vhint{flex:0 0 auto;padding:7px 14px;border-top:1px solid #f0e2d6;
  background:#fff8f2;color:#9a6b45;font-size:11.5px;text-align:center}
.rpt-vbox .bd pre{margin:0;padding:18px 22px;width:100%;height:100%;overflow:auto;background:#fff;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.8px;line-height:1.85;
  white-space:pre-wrap;word-break:break-word;color:#33302c}
.rpt-vbox .bd .nopv{text-align:center;color:#5f5a56;font-size:13.5px;line-height:2.2;padding:34px 24px;
  background:#fff;border-radius:12px;max-width:520px}
.rpt-vbox .bd .nopv .big{display:block;font-size:38px;margin-bottom:10px;opacity:.55}
.rpt-vbox .ft{display:flex;align-items:center;gap:8px;padding:11px 18px;border-top:1px solid #f0efed;
  background:#fcfcfc}
.rpt-vbox .ft .meta{font-size:11.5px;color:#a9a4a0;margin-right:auto;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:700px){
  .rpt-fmask{padding:10px}
  .rpt-fbox{width:100%;height:92vh}

  .rpt-vmask{padding:10px}
  .rpt-vbox{width:100%;height:94vh}
}
@media print{ .rpt-fmask,.rpt-vmask{display:none !important} }

/* 卡片入场（比原来的 IntersectionObserver 方案更稳：不会因为没滚动而永远透明） */
.card,.stat,.verdict,.essence,.criteria{animation:rptIn .5s cubic-bezier(.22,.8,.36,1) both}
@keyframes rptIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

@media print{
  .rbar,.rpt-ops,.rpt-toolbar,.rpt-toast,nav.toc{display:none!important}
  body{background:#fff;padding:0!important}
  /* 弹窗在打印时是关着的，所以把同一份说明在文末印出来（点不开 ≠ 看不到） */
  #printNotes{display:block;margin-top:26px}
  /* 时间轴卡片同理：PDF 里必须还原全文。屏幕上是「截 7 行 + 点开弹窗」，
     但 PDF 点不开弹窗 —— 只截不还原 = 直接把正文印丢了，比溢出严重得多。 */
  .hist .h-card .h-txt{display:block!important;-webkit-line-clamp:unset!important;overflow:visible!important;}
  .hist .h-more{display:none!important;}
  #printNotes .ns{border:1px solid #e8d5a2;background:#fffdf6;border-radius:12px;padding:12px 15px;margin-bottom:10px}
  #printNotes .ns .nt{font-weight:800;color:#8a6a0e;font-size:12.5px;margin-bottom:6px}
  #printNotes .ns .nb{font-size:12.5px;color:#4a463d;line-height:1.8}
  #printNotes .legend{display:grid;gap:7px}
  #printNotes .legend .lg{display:flex;gap:9px;align-items:flex-start}
  #printNotes .legend .mk{flex:0 0 auto;font-weight:800;color:#a3122a;background:#fff4f4;
    border:1px solid #f2d2d6;border-radius:6px;padding:1px 7px;font-size:11px;white-space:nowrap;margin-top:2px}
}
@media (max-width:820px){
  /* ⚠️ 这里是 100vw 会踩的老坑：100vw 把竖向滚动条的宽度也算进去，窄屏下抽屉比屏幕宽
     ~15px，底部「保存图表」会被切掉一截（截图才看出来）。父级 .rpt-mask 是 inset:0，
     所以 100% 才是真正的可视宽度。 */
  .rpt-drawer{width:100%}
  /* 工具条的说明文字在窄屏独占一行，别被挤成三行贴在按钮右边 */

  .rbar .rb-tag{display:none}
  .rpt-nmask{padding:12px}
  .rpt-nbox{width:100%;max-height:90vh}
}

<style id="rte-tools-css">/* 研报编辑器工具栏扩展（2026-10-20 用户令：字号 / 文字颜色 / 填充颜色 / 编号样式）

.rte-col{

}

/* 面板里的小按钮（字号 / 编号） */

/* 「字色 / 底色」按钮：标签下面一条色条，一眼能看出是改颜色 */

  padding:2px 7px 1px;gap:1px;}

/* ================================================================
   编辑区里的「三色分级」——所见即所得（2026-10-20 用户令：颜色不一致）
   ------------------------------------------------------------------
   库里的颜色是**类**，不是内联样式：裸 <b> = 一级朱砂，#hl2 = 二级靛蓝，
   #hl3 = 三级黛紫。但线上那几条规则全挂在 `#mods b.hl2 !important` /
   `.card b.hl2` 这些**页面作用域**上，编辑弹层的 .rte 一个都不匹配 ⇒
   编辑区里满屏黑字，用户以为「颜色丢了 / 取不到」。
   这里按同样的色号给 .rte 补一套，只影响编辑区，不碰成品样式。
   ================================================================ */
.rte b{color:#c0392b;}
.rte strong{color:#c0392b;}
.rte b.hl2, .rte strong.hl2{color:#1f5fa8;}
.rte b.hl3, .rte strong.hl3{color:#6b3fa0;}
/* 自定义色（色板里三色之外的）走 data-c 内联，第 6 条已经写进 style，这里不用管 */
.rte [data-c]{border-radius:2px;}
</style>

<script>/*__RPTCFG__*/</script>
<script>
/* ============================================================================
   研报页 · 核心
   —— 数据全部来自数据库（wb_reports / wb_report_mods / wb_report_charts）
   —— 页面只负责渲染与编辑，改文案/改数字都不用动代码
   ============================================================================ */
var CFG   = window.RPT_CFG || {envId:'', key:''};
var REST  = CFG.envId ? ('https://' + CFG.envId + '.api.tcloudbasegateway.com/v1/rdb/rest/') : '';
var SEED  = window.RPT_SEED || null;
var THEME = 'report';

var AUTH_KEY = 'wb_auth_v1', AUTH_TTL = 7 * 24 * 3600 * 1000, AUTH_LAST_USER = 'wb_last_user_v1';
var Auth = {token:'', user:'', name:'', role:''};

var St = {
  code:'', rep:null, mods:[], charts:{}, chartKeys:[], all:[],
  src:'',                     /* cloud | seed */
  edit:false, inst:{}
};
var UI = {tab:'head', selMod:'', selChart:'', preview:false, confirmCb:null,
          confirmAct:'删除', confirmDanger:true,
          rteDirty:{}, rteSrcOrig:{}};

/* ---------------------------------------------------------------- 小工具 */
function $(id){ return document.getElementById(id); }
function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function escq(s){ return esc(s); }
function attr(s){ return esc(s); }
function qs(k){
  var m = new RegExp('[?&]' + k + '=([^&]*)').exec(location.search || '');
  return m ? decodeURIComponent(m[1].replace(/\+/g, ' ')) : '';
}
function enc(s){ return encodeURIComponent(String(s == null ? '' : s)); }
function nowTs(){ return Date.now(); }
var _tt = null;
function toast(msg, kind){
  var t = $('rptToast'); if(!t) return;
  t.className = 'rpt-toast on' + (kind ? ' ' + kind : '');
  t.textContent = msg;
  clearTimeout(_tt);
  _tt = setTimeout(function(){ t.className = 'rpt-toast'; }, 2600);
}
function copy(o){ return JSON.parse(JSON.stringify(o == null ? null : o)); }

/* ---------------------------------------------------------------- 云端访问 */
function api(table, opt){
  if(!REST) return Promise.reject(new Error('未配置云环境'));
  opt = opt || {};
  var h = {'Authorization': 'Bearer ' + CFG.key};
  if(opt.headers) for(var k in opt.headers) h[k] = opt.headers[k];
  var init = {method: opt.method || 'GET', headers: h};
  if(opt.body !== undefined) init.body = JSON.stringify(opt.body);
  return fetch(REST + table + (opt.q || ''), init).then(function(r){
    if(!r.ok){
      return r.text().then(function(t){
        throw new Error('HTTP ' + r.status + ' ' + String(t).slice(0, 220));
      });
    }
    if(r.status === 204) return null;
    return r.text().then(function(t){
      if(!t) return null;
      try{ return JSON.parse(t); }catch(e){ return null; }
    });
  });
}
function rpc(fn, args){
  return api('rpc/' + fn, {method:'POST', headers:{'Content-Type':'application/json'}, body:args || {}});
}

/* ---------------------------------------------------------------- 登录态（与工作台共用） */
function restoreAuth(){
  var a = null;
  try{ a = JSON.parse(localStorage.getItem(AUTH_KEY) || sessionStorage.getItem(AUTH_KEY) || 'null'); }catch(e){}
  if(!a || !a.t) return false;
  if(a.ts && (Date.now() - a.ts) > AUTH_TTL) return false;
  Auth.token = a.t; Auth.user = a.u || ''; Auth.name = a.n || a.u || ''; Auth.role = a.r || '';
  return true;
}
function persistAuth(r, remember){
  try{
    var s = JSON.stringify({t:r.token, u:r.user, n:r.name || r.user, r:r.role || 'super', ts:Date.now()});
    if(remember){ localStorage.setItem(AUTH_KEY, s); sessionStorage.removeItem(AUTH_KEY); }
    else { sessionStorage.setItem(AUTH_KEY, s); localStorage.removeItem(AUTH_KEY); }
    localStorage.setItem(AUTH_LAST_USER, r.user);
  }catch(e){}
}
function authClear(){
  Auth.token = ''; Auth.user = ''; Auth.name = ''; Auth.role = '';
  try{ localStorage.removeItem(AUTH_KEY); sessionStorage.removeItem(AUTH_KEY); }catch(e){}
  rptPassStamp(false);        /* 退出登录即清掉「免重复输入」的放行窗口 */
  if(typeof rTickClear === 'function') rTickClear();   /* 编辑会话票据也一并作废 */
}

/* ---------------------------------------------------------------- 写操作密码门禁
   与工作台同一套语义：删除 / 覆盖导入永远要输密码；保存 / 修改可勾 15 分钟免重复输入。
   桌面文件版（file://）连不上云端 → 退化为本机哈希校验，明文不落盘。 */
var RPASS_FRESH_KEY = 'rpt_pass_fresh_v1';
var RPASS_HASH_KEY  = 'wb_pass_h_v1';        /* 与工作台共用同一个本机校验密码 */
var RPASS_FRESH_MS  = 15 * 60 * 1000;
function rptPassFresh(){
  try{ return (parseInt(sessionStorage.getItem(RPASS_FRESH_KEY) || '0', 10) || 0) > Date.now(); }
  catch(e){ return false; }
}
function rptPassStamp(on){
  try{
    if(on) sessionStorage.setItem(RPASS_FRESH_KEY, String(Date.now() + RPASS_FRESH_MS));
    else sessionStorage.removeItem(RPASS_FRESH_KEY);
  }catch(e){}
}
function rptHashPass(p){
  var s = 'wb-pass|' + String(p);
  if(window.crypto && crypto.subtle && crypto.subtle.digest && window.TextEncoder){
    try{
      return crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)).then(function(buf){
        var b = new Uint8Array(buf), h = '';
        for(var i = 0; i < b.length; i++) h += (b[i] < 16 ? '0' : '') + b[i].toString(16);
        return h;
      });
    }catch(e){}
  }
  var h2 = 5381;
  for(var j = 0; j < s.length; j++) h2 = ((h2 * 33) ^ s.charCodeAt(j)) >>> 0;
  return Promise.resolve('d' + h2.toString(16));
}
function localPassCheck(pass, onOk, onBad){
  var has = null;
  try{ has = localStorage.getItem(RPASS_HASH_KEY); }catch(e){}
  rptHashPass(pass).then(function(h){
    if(!has){
      try{ localStorage.setItem(RPASS_HASH_KEY, h); }catch(e){}
      toast('已把本次密码记为本机校验密码（仅存哈希）', 'ok');
      onOk(); return;
    }
    if(h === has){ onOk(); return; }
    onBad('本机密码不正确，操作已取消');
  }).catch(function(){ onBad('本机校验失败，操作已取消'); });
}

/* ---------------------------------------------------------------- 读取 */
function normalizeCharts(rows){
  var m = {}, keys = [];
  (rows || []).forEach(function(c){
    var k = String(c.id || '');
    if(St.code && k.indexOf(St.code + '_') === 0) k = k.slice(St.code.length + 1);
    m[k] = c; keys.push(k);
  });
  St.charts = m; St.chartKeys = keys;
}
function applyReport(r, mods, charts, src){
  St.rep = r; St.mods = mods || []; normalizeCharts(charts); St.src = src;
}
function useSeed(){
  if(SEED && SEED.report && (!St.code || SEED.report.code === St.code)){
    St.code = SEED.report.code;
    applyReport(copy(SEED.report), copy(SEED.mods), copy(SEED.charts), 'seed');
    return true;
  }
  return false;
}
function load(){
  var code = qs('code') || (SEED && SEED.report ? SEED.report.code : '');
  St.code = code;
  if(!REST || !code){ useSeed(); return Promise.resolve(false); }
  return Promise.all([
    api('wb_reports?id=eq.' + enc(code)),
    api('wb_report_mods?report_id=eq.' + enc(code) + '&order=seq.asc'),
    api('wb_report_charts?report_id=eq.' + enc(code) + '&order=seq.asc')
  ]).then(function(a){
    if(!a[0] || !a[0].length) throw new Error('NO_REPORT');
    applyReport(a[0][0], a[1] || [], a[2] || [], 'cloud');
    return true;
  }).catch(function(e){
    St.loadErr = String(e && e.message || e);
    return useSeed();
  });
}
function loadAllReports(){
  if(!REST) return Promise.resolve();
  return api('wb_reports?select=id,code,name&order=code.asc').then(function(rows){
    St.all = rows || [];
  }).catch(function(){ St.all = []; });
}

   但删掉又会让读者不知道 [模型输出] / [MISSING] 是什么，所以集中到一处可查。 */

  if(r.kpi_note) secs.push({ic:'📐', t:'数据口径', b:'<p>' + esc(r.kpi_note) + '</p>'});
  var body = '';
  (St.mods || []).forEach(function(m){ body += (m.html || ''); });

/* 目录文案：剥掉「第X篇 」前缀。
   ⚠️ 为什么非剥不可：左侧竖排目录很窄，前缀「第一篇」4 个字就吃掉一大半，
   真正要看的模块名会被挤成「第四篇 公司营业收入与利…」——用户 2026-09-16 反馈
   「不要显示前面第几篇，把主要的字挡住了」。库里的文案已统一成 4 个字
   （公司简介 / 产业链条 / 在建工程 / 营业收入 / 盈利预测 / 企业评分）；
   这里再兜底剥一次前缀，是为了兼容历史研报和网页端编辑过的旧数据。 */
function tocLabel(s){
  return String(s == null ? '' : s)
    .replace(/^第[一二三四五六七八九十百零〇\d]+篇[\s·、,，:：\-—]*/, '')
    .trim();
}

/* 序号补零：目录条要显示成 01…10（2026-10-20 参考稿口径）。
   ⚠️ 只补 `data-n`，`data-i` 必须保持纯数字 —— build/probe_toc.py 用 'IT' + data-i 拼断言名。 */
function tocPad2(n){ return n < 10 ? '0' + n : '' + n; }

function renderToc(){
  var t = (St.rep && St.rep.toc) || [];
  var box = $('toc');
  if(!t.length){ box.innerHTML = ''; box.style.display = 'none'; return; }
  var links = t.map(function(x, i){
    /* ★ 条目**不加 title**（2026-10-20 用户令：「那个悬浮的投资核心不要」）：
       浏览器原生提示条会在 hover 时弹出一条黑底「投资核心」横在列表上，
       比条目本身还显眼。截断靠 CSS 的 ellipsis，不要用 title 兜。 */
    return '<a href="#' + attr(x.anchor) + '" data-i="' + (i + 1) + '" data-n="' + tocPad2(i + 1) + '">' +
           esc(tocLabel(x.text)) + '</a>';
  }).join('');
  /* 目录壳（2026-10-20 用户给了参考稿，要「花里胡哨」）：
     顶部「● 目录 03/10」+ 条目 + 底部「阅读进度条 + 回到顶部」。
     ★ 三块壳全由渲染层生成，**不加任何库字段**；计数与进度在 tocSpy() 里跟着滚动刷新。 */
  box.innerHTML =
    '<div class="tc-hd"><i class="tc-dt"></i><span class="tc-tt">目录</span>' +
      '<span class="tc-ix"><b>01</b><em>/</em>' + tocPad2(t.length) + '</span></div>' +
    links +
    '<div class="tc-ft">' +
      '<div class="tc-pg"><span>阅读进度</span><b>0%</b></div>' +
      '<div class="tc-bar"><i></i></div>' +
      '<button type="button" class="tc-up" onclick="try{window.scrollTo({top:0,behavior:\'smooth\'});}catch(e){window.scrollTo(0,0);}return false;">回到顶部</button>' +
    '</div>';
  box.style.display = '';
  /* 序号列那条红金虚线的起止：按**首末条目的中线**算，写进 CSS 变量。
     ★ 不用固定 top/bottom —— 6 条研报和 10 条研报的条目区高度差 130px，
       写死会让线在条目少的时候探进底部「阅读进度」区。 */
  var _as = box.querySelectorAll('a');
  if(_as.length){
    var _y0 = _as[0].offsetTop + _as[0].offsetHeight / 2;
    var _y1 = _as[_as.length - 1].offsetTop + _as[_as.length - 1].offsetHeight / 2;
    box.style.setProperty('--tc-lt', _y0 + 'px');
    box.style.setProperty('--tc-lh', (_y1 - _y0) + 'px');
    /* 虚线的步长 = 相邻两条目的 offsetTop 差. mask 用它当周期，
       正好「每个条目一段竖线」；写死像素会在放大字号/换字号时错位。 */
    if(_as.length > 1){
      box.style.setProperty('--tc-step', (_as[1].offsetTop - _as[0].offsetTop) + 'px');
    }
  }
  tocSpy();
}

/* 左侧竖排目录：滚动时高亮当前模块（顶部操作条会压住定位点，预留 110px 余量） */
function tocSpy(){
  var box = $('toc');
  if(!box) return;
  var as = box.querySelectorAll('a');
  if(!as.length) return;
  var cur = 0;
  for(var i = 0; i < as.length; i++){
    var id = String(as[i].getAttribute('href') || '').replace(/^#/, '');
    var el = id ? document.getElementById(id) : null;
    if(!el) continue;
    var rc = el.getBoundingClientRect();
    /* ⚠️ display:none 的模块 rect 全是 0，会被误判成「已经在视口上方」→ 必须跳过 */
    if(!rc.height) continue;
    if(rc.top <= 110) cur = i;
  }
  var de = document.documentElement;
  if(window.innerHeight + window.pageYOffset >= de.scrollHeight - 8) cur = as.length - 1;
  for(var j = 0; j < as.length; j++){
    if(j === cur){ if(as[j].className !== 'on') as[j].className = 'on'; }
    else if(as[j].className){ as[j].className = ''; }
  }
  /* 目录条本身可滚动时（手机上横向 / 条数多时纵向），把当前项带进可视区 */
  var a = as[cur];
  if(box.scrollWidth > box.clientWidth + 4){
    box.scrollLeft = Math.max(0, a.offsetLeft - (box.clientWidth - a.offsetWidth) / 2);
  } else if(box.scrollHeight > box.clientHeight + 4){
    box.scrollTop = Math.max(0, a.offsetTop - (box.clientHeight - a.offsetHeight) / 2);
  }
  /* ---- 目录壳刷新（2026-10-20）：右侧「03 / 10」+ 底部阅读进度 ----
     ⚠️ 只在 DOM 里读写，不写库；tocSpy 有 90ms 节流，每次 3 次 querySelector 可忽略。 */
  var ixB = box.querySelector('.tc-ix b');
  if(ixB){ var cn = cur + 1; ixB.textContent = cn < 10 ? '0' + cn : '' + cn; }
  var spanY = de.scrollHeight - window.innerHeight;
  var pct = spanY > 4 ? Math.round(window.pageYOffset / spanY * 100) : 0;
  if(pct < 0) pct = 0; else if(pct > 100) pct = 100;
  var barI = box.querySelector('.tc-bar i');
  if(barI) barI.style.width = pct + '%';
  var pgB = box.querySelector('.tc-pg b');
  if(pgB) pgB.textContent = pct + '%';
}
var _tocTick = 0;
function tocSpySoon(){
  if(_tocTick) return;

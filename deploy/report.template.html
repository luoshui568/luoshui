function renderMods(){
  var box = $('mods');
  if(!St.mods.length){
    box.innerHTML =
      '<div class="rpt-empty"><div class="big">📄</div>' +
      '<h3>这份研报还没有内容</h3>' +
      '<p>数据库里 <code>wb_reports</code> 还没有 <b>' + esc(St.code || '(未指定代码)') + '</b> 的记录。' +
      '点右上角的「✏️ 编辑数据」→「数据管理面板」可以新建一份研报并逐个模块填写；' +
      '也可以从工作台的标的列表里点标的名称进入。</p></div>';
    return;
  }
  var h = '';
  /* 「一句话本质」插在**最后一个模块**之前。
     ⚠️ 原先写死 String(m.no) === '31' —— 但 600456 已从 31 模块精简为 29 模块
     （2026-09-17 删掉「估值敏感性」「公司股价表现」两篇），写死编号会让它的
     essence 直接不显示。改成"最后一个"后，31 模块的报告与 29 模块的报告都对。
     St.mods 来自 order=seq.asc，最后一项即序号最大的模块。 */
  var _lastMod = St.mods.length ? St.mods[St.mods.length - 1] : null;
  St.mods.forEach(function(m){
    if(m === _lastMod && St.rep.essence_html) h += St.rep.essence_html;
    h += '<div class="card" id="m' + attr(m.no) + '" data-mod="' + attr(m.id) + '">' +
           '<h2><span class="no">' + esc(m.no) + '</span>' + (m.title || '') + '</h2>' +
           '<div class="rpt-ops">' +
             '<button class="rbtn sm" onclick="Rpt.openMod(\'' + escq(m.id) + '\')">✏️ 编辑本模块</button>' +
           '</div>' +
           (m.html || '') +
         '</div>';
  });
  box.innerHTML = h;
  stackWide(box);
  /* 槽 29 评分卡的「动态调整」也在渲染层接（见下方 scoreLive 段）——
     ★ 必须排在这之后：它要读 `.sc-line` / `.sc-bar` 的最终 DOM。 */
  scoreLive(box);
  /* ⚠️ 顺序不能反：tlFit 会改列宽 ⇒ 改折行 ⇒ 改「有没有被截断」，
     必须先定宽度再判截断，否则「展开全文」标记会按旧折行算错。 */
  tlFit();
  histEnhance();
  /* ⚠️ 第三件事不是多余的：histEnhance 给被截断的卡片补了「展开全文」条 ⇒ 卡片变高
     ⇒ 上排底边上移、dot 行下移，tlFit 里量的 --tl-mid 到这儿已经过期（实测偏 24px）。
     重摆一次箭头（顺带重算「到头了没」）。 */
  tlArrowPos();
}

/* ---------------------------------------------------------------- 时间轴卡片
   截断 + 「展开全文」弹窗（2026-10-14）
   —— 卡片正文由 CSS 截到 7 行（.hist .h-card .h-txt，见 report_theme.css），
      这里做两件事：① 标出**真的被截了**的卡片 → 补一枚「展开全文」；② 点击弹全文。
   —— ★ 全文只从卡片自身的 DOM（.h-txt 的 innerHTML）取，**不往库里加任何字段**：
      已入库的研报 HTML 一个字都不用改，改 CSS + 这一处 JS 就是全站生效。
   —— 检测截断用 scrollHeight > clientHeight：实测在 -webkit-line-clamp 下准确
      （被截元素 clientHeight 停在 7 行、scrollHeight 仍是全文高）。
   —— 幂等：重复调用不会叠出第二枚 .h-more，也不会把没截的卡片留成可点。 */
var Hist = {idx: 0};

/* ---------------------------------------------------------------- 时间轴列宽（2026-10-14 第二轮）
   为什么要有这个函数：列宽 = 「容器宽 ÷ 节点数」，纯 CSS 算不出来（1fr 均分能算，
   但算出来的结果在 10 个节点时只有 ~100px，卡片会被挤成竖条）。所以由 JS 实测后
   写进 --tl-w，CSS 那边用 grid-auto-columns:var(--tl-w) 固定列宽。
   ★ 口径：**一屏放得下就不滚动**（fit ≥ 138px 直接用），放不下才拉回 152px 的可读
     宽度、把溢出交给 .h-track 横向滚动，并挂 .tl-scroll 让「左右滑动」提示显形。
   ★ 幂等：反复调用只换变量值，不往 DOM 塞东西（除了一枚 .tl-hint）。 */
/* 口径常量（写成函数内字面量而不是模块级 var：renderMods 可能在本脚本顶层语句
   执行完之前就被调用，那时 var 还是 undefined，会写出 "undefinedpx" 这种废值） */
/* ---------------------------------------------------------------- 时间轴左右导航箭头
   （2026-10-14 第三轮 · 用户口径「在 1、2 位置加左右箭头，半透明，隐约可见就行，
     点左边的往左移、右边的往右移」）
   ★ 只在「真的滚得动」时才存在（tlFit 里按需建/拆）⇒ 一屏放得下的研报不会多出两个
     按不动的按钮；无脚本环境自然退化成「没有箭头」，不会留一个死按钮。
   ★ 用 createElement + addEventListener，不写内联 onclick：箭头是动态生成的，
     内联 onclick 需要往 window 上挂函数名，等于给页面加隐式全局 API。
   ★ 一次滚 3 列（最少 180px）：用户点一下的预期是「翻一屏」，而不是挪一格。 */
function tlNavBtn(dir, h, tk){
  var b = document.createElement('button');
  b.type = 'button';
  b.className = 'tl-nav ' + dir;
  b.title = (dir === 'prev' ? '向前翻看' : '向后翻看');
  b.setAttribute('aria-label', b.title);
  b.innerHTML = '<i></i>';
  b.addEventListener('click', function(e){
    e.preventDefault(); e.stopPropagation();
    var w = parseFloat(getComputedStyle(h).getPropertyValue('--tl-w')) || 152;
    var d = (dir === 'prev' ? -1 : 1) * Math.max(180, w * 3);
    /* Safari 15.4 以下没有 scrollBehavior：会静默忽略 options 对象，必须显式降级 */
    if('scrollBehavior' in document.documentElement.style) tk.scrollBy({left: d, behavior: 'smooth'});
    else tk.scrollLeft += d;
  });
  return b;
}
/* 滚到头的那一侧把箭头压灰（压灰 ≠ 隐藏：用户还能看见「那边是终点」） */
function tlArrows(h){
  var tk = h.querySelector('.h-track'); if(!tk) return;
  var max = tk.scrollWidth - tk.clientWidth;
  var p = h.querySelector('.tl-nav.prev'), n = h.querySelector('.tl-nav.next');
  if(p) p.disabled = tk.scrollLeft <= 1;
  if(n) n.disabled = tk.scrollLeft >= max - 1;
}
/* 把箭头纵向摆到 dot 行上 —— 单独一支，因为它**要在 histEnhance() 之后再跑一次**：
   histEnhance 给被截断的卡片补「展开全文」条 ⇒ 卡片变高 ⇒ 上排底边上移、dot 行**下移**，
   tlFit 里量到的 --tl-mid 到这时已经过期（实测偏 24px，40px 的箭头下缘正好压住卡片底边）。
   ⚠️ 用 dot 的实测中心：拿 .h-track 高度的一半会整体偏下一截 —— .h-nodes 上内边距 20px、
      卡片下外边距 30px 并不对称，半个高度根本不落在 dot 行上。 */
function tlArrowPos(){
  var hs = document.querySelectorAll('#mods .hist');
  for(var i = 0; i < hs.length; i++){
    var h = hs[i];
    var dot = h.querySelector('.h-dot');
    if(dot){
      var hb = h.getBoundingClientRect(), db = dot.getBoundingClientRect();
      if(db.height) h.style.setProperty('--tl-mid', (db.top + db.height / 2 - hb.top).toFixed(1) + 'px');
    }
    tlArrows(h);
  }
}

function tlFit(){
  var MIN_FIT = 132;      /* 一屏放得下就不滚动的下限。实测轨道可视宽 976px：
                             7 节点 → 每列 137px（放得下，不滚动）；9 节点 → 106px（太窄，拉回 152 滑动）。
                             132 是「每行还能排 10 个字」的底线，再窄就不如让用户滑。 */
  var READABLE = 152;     /* 滑动态每列宽度：正文盒 ~128px，每行约 11 字 */
  var WMAX = 260;         /* 节点很少时别把卡片拉成横幅 */
  var narrow = false;
  try{ narrow = window.matchMedia('(max-width:860px)').matches; }catch(e){}
  var hs = document.querySelectorAll('#mods .hist');
  for(var i = 0; i < hs.length; i++){
    var h = hs[i], nd = h.querySelector('.h-nodes'), tk = h.querySelector('.h-track');
    if(!nd || !tk) continue;
    var prev = h.querySelector('.tl-nav.prev'), next = h.querySelector('.tl-nav.next');
    var hint0 = h.querySelector('.tl-hint');
    var drop = function(el){ if(el && el.parentNode) el.parentNode.removeChild(el); };
    if(narrow){
      /* ⚠️ 竖排版式下 .h-track 是 overflow:visible，横向滚根本不存在 ——
         把「滑动模式」的全套产物撤干净，别留假提示／假箭头骗人去横滑。
         （CSS 里那两条 display:none!important 是同义兜底：tlFit 可能在窄屏下没被
          调用过，那时靠 CSS 也得藏住。） */
      h.className = h.className.replace(/\s*tl-scroll/g, '');
      drop(prev); drop(next); drop(hint0);
      continue;
    }
    var n = nd.querySelectorAll('.h-node').length;
    if(!n) continue;
    var avail = (tk.clientWidth || tk.getBoundingClientRect().width) - 16;   /* .h-nodes 左右各 8px */
    if(avail <= 0) continue;
    var fit = Math.floor(avail / n);
    var w = fit >= MIN_FIT ? Math.min(WMAX, fit) : READABLE;
    h.style.setProperty('--tl-w', w + 'px');
    var scrolls = n * w > avail + 1;
    h.className = h.className.replace(/\s*tl-scroll/g, '') + (scrolls ? ' tl-scroll' : '');
    if(scrolls){
      if(!prev) h.appendChild(tlNavBtn('prev', h, tk));
      if(!next) h.appendChild(tlNavBtn('next', h, tk));
      /* 滚动中要实时刷新「到头了没」；一个元素只挂一次监听（用属性当开关） */
      if(!tk.getAttribute('data-tlnav')){
        tk.setAttribute('data-tlnav', '1');
        tk.addEventListener('scroll', function(ev){
          var t = ev.currentTarget;
          var ph = t.closest ? t.closest('.hist') : null;
          if(ph) tlArrows(ph);
        }, {passive: true});
      }
    } else {
      drop(prev); drop(next);
    }
    var hint = h.querySelector('.tl-hint');
    if(scrolls){
      if(!hint){
        hint = document.createElement('div');
        hint.className = 'tl-hint';
        h.appendChild(hint);
      }
      hint.innerHTML = '点左右箭头或双指横滑，查看全部 <b>' + n + '</b> 个年份 · 点卡片看完整正文';
    } else if(hint){
      drop(hint);
    }
  }
  tlArrowPos();
}

function histCards(){ return document.querySelectorAll('#mods .hist .h-card'); }
function histEnhance(){
  var cs = histCards();
  for(var i = 0; i < cs.length; i++){
    var c = cs[i], t = c.querySelector('.h-txt');
    if(!t) continue;
    var cut = t.scrollHeight > t.clientHeight + 1;
    var more = c.querySelector('.h-more');
    if(cut){
      c.className = c.className.replace(/\s*has-more/g, '') + ' has-more';
      if(!more){
        more = document.createElement('span');
        more.className = 'h-more';
        more.innerHTML = '展开全文 <i>›</i>';
        c.appendChild(more);
      }
    } else {
      c.className = c.className.replace(/\s*has-more/g, '');
      if(more) c.removeChild(more);
    }
  }
}
/* ---------------------------------------------------------------- 模块正文「解读块」
   默认折起，点标题**就地**展开 / 收起（2026-10-14 用户令）
   —— 模块正文里 389 个 <div class="logic"><div class="lt">标题</div><div class="lv">正文</div></div>，
      正文最短 55 字、中位 317 字、最长 1412 字，把每一段都摊在页面上 ⇒ 模块变成「密集长文」。
      用户先要「隐藏 + 点击弹窗」，随即改口：「不要弹窗，改成点击展开和隐藏，默认全部隐藏」。
   —— ★ 折/展**完全由 CSS 负责**（report_theme.css 的 .logic 段：`.lv{display:none}`，
      加 `.on` 就 display:block）；这里只切一个类 ⇒ 全站 389 个块、11 份研报
      **一个字都不用改库**，以后新建的研报自动生效。
   —— ★ 多个块可以同时展开（不做手风琴）：读者经常要对照同一模块里的两条解读。
   —— ★ 只切类、不动 DOM ⇒ 不重排整棵子树，展开是纯布局变化，没有闪烁。 */
function logicToggle(b){
  if(!b) return;
  if(b.classList){ b.classList.toggle('on'); return; }
  var cur = ' ' + (b.className || '') + ' ';
  b.className = cur.indexOf(' on ') >= 0
    ? String(b.className).replace(/(^|\s)on(?=\s|$)/g, ' ').replace(/\s+/g, ' ').trim()
    : (b.className ? b.className + ' on' : 'on');
}
/* 点解读条就地展开 / 收起。用事件委托挂一次 ⇒ 换研报 / 编辑保存重渲染后依然有效。
   ⚠️ 正在划词复制时不抢点击 —— 否则用户想选中正文里的数字会把它折起来。 */
document.addEventListener('click', function(e){
  var t = e.target;
  if(!t || !t.closest) return;
  var blk = t.closest('#mods .logic');
  if(!blk) return;
  try{ if(String(window.getSelection() || '').trim()) return; }catch(err){}
  logicToggle(blk);
});
/* 点卡片开弹窗。用事件委托挂一次就够，卡片重渲染（编辑保存 / 换研报）后依然有效。
   ⚠️ 正在划词复制时不抢点击 —— 否则用户想选中卡片里的数字会被弹窗打断。 */
document.addEventListener('click', function(e){
  var t = e.target;
  if(!t || !t.closest) return;
  var card = t.closest('.h-card');
  if(!card || !card.closest('#mods .hist')) return;
  try{ if(String(window.getSelection() || '').trim()) return; }catch(err){}
  Rpt.hist(card);
});
/* ESC 关弹窗，左右方向键翻上一条 / 下一条。 */
window.addEventListener('keydown', function(e){
  /* 资料预览（550）压在资料库（545）之上 ⇒ 必须从最上层往下判 */
  var vm = $('rptVMask');
  if(vm && vm.className.indexOf('on') >= 0){
    if(e.key === 'Escape') Rpt.closeView();
    return;
  }
  var fm = $('rptFMask');
  if(fm && fm.className.indexOf('on') >= 0){
    if(e.key === 'Escape') Rpt.closeFiles();
    return;
  }
  var hm = $('rptHMask');
  if(hm && hm.className.indexOf('on') >= 0){
    if(e.key === 'Escape') Rpt.closeHist();
    else if(e.key === 'ArrowLeft') Rpt.histNav(Hist.idx - 1);
    else if(e.key === 'ArrowRight') Rpt.histNav(Hist.idx + 1);
  }
});
/* 字体 / 视口变化会让折行数变化 → 重新判一次截断（防抖） */
var _histTick = 0;
window.addEventListener('resize', function(){
  if(_histTick) clearTimeout(_histTick);
  _histTick = setTimeout(function(){ _histTick = 0; tlFit(); histEnhance(); tlArrowPos(); }, 160);
});

/* ----------------------------------------------------------------
   并排 → 整行（2026-09-17）
   模块正文里图文并排用的是 .grid2（1fr 1fr 两栏）。用户要求「表格/图表独占一行，
   文字放到下面」。这里做**渲染层归一**：
     · 只处理「含表格或图表」的 .grid2 —— 纯文字并排（如「治理特征 / 需关注」）保持两栏；
     · 给视觉子块加 .gr-vis、纯文字子块加 .gr-txt，容器加 .gr-stack；
     · 把文字子块 appendChild 到末尾（appendChild 对已有节点是"移动"）⇒ DOM 顺序变成
       「图/表在前、文字在后」，也就是阅读顺序 = 图在上、字在下。
   ★ 为什么不在库里改 HTML：43 处 .grid2 分布在 5 份研报里，逐条改要写 5 次库，
     还会被网页端在线编辑覆盖。渲染层改一次，全库（含以后新建的研报）都生效。
   ★ 为什么不用 :has() 选择器：老一点的手机浏览器（旧版微信内核）不支持，
     会出现「有时并排、有时整行」的不确定渲染。这里判据是确定的。
   ★ 高度/间距/卡片语言全在 build/report_theme.css 的 .grid2.gr-stack 段里，
     注意 -- 模块级 CSS 必须落那个文件（sanitizeHtml 会剥掉模块内的样式表）。
   ---------------------------------------------------------------- */
function addCls(el, c){
  if(!el) return;
  var cur = ' ' + (el.className || '') + ' ';
  if(cur.indexOf(' ' + c + ' ') < 0) el.className = (el.className ? el.className + ' ' : '') + c;
}
function stackWide(root){
  if(!root) return;
  var gs = root.querySelectorAll('.grid2');
  for(var i = 0; i < gs.length; i++){
    var g = gs[i], kids = g.children, vis = [], txt = [];
    for(var j = 0; j < kids.length; j++){
      var k = kids[j];
      if(k.nodeType !== 1) continue;
      if(k.querySelector('table,[data-chart],canvas,svg')) vis.push(k);
      else txt.push(k);
    }
    if(!vis.length) continue;                    /* 纯文字并排 → 保持两栏 */
    /* ★ 两张图并排（2026-09-20 用户要求：「两张图放到同一行」）
       子块**全是图**、没有文字子块、没有表格、且正好两块 ⇒ 保持 .grid2 两栏不拉通。
       容器加 .gr-pair、子块加 .gr-vis；高度/间距走 report_theme.css 的 .grid2.gr-pair 段。
       ★ 判据为什么这么定：含表格的两栏会挤（表格要宽度）⇒ 仍拉通；
         图 + 文字则要「图在上、字在下」⇒ 也仍拉通。只有「纯一对图」才并排。
       ★ 影响面实测：全库 43 处 .grid2 里只有一处命中（600456「上游原料价格」），
         其余 37 处含表格/文字、5 处纯文字 —— 所以这个分支只改那一处。 */
    var anyTbl = false;
    for(var t0 = 0; t0 < vis.length; t0++){ if(vis[t0].querySelector('table')) anyTbl = true; }
    if(!txt.length && vis.length === 2 && !anyTbl){
      addCls(g, 'gr-pair');
      for(var p0 = 0; p0 < vis.length; p0++) addCls(vis[p0], 'gr-vis');
      continue;
    }
    for(var t = 0; t < txt.length; t++) g.appendChild(txt[t]);
    for(var v = 0; v < vis.length; v++) addCls(vis[v], 'gr-vis');
    for(var t2 = 0; t2 < txt.length; t2++) addCls(txt[t2], 'gr-txt');
    addCls(g, 'gr-stack');
  }
}

/* ----------------------------------------------------------------
   并排窄栏：绘图区顶部留白加大（2026-09-20）
   ★ 起因：600456「上游原料价格」两张图并排（.gr-pair）后每栏只剩半宽，左图
     顶部居中的图例与峰顶的 markPoint 气泡（库里「最高」→「9.7」）落在同一水平
     线上，把「海绵钛均价(万元/吨)」尾部压住了。整行时图更宽、看不出重叠。
   ★ 试过把图例挪到左侧 —— 不行：y 轴名「万元/吨」在左上角，靠左的图例正好压上去。
   ★ 最终做法：只把绘图区顶部留白（grid.top）抬到 58px，图例保持居中、series
     数据与轴范围一律不动。半宽图少 18px 绘图高度无所谓，重叠消失。
   ★ 幂等：重复调用只是把 top 保持在 58。整行的图完全不碰。
   ---------------------------------------------------------------- */
function pairTopPad(slot, opt){
  if(!slot || !opt || !opt.grid || typeof opt.grid !== 'object') return;
  if(opt.grid instanceof Array) return;
  var p = slot.parentNode;
  while(p && p.nodeType === 1 && p !== document.body){
    var c = ' ' + (p.className || '') + ' ';
    if(c.indexOf(' gr-pair ') >= 0){
      if(!(opt.grid.top >= 58)) opt.grid.top = 58;
      return;
    }
    p = p.parentNode;
  }
}

/* ----------------------------------------------------------------
   槽 29「企业评分」动态调整（2026-09-22 用户令）
   「模块29这里做成动态调整，改右边评分整个总评分要加权改动，
     以后所有的做的新研报也要都这样」

   ★ 为什么放在壳里、不放模块 HTML 里：
     ① 模块 HTML 每次从数据库取，且要过 sanitizeHtml（脚本 / 输入框 / 样式表都会被剥）；
     ② 31 槽随时可能被网页端在线编辑覆盖；
     ③ 放渲染层 ⇒ 现存 10 家 + 以后新建的每一家**都自动拥有**，
        与 stackWide()「渲染层归一」是同一个道理。
   ★ 权重从哪来：优先 `.sc-line[data-w]`（build/score_lock.py 新版渲染会带），
     取不到就解析 `.sc-w` 的「10%」文本兜底（线上现存 10 家都是旧版渲染，靠这条）。
     两条都失败 ⇒ 整块**不接管**、页面保持原样 —— 宁可没有交互，也不猜权重。
   ★ 计分口径与后端逐字对齐（build/score_lock.py）：
       总分 = Σ（单项分 × 权重）× 10 ÷ 100（一位小数）
       评级 ≥85 重点看好 / ≥75 看好 / ≥65 观察 / ≥55 谨慎 / <55 回避
     两边不一致就会出现「页面显示一套、库里写着另一套」。
   ★ 调整先落浏览器本地（localStorage），点「💾 提交到数据库」才写库
     （2026-09-22 追加用户令：「这个数据改完要提交到数据库里去」）：
       · 写库走 Rpt.commitScore → 已有写通道（wb_report_mods 的 PATCH），
         并被 RGATE 表**自动挂上管理员密码门**（与「保存模块」同一套校验）；
       · 要写进库的那段 HTML 由 `scBuildHtml()` 拼 —— 它与后端
         `build/_score_patch.py` 的 `apply_scores()` 是**同一套定点替换**，
         两条路径产出的字节必须完全相同（`_sc_test.py` 里有逐字相等的断言）。
         ⇒ 只动「分数/条宽/总分/环形/徽标/评级/评分说明点名句」，
           KPI 8 格、逐项说明、母本额外段落一个字节都不动。
       · 提交前**必须先拿到模块原文**（St.mods 里的 html）当底稿：绝不能拿已经被
         交互改造过的实时 DOM 去序列化 —— 那会把 `data-sc-wired`、`.sc-live`、
         `--scp` 这些运行态标记写进库，下次加载就直接「接不上交互」了。
   ★ 本地留存带**基线校验** —— 库里分数一变（重新评分 / 人工改库 / 别人提交过）
     就丢弃过期调整，免得页面与库长期不一致。
   ★ 空分形态（十项全是「—」）也接管：未评分项按中性 6 分参与总分，实时条上明写这句
     —— 与后端 score_engine 的 NEUTRAL=6 同口径。
   ---------------------------------------------------------------- */
var SC_GRADE = [[85, '重点看好'], [75, '看好'], [65, '观察'], [55, '谨慎'], [0, '回避']];
var SC_NEUTRAL = 6;                  /* 未评分项参与总分的基准 —— 与 score_engine 同值 */

function scF1(x){                    /* 一位小数，整数不留 .0（与后端 %.1f 去尾一致） */
  var s = (Math.round(x * 10) / 10).toFixed(1);
  return s.slice(-2) === '.0' ? s.slice(0, -2) : s;
}
function scGrade(t){
  for(var i = 0; i < SC_GRADE.length; i++){ if(t >= SC_GRADE[i][0]) return SC_GRADE[i][1]; }
  return SC_GRADE[SC_GRADE.length - 1][1];
}
function scFn(v){
  if(v === null || v === undefined || v === '') return null;
  var f = parseFloat(String(v).replace(/[，,\s%]/g, '').replace('−', '-'));
  return isFinite(f) ? f : null;
}
function scEsc(s){
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function scCls(el, c, on){
  if(!el) return;
  var cur = ' ' + (el.className || '') + ' ', hit = cur.indexOf(' ' + c + ' ') >= 0;
  if(on && !hit) el.className += (el.className ? ' ' : '') + c;
  else if(!on && hit) el.className = cur.replace(' ' + c + ' ', ' ').replace(/^\s+|\s+$/g, '');
}
function scCode(){
  try{ if(typeof St !== 'undefined' && St && St.code) return String(St.code); }catch(e){}
  var m = /[?&]code=([^&]*)/.exec(location.search || '');
  return m ? decodeURIComponent(m[1]) : '';
}
function scLs(k, v){
  try{
    if(v === undefined) return JSON.parse(localStorage.getItem(k) || 'null');
    if(v === null) localStorage.removeItem(k); else localStorage.setItem(k, JSON.stringify(v));
  }catch(e){}
  return null;
}

/* 入口：把 root 下所有评分卡接上（幂等 —— 重渲染会换新节点，这里只防重复调用）
   ★ 回传接管成功的模块对象数组：生产代码忽略返回值，`_sc_test.py` 用它调用与线上
     完全同一个 `scBuildHtml()` 做「落库字节」比对 —— 不额外开测试专用入口。 */
function scoreLive(root){
  var cs = (root || document).querySelectorAll('.criteria'), out = [], m;
  for(var i = 0; i < cs.length; i++){
    m = scWire(cs[i]);
    if(m) out.push(m);
  }
  return out;
}

function scWire(crit){
  if(crit.getAttribute('data-sc-wired')) return null;
  var lines = crit.querySelectorAll('.sc-line');
  if(lines.length !== 10) return null;            /* 不是母本十项形态 → 不接管 */
  var items = [], i, ok = true;
  for(i = 0; i < lines.length && ok; i++){
    var ln = lines[i];
    var bar = ln.querySelector('.sc-bar'), val = ln.querySelector('.sc-val');
    if(!bar || !val){ ok = false; break; }
    var w = scFn(ln.getAttribute('data-w'));
    if(w === null){                               /* 旧版渲染（无 data-w）：从「10%」文本取 */
      var wt = ln.querySelector('.sc-w');
      var mm = wt ? /([0-9]+(?:\.[0-9]+)?)/.exec(wt.textContent || '') : null;
      w = mm ? parseFloat(mm[1]) : null;
    }
    if(!w){ ok = false; break; }
    var nm = ln.querySelector('.sc-name');
    items.push({
      line: ln, bar: bar, val: val, w: w, inp: null,
      name: (nm ? nm.textContent : ('第' + (i + 1) + ' 项')).replace(/加分项/g, '').trim(),
      base: scFn(val.textContent)                 /* 「—」→ null = 未评分 */
    });
  }
  if(!ok || items.length !== 10) return null;

  /* ★ 卡片要取**最近的带 data-mod 的祖先**，不能取 parentNode（2026-09-22 全链探头抓到）：
     模块正文里只要有一个没闭合的行内标签（002408 的 m1 就是：一处 `<b>` 的收尾写成了残留 `**`），
     后面的内容全会变成它的子节点 —— `.criteria` 的 parentNode 就成了那个 `<b>`，
     `parentNode.getAttribute('data-mod')` 取空 ⇒ `mod.html` 拿不到原文
     ⇒ 提交按钮永远弹「拿不到模块原文」。⇒ 向上找第一个 `[data-mod]`，对畸形嵌套免疫。 */
  var card = null, _p = crit;
  while(_p && _p !== document.body && _p.nodeType === 1){
    if(_p.getAttribute && _p.getAttribute('data-mod')){ card = _p; break; }
    _p = _p.parentNode;
  }
  card = card || crit.parentNode;

  /* ★ 取分一致性判据（2026-09-22）—— 别只信 `.sc-val` 的文本：
     文本与「条宽 + 存储总分」可能对不上。母本 600456 第 10 项就是文本写 5、
     条宽 60%、总分 70.5（手写笔误，三比一）—— 只看文本会把库里的 70.5 悄悄显示成 69.9。
     ⇒ 先按文本算总分；与 `.sc-total .tn` 对不上就改按**条宽**读，并在控制台留痕。
       与后端 build/_score_patch.parse_scores() 同一条规则。 */
  var tb = 0, ti;
  for(ti = 0; ti < 10; ti++){
    tb += (items[ti].base === null ? SC_NEUTRAL : items[ti].base) * items[ti].w;
  }
  var tnEl = card.querySelector('.sc-total .tn');
  var storedTn = tnEl ? scFn(tnEl.textContent) : null;
  if(storedTn !== null && Math.abs(Math.round(tb) / 10 - storedTn) > 0.05){
    var byBar = 0;
    for(ti = 0; ti < 10; ti++){
      var f0 = items[ti].bar.firstElementChild;
      var mw = f0 ? /width:\s*([0-9.]+)%/.exec(f0.getAttribute('style') || '') : null;
      if(mw){ items[ti].base = Math.round(parseFloat(mw[1]) / 10); byBar++; }
    }
    if(byBar === 10){
      try{
        console.warn('[槽29] .sc-val 文本与条宽/存储总分不一致 ⇒ 已按条宽取分'
                     + '（模块原文那一格可能是笔误，建议提交一次把它修正）');
      }catch(e){}
    }
  }

  /* 模块 id + **库里的原始 HTML**（提交时的唯一底稿 —— 必须取原文，不能序列化实时 DOM） */
  var modId = card.getAttribute('data-mod') || '';
  var srcMod = null;
  try{
    for(var q = 0; q < (St.mods || []).length; q++){
      if(String(St.mods[q].id) === String(modId)){ srcMod = St.mods[q]; break; }
    }
  }catch(e){}
  var mod = {
    crit: crit, items: items, touch: false, dirty: false,
    id: modId, no: (srcMod && srcMod.no) || '', html: (srcMod && srcMod.html) || '',
    bases: [], cur: [],
    gauge: card.querySelector('.gauge'),
    gw: card.querySelector('.gauge-wrap'),
    num: card.querySelector('.gauge-num'),
    badge: card.querySelector('.gauge-badge'),
    tn: card.querySelector('.sc-total .tn'),
    tt: card.querySelector('.sc-total .tt'),
    srcP: null, srcHTML: ''
  };
  for(i = 0; i < 10; i++){ mod.bases.push(items[i].base); mod.cur.push(items[i].base); }

  /* 评分说明段 = .criteria 后面那个 `p.src`（score_lock.render 的固定排版） */
  var nx = crit.nextElementSibling;
  while(nx && !(nx.tagName === 'P' && /\bsrc\b/.test(nx.className || ''))) nx = nx.nextElementSibling;
  if(nx){ mod.srcP = nx; mod.srcHTML = nx.innerHTML; }

  /* 本地留存（带基线校验：库里的初评变了就丢弃，避免页面与库长期不一致） */
  mod.key = 'wb.sc.' + scCode() + '.' + (card.getAttribute('data-mod') || 'm29');
  var st = scLs(mod.key);
  if(st && st.b === mod.bases.join(',') && st.s && st.s.length === 10){
    for(i = 0; i < 10; i++) mod.cur[i] = scFn(st.s[i]);
  } else if(st){ scLs(mod.key, null); }

  scCls(crit, 'sc-live', true);
  crit.setAttribute('data-sc-wired', '1');

  /* —— 每行：分数输入框 + 可拖动进度条 + 键盘 —— */
  for(i = 0; i < 10; i++) scWireLine(mod, i);

  /* —— 实时条 ——
     ⚠️ 类名用 `sc-livebar`，**不能叫 `sc-live`**：那个名字已经被「评分卡状态」占用
        （上面给 crit 加的 `sc-live`），而 CSS 里 `.sc-live{display:flex}` 会把 .criteria
        本身变成 flex 容器 —— 标题条被压成 168px、总分条并排跑（2026-09-22 实测踩过）。 */
  var live = document.createElement('div');
  live.className = 'sc-livebar';
  live.innerHTML =
    '<span class="lv-hint">🎚️ 拖动进度条 / 直接改右边分数 —— 总分与评级按权重实时重算；' +
    '改完点「💾 提交到数据库」固化</span>' +
    '<span class="lv-sp"></span>' +
    '<span class="lv-chip lv-blank" style="display:none">未评分项按中性 ' + SC_NEUTRAL + ' 分计</span>' +
    '<span class="lv-chip lv-base">初评 <b>' + scF1(scTotal(mod, mod.bases)) + '</b></span>' +
    '<span class="lv-chip lv-dirty" style="display:none">已调整 → <b></b></span>' +
    '<button class="lv-btn lv-reset" type="button" style="display:none">↺ 恢复初评</button>' +
    '<button class="lv-btn lv-save" type="button" style="display:none">💾 提交到数据库</button>' +
    '<button class="lv-btn lv-copy" type="button">⧉ 复制评分</button>';
  crit.appendChild(live);
  mod.chipBase = live.querySelector('.lv-base');
  mod.chipDirty = live.querySelector('.lv-dirty');
  mod.chipBlank = live.querySelector('.lv-blank');
  mod.btnReset = live.querySelector('.lv-reset');
  mod.btnSave = live.querySelector('.lv-save');
  mod.btnReset.addEventListener('click', function(){ scReset(mod); });
  mod.btnSave.addEventListener('click', function(){ scCommit(mod); });
  live.querySelector('.lv-copy').addEventListener('click', function(){ scCopyScore(mod); });

  scPaint(mod);
  return mod;
}

function scWireLine(mod, i){
  var it = mod.items[i], bar = it.bar;

  /* 分数直接改：type=number（保留 ↑↓ 键），去掉原生上下箭头保持母本字形 */
  var inp = document.createElement('input');
  inp.type = 'number'; inp.className = 'sc-inp';
  inp.min = '0'; inp.max = '10'; inp.step = '1';
  inp.setAttribute('inputmode', 'numeric');
  inp.setAttribute('aria-label', it.name + ' 得分');
  inp.value = (it.base === null ? '' : String(it.base));
  it.val.textContent = '';
  it.val.appendChild(inp);
  it.inp = inp;
  inp.addEventListener('input', function(){
    var v = scFn(this.value);
    if(v !== null) v = Math.max(0, Math.min(10, Math.round(v * 10) / 10));
    scSet(mod, i, v, i, false);                  /* skipInp=i：别把正在输入的值写回去 */
  });
  inp.addEventListener('change', function(){ scSet(mod, i, scFn(this.value), i, true); });
  inp.addEventListener('blur', function(){
    var v = scFn(this.value);
    scSet(mod, i, v === null ? null : Math.max(0, Math.min(10, Math.round(v * 10) / 10)), i, true);
  });

  /* 进度条拖动：自己算比例（不用原生 range —— 原生 thumb 宽度会让「末端对不齐」） */
  bar.setAttribute('tabindex', '0');
  bar.setAttribute('role', 'slider');
  bar.setAttribute('aria-label', it.name + ' 得分，可拖动调整');
  bar.setAttribute('aria-valuemin', '0');
  bar.setAttribute('aria-valuemax', '10');
  function fromX(clientX){
    var r = bar.getBoundingClientRect();
    var p = r.width ? (clientX - r.left) / r.width : 0;
    return Math.max(0, Math.min(10, Math.round(p * 10)));
  }
  bar.addEventListener('pointerdown', function(e){
    if(e.button){ return; }
    e.preventDefault();
    scCls(it.line, 'sc-drag', true);
    mod.dragId = e.pointerId;
    try{ bar.setPointerCapture(e.pointerId); }catch(err){}
    scSet(mod, i, fromX(e.clientX), -1, false);
  });
  bar.addEventListener('pointermove', function(e){
    if(mod.dragId === undefined || e.pointerId !== mod.dragId) return;
    e.preventDefault();
    scSet(mod, i, fromX(e.clientX), -1, false);
  });
  function endDrag(e){
    if(mod.dragId === undefined || (e && e.pointerId !== mod.dragId)) return;
    mod.dragId = undefined;
    scCls(it.line, 'sc-drag', false);
    try{ bar.releasePointerCapture(e.pointerId); }catch(err){}
    scPersist(mod);
  }
  bar.addEventListener('pointerup', endDrag);
  bar.addEventListener('pointercancel', endDrag);
  bar.addEventListener('keydown', function(e){
    var k = e.key, v = (mod.cur[i] === null ? SC_NEUTRAL : mod.cur[i]), nv = null;
    if(k === 'ArrowRight' || k === 'ArrowUp') nv = v + 1;
    else if(k === 'ArrowLeft' || k === 'ArrowDown') nv = v - 1;
    else if(k === 'Home') nv = 0;
    else if(k === 'End') nv = 10;
    if(nv === null) return;
    e.preventDefault();
    scSet(mod, i, Math.max(0, Math.min(10, nv)), -1, true);
  });
}

function scV(mod, i){ return mod.cur[i] === null ? SC_NEUTRAL : mod.cur[i]; }
function scTotal(mod, arr){
  var sum = 0;
  for(var i = 0; i < 10; i++){
    var v = arr[i];
    sum += (v === null || v === undefined ? SC_NEUTRAL : v) * mod.items[i].w;
  }
  return Math.round(sum) / 10;                   /* Σ(分×权重)÷10 = 母本公式的一位小数总分 */
}
/* 纯数组版（供落库变换用，不依赖 DOM）—— 与 scTotal 同口径 */
function scTotalW(scores, ws){
  var sum = 0;
  for(var i = 0; i < 10; i++) sum += scores[i] * ws[i];
  return Math.round(sum) / 10;
}

/* ============================================================================
   落库变换：把十项分数写进**模块原文**，产出要 PATCH 的 HTML
   —— 与后端 build/_score_patch.py 的 apply_scores() 是同一套定点替换，
      两条路的字节必须完全相同（_sc_test.py 有逐字相等断言）。
   ★ 只动这 7 类：sc-bar 里的 <i>、sc-val、.gauge 样式、.gauge-num、.gauge-badge、
      .g-sub、.tn/.tt、以及「评分说明」里的点名句。
   ★ 点名句「自洽即保留」（scNoteConsistent）：句中「（第 N 项，S 分）」都对得上当前分数
      就一字不动 —— 母本那句是手写的、比机械版更准确；只有改了分导致对不上才重算。
   ★ `data-w` 一律不动（有就保留、没有也不补 —— 补了会改变线上存量 10 家的字节）。
   ★ 点名句里的项名**按原文插入、不做实体转义**：后端 _eval_note 就是这么拼的
      （线上现存表述里就有 `主营集中 > 75%` 这种裸 >），转义了就不逐字相等了。
   ============================================================================ */
function scBarTag(s){
  return '<i class="' + (s >= 8 ? 'hi' : (s >= 5 ? 'mid' : 'low')) +
         '" style="width:' + Math.round(s * 10) + '%;"></i>';
}
function scNoteSentence(scores, names){
  var i, j, idx = [];
  for(i = 0; i < 10; i++) idx.push(i);
  idx.sort(function(a, b){ return (scores[b] - scores[a]) || (a - b); });
  var best = [], worst = [], rev = idx.slice().reverse();
  for(i = 0; i < 10 && best.length < 3; i++){ if(scores[idx[i]] >= 8) best.push(idx[i]); }
  if(!best.length) best = idx.slice(0, 3);
  for(i = 0; i < 10 && worst.length < 2; i++){ if(scores[rev[i]] <= 5) worst.push(rev[i]); }
  function fmt(lst){
    var out = [];
    for(j = 0; j < lst.length; j++){
      var k = lst[j];
      out.push(names[k] + '（第 ' + (k + 1) + ' 项，' + Math.trunc(scores[k]) + ' 分）');
    }
    return out.join('、');
  }
  return (best.length ? '主要得分项为<strong>' + fmt(best) + '</strong>' : '') +
         (worst.length ? '；主要扣分项为<strong>' + fmt(worst) + '</strong>' : '') + '。';
}
/* 规范版整段（空分「填写说明」→ 有分「评分说明」时整段替换用，与 _eval_note 逐字一致） */
function scNoteCanon(scores, names){
  return '<b>评分说明：</b>总分 = Σ（单项评分 × 权重）× 10，满分 100。' +
    scNoteSentence(scores, names) +
    '本表由<b>规则化评分引擎</b>依公开数据自动生成（判据见各项括注与图表口径），' +
    '分数可复算、可追溯；评分属定性判断，<b>仅供参考，不构成投资建议</b>。';
}
/* 点名句「自洽即保留」——与后端 _score_patch.note_consistent() 同一判据。
   句中每处「（第 N 项，S 分）」都等于当前该项分数 ⇒ 这句此刻是准确的，一字不动。
   为什么：母本那句是手写的（点 4 项、项名是人话），机械版只点 3 项、项名是判据原文、
   还漏第 6 项 —— 无条件重写＝把好东西换成差东西。改了分导致对不上时才重算。 */
function scNoteConsistent(body, scores){
  var re = /（第\s*(\d+)\s*项[，,]\s*(-?\d+)\s*分）/g, m, n = 0;
  while((m = re.exec(body))){
    n++;
    var i = parseInt(m[1], 10) - 1;
    if(i < 0 || i > 9 || parseInt(m[2], 10) !== scores[i]) return false;
  }
  return n > 0;
}
function scBuildHtml(mod, scores){
  var html = mod.html;
  if(!html) return null;
  var i, ws = [], names = [];
  for(i = 0; i < 10; i++){ ws.push(mod.items[i].w); names.push(mod.items[i].name); }
  var total = scTotalW(scores, ws), rating = scGrade(total), num = scF1(total);

  /* 1) 十条进度条：有 <i> 就原地换（保留周围空白），没有就插在开标签后 */
  var bi = 0;
  html = html.replace(/(<div class="sc-bar">)([\s\S]*?)(<\/div>)/g, function(m, a, inner, c){
    var tag = scBarTag(scores[bi++]);
    return a + (/<i\b[^>]*>\s*<\/i>/.test(inner) ? inner.replace(/<i\b[^>]*>\s*<\/i>/, tag) : tag + inner) + c;
  });
  /* 2) 十个得分格 */
  var vi = 0;
  html = html.replace(/(<div class="sc-val">)([\s\S]*?)(<\/div>)/g, function(m, a, x, c){
    return a + String(scores[vi++]) + c;
  });
  /* 3) 环形刻度 */
  html = html.replace(/(<div class="gauge" style=")[^"]*(">)/, function(m, a, c){
    return a + 'background:conic-gradient(#c8102e 0 ' + num + '%, #f6e6e9 ' + num + '% 100%);' + c;
  });
  /* 4) 环内数字  5) 徽标  6) 副标题（报告日从原文抠，不重算） */
  html = html.replace(/(<div class="gauge-num">)[\s\S]*?(<small>)/, function(m, a, c){ return a + num + c; });
  html = html.replace(/(<div class="gauge-badge">)[\s\S]*?(<\/div>)/, function(m, a, c){
    return a + '评级 · ' + rating + c;
  });
  var gs = /<div class="g-sub">([\s\S]*?)<\/div>/.exec(html);
  if(gs){
    var dm = /报告日\s*([\s\S]*?)\s*$/.exec(gs[1].replace(/<[^>]+>/g, ''));
    var sub = '参照选股原则 10 项' + (dm ? (' · 报告日 ' + dm[1]) : '');
    html = html.replace(/(<div class="g-sub">)[\s\S]*?(<\/div>)/, function(m, a, c){ return a + sub + c; });
  }
  /* 7) 底部总分 / 评级 */
  html = html.replace(/(<span class="tn">)[\s\S]*?(<\/span>)/, function(m, a, c){ return a + num + c; });
  html = html.replace(/(<span class="tt">)[\s\S]*?(<\/span>)/, function(m, a, c){
    return a + '评级：' + rating + c;
  });
  /* 8) 评分说明段：只换「主要得分项…。」那一句，前后措辞原样保留（母本是手写措辞，别偷换）。
        ① 点名句与当前分数自洽 ⇒ 一字不动；② 存在但对不上 ⇒ 重算该句；③ 没有 ⇒ 补一句。 */
  var sent = scNoteSentence(scores, names);
  html = html.replace(/(<p class="src"[^>]*>)([\s\S]*?)(<\/p>)/g, function(m, a, body, c){
    if(body.indexOf('填写说明：</b>') >= 0) return a + scNoteCanon(scores, names) + c;
    if(body.indexOf('评分说明：</b>') >= 0){
      if(body.indexOf('主要得分项为') >= 0 && scNoteConsistent(body, scores)) return a + body + c;
      if(body.indexOf('主要得分项为') >= 0) body = body.replace(/主要得分项为[\s\S]*?。/, sent);
      else if(sent) body = body.replace(/。/, '。' + sent);
      return a + body + c;
    }
    return m;
  });
  return html;
}

/* 提交到数据库：校验 → 拼 HTML → 走 RGATE 密码门写库 */
function scCommit(mod){
  var i, scores = [];
  for(i = 0; i < 10; i++){
    var v = mod.cur[i];
    if(v === null){
      if(typeof toast === 'function') toast('请先把十项分数都填上 —— 空着的那几项没法定分', 'bad');
      return;
    }
    if(!Number.isInteger(v)){
      if(typeof toast === 'function'){
        toast('第 ' + (i + 1) + ' 项是小数（' + v + '）—— 十项都要 0-10 的整数才能提交', 'bad');
      }
      return;
    }
    scores.push(v);
  }
  if(!mod.html){
    if(typeof toast === 'function') toast('拿不到模块原文（St.mods 里没有），为免写坏已中止', 'bad');
    return;
  }
  var html;
  try{ html = scBuildHtml(mod, scores); }
  catch(e){ html = null; }
  if(!html){
    if(typeof toast === 'function') toast('拼装新内容失败，已中止（数据库未改动）', 'bad');
    return;
  }
  var old = mod.html;
  if(html === old){
    scLs(mod.key, null);
    if(typeof toast === 'function') toast('分数与库里一致 —— 无需提交', 'ok');
    scPaint(mod);
    return;
  }
  /* 写库。Rpt.commitScore 已被 RGATE 包过 ⇒ 这里会先弹管理员密码 */
  Rpt.commitScore(mod.id, html, mod.no).then(function(){
    scLs(mod.key, null);          /* 已入库 ⇒ 本地调整记录作废，避免与库不一致 */
  }).catch(function(e){
    if(typeof toast === 'function') toast('提交失败：' + String((e && e.message) || e).slice(0, 100), 'bad');
  });
}

function scSet(mod, i, v, skipInp, save){
  mod.cur[i] = v;
  mod.touch = true;
  scPaint(mod, {skipInp: skipInp});
  if(save) scPersist(mod);
}

function scPaint(mod, opt){
  opt = opt || {};
  var i, uv, sum = 0, dirty = false, blank = false, graded = false;
  for(i = 0; i < 10; i++){
    var it = mod.items[i], v = mod.cur[i];
    if(v === null){ blank = true; uv = SC_NEUTRAL; } else { uv = v; graded = true; }
    if(v !== it.base) dirty = true;
    sum += uv * it.w;
    var fill = it.bar.firstElementChild;
    if(!fill){ fill = document.createElement('i'); it.bar.appendChild(fill); }
    /* 未评分行：条按中性分显示但打 .guess（半透明）—— 总分要能解释得通，
       但不能让人误以为「这行已经评过了」；输入框空着、用 placeholder 提示基准分。 */
    fill.className = (uv >= 8 ? 'hi' : (uv >= 5 ? 'mid' : 'low')) + (v === null ? ' guess' : '');
    fill.style.width = (uv * 10) + '%';
    it.bar.style.setProperty('--scp', (uv * 10) + '%');
    it.bar.setAttribute('aria-valuenow', scF1(uv));
    if(it.inp && opt.skipInp !== i){
      it.inp.value = (v === null ? '' : String(v));
      it.inp.placeholder = (v === null ? String(SC_NEUTRAL) : '');
    }
  }
  var total = Math.round(sum) / 10, rating = scGrade(total), ts = scF1(total);

  /* 环形卡 / 总分条：与 score_lock.render() 的两种形态逐字对齐 */
  if(mod.num) mod.num.innerHTML = graded ? (ts + '<small>/100</small>') : '—<small>/100</small>';
  if(mod.gauge) mod.gauge.style.background = graded
    ? ('conic-gradient(#c8102e 0 ' + ts + '%, #f6e6e9 ' + ts + '% 100%)')
    : 'conic-gradient(#e6e5e3 0 100%)';
  if(mod.badge) mod.badge.textContent = graded ? ('评级 · ' + rating) : '待评分';
  if(mod.tn) mod.tn.textContent = graded ? ts : '—';
  if(mod.tt) mod.tt.textContent = graded ? ('评级：' + rating) : '待评分';

  scCls(mod.gw, 'sc-dirty', dirty && graded);
  if(mod.chipBase) mod.chipBase.style.display = graded ? '' : 'none';
  if(mod.chipBlank) mod.chipBlank.style.display = blank ? '' : 'none';
  if(mod.chipDirty){
    mod.chipDirty.style.display = (dirty && graded) ? '' : 'none';
    var b = mod.chipDirty.querySelector('b');
    if(b) b.textContent = ts;
  }
  if(mod.btnReset) mod.btnReset.style.display = (dirty && graded) ? '' : 'none';
  if(mod.btnSave) mod.btnSave.style.display = (dirty && graded) ? '' : 'none';
  mod.dirty = dirty;

  /* 评分说明段：未动过 → 还原线上原文；动过 → 按后端同款句式重写得分/扣分项点名
     ★ 给「临时调整版」打 `data-sc-dyn` 当稳定标记 —— 探针别去匹配散文措辞（文案一改就假失败）。
       这个属性只活在实时 DOM 上；落库用的是 mod.html 原文，不会把它写进库。 */
  if(mod.srcP){
    if(dirty && graded){
      mod.srcP.innerHTML = scNote(mod);
      mod.srcP.setAttribute('data-sc-dyn', '1');
    } else {
      if(mod.srcHTML) mod.srcP.innerHTML = mod.srcHTML;
      mod.srcP.removeAttribute('data-sc-dyn');
    }
  }
}

/* 与 score_lock._eval_note 同规则：分≥8 取前 3 为得分项（不足则取前三），分≤5 取 2 为扣分项 */
function scNote(mod){
  var idx = [], i;
  for(i = 0; i < 10; i++) idx.push(i);
  idx.sort(function(a, b){ return scV(mod, b) - scV(mod, a) || a - b; });
  var best = [], worst = [], rev = idx.slice().reverse();
  for(i = 0; i < 10 && best.length < 3; i++){ if(scV(mod, idx[i]) >= 8) best.push(idx[i]); }
  if(!best.length) best = idx.slice(0, 3);
  for(i = 0; i < 10 && worst.length < 2; i++){ if(scV(mod, rev[i]) <= 5) worst.push(rev[i]); }
  function fmt(lst){
    var out = [];
    for(var j = 0; j < lst.length; j++){
      var k = lst[j];
      out.push(mod.items[k].name + '（第 ' + (k + 1) + ' 项，' + scF1(scV(mod, k)) + ' 分）');
    }
    return out.join('、');
  }
  return '<p class="src" style="margin-top:12px;">'
    + '<b>评分说明：</b>总分 = Σ（单项评分 × 权重）× 10，满分 100。'
    + (best.length ? '主要得分项为<strong>' + scEsc(fmt(best)) + '</strong>' : '')
    + (worst.length ? '；主要扣分项为<strong>' + scEsc(fmt(worst)) + '</strong>' : '')
    + '。<b>以上为页面上的临时调整，尚未提交 —— 点「💾 提交到数据库」才会写回</b>；'
    + '本表由<b>规则化评分引擎</b>依公开数据自动生成（判据见各项括注与图表口径），'
    + '分数可复算、可追溯；评分属定性判断，<b>仅供参考，不构成投资建议</b>。</p>';
}

function scPersist(mod){
  var changed = false;
  for(var i = 0; i < 10; i++){ if(mod.cur[i] !== mod.bases[i]){ changed = true; break; } }
  scLs(mod.key, changed ? {b: mod.bases.join(','), s: mod.cur} : null);
}

function scReset(mod){
  for(var i = 0; i < 10; i++) mod.cur[i] = mod.bases[i];
  mod.touch = false;
  scLs(mod.key, null);
  scPaint(mod);
  if(typeof toast === 'function') toast('已恢复引擎初评分数', 'ok');
}

function scCopyScore(mod){
  var o = {};
  o[scCode() || 'report'] = mod.cur;
  var txt = JSON.stringify(o);
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(
        function(){ if(typeof toast === 'function') toast('已复制评分 JSON —— 发我即可固化成新初评', 'ok'); },
        function(){ scCopyFallback(txt); });
      return;
    }
  }catch(e){}
  scCopyFallback(txt);
}
function scCopyFallback(txt){
  var ta = document.createElement('textarea');
  ta.value = txt;
  ta.style.cssText = 'position:fixed;left:-9999px;top:0;';
  document.body.appendChild(ta);
  ta.select();
  var ok = false;
  try{ ok = document.execCommand('copy'); }catch(e){}
  document.body.removeChild(ta);
  if(typeof toast === 'function') toast(ok ? '已复制评分 JSON' : ('评分：' + txt), 'ok');
}

function renderFoot(){
  var h = (St.rep && St.rep.footer_html) || '';
  if(St.edit){
    h += '<div class="rpt-ops" style="position:static;display:flex;justify-content:center;margin-top:16px">' +
         '<button class="rbtn sm" onclick="Rpt.openDrawer(\'head\')">✏️ 编辑页脚 / 免责声明</button></div>';
  }
  $('foot').innerHTML = h;
}

/* ---------------------------------------------------------------- 图表 */
var FNS = {
  catBreak: function(){ return function(v){ return String(v).split(' ').join('\n'); }; },
  nullDash: function(){ return function(p){ return p.value == null ? '—' : p.value; }; },
  /* 吞掉「无意义的负刻度」（2026-10-15 用户令：「这个 0 轴两边对齐」）。
     天然非负的轴（股价 / 收入 / 产量）为了让自己的 0 刻度与另一条**有负值**的轴
     对齐，min 必须被下探到负数 —— 例如 600456 chart_eps 右轴股价 [−25, 75]，
     但「股价 −25 元」是句废话。与 btAlignZero 内部的 btHideNeg 同一口径，
     区别是这里走 opt 序列化通道（库里只存 JSON，渲染时由 {{fn:…}} 还原成函数）。 */
  hideNeg: function(){ return function(v){ return (typeof v === 'number' && v < 0) ? '' : v; }; },
  /* 同心双环（收入构成 / 毛利构成）的 tooltip（2026-10-14）。
     为什么不能用默认的 {b}: {d}%：内环是按**绝对值**作的图（负毛利画不进环形，
     实测 600456 其他金属产品毛利占比 −2.12%，环上只能按 2.12 的弧长画），
     所以 ECharts 的 {d} 给出的是归一化百分比，不是报告口径的真值。
     真值随数据点一起存库（data[i].tip），这里原样取用 ⇒ 环上是几何、弹层是真值。 */
  ringTip: function(){
    return function(p){
      var d = (p && p.data) || {};
      var t = d.tip || ((d.value == null ? '—' : d.value) + '%');
      return p.marker + p.name + '：' + t;
    };
  },
  unit: function(u){ return function(v){ return (v == null ? '—' : v) + u; }; },
  /* 地图 tooltip 的取值格式化（2026-09-20）。
     map series 的 data 里 `value: null` 表示「该地区无数据」——不能显示成 0，
     更不能显示成 NaN。ECharts 对 null 默认渲染 `-`，这里显式换成一句人话。
     ⚠️ 与 unit 的区别：unit 是「数值 + 单位」，这里是「有值给文本、无值给说明」，
        且**不附加单位**（单位由 formatter 模板自己带，避免出现两个单位）。 */
  nullText: function(t){
    var txt = t || '暂无数据';
    return function(v){
      if(v == null || v === '' || (typeof v === 'number' && isNaN(v))) return txt;
      return String(v).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    };
  },
  valUnit: function(u){ return function(p){ return p.value + u; }; },
  /* 指定数据点覆盖标签：第 idx 个点写成固定文案，其余照常显示数值
     （底稿里出现过：某年实际为负值 / 需附同比，标签要写成特例）
     ⚠️ 标记里不能带花括号，所以用 @c@ 代表「该点的数值」，这里自己拼进去。

     ★★ 血泪坑（贵研铂业 chartRev 踩过）：**绝不能返回字面量 '{c}'**。
        ECharts 只在 `formatter` 是**字符串模板**时才做 {a}/{b}/{c} 替换；
        一旦 formatter 是函数，返回值原样输出 → 图上会把 "{c}" 直接画出来。
        所以这里统一自己把数值拼好，目标点用文案、其余点用数值。 */
  idxText: function(a){
    var n = parseFloat(a[0]), t = a.slice(1).join(':');
    return function(p){
      var v = (p.value == null ? '' : p.value);
      if(p.dataIndex === n) return String(t).replace(/@c@/g, v);
      return v;
    };
  },
  idxColorList: function(list){
    return function(p){ return list[p.dataIndex] || list[0]; };
  },
  idxColorBreak: function(a){
    var n = parseFloat(a[0]), c1 = a[1], c2 = a[2];
    return function(p){ return p.dataIndex < n ? c1 : c2; };
  },
  stackSum: function(which, opt){
    var rb = seriesArr(opt, which === 'rev' ? '营业收入·存量' : '归母净利润·存量');
    var ra = seriesArr(opt, which === 'rev' ? '营业收入·募投增量' : '归母净利润·募投增量');
    return function(p){
      return ((rb[p.dataIndex] || 0) + (ra[p.dataIndex] || 0)).toFixed(1);
    };
  },
  forecastTip: function(_a, opt){
    var xa = Array.isArray(opt.xAxis) ? opt.xAxis[0] : opt.xAxis;
    var years = (xa && xa.data) || [];
    var rb = seriesArr(opt, '营业收入·存量'),   ra = seriesArr(opt, '营业收入·募投增量');
    var nb = seriesArr(opt, '归母净利润·存量'), na = seriesArr(opt, '归母净利润·募投增量');
    return function(ps){
      if(!ps || !ps.length) return '';
      var i = ps[0].dataIndex, out = [String(years[i]) + '年'];
      function f(v){ return (v == null ? 0 : v).toFixed(2); }
      if(i < 24){
        out.push('营业收入：' + f(rb[i]) + ' 亿（实际披露）');
        out.push('归母净利润：' + f(nb[i]) + ' 亿（实际披露）');
      } else {
        out.push('营业收入：' + f(rb[i]) + ((ra[i] || 0) > 0 ? ' + ' + f(ra[i]) + '（募投增量）' : '') + ' = ' + f((rb[i] || 0) + (ra[i] || 0)) + ' 亿');
        out.push('归母净利润：' + f(nb[i]) + ((na[i] || 0) > 0 ? ' + ' + f(na[i]) + '（募投增量）' : '') + ' = ' + f((nb[i] || 0) + (na[i] || 0)) + ' 亿');
        if((ra[i] || 0) === 0 && (na[i] || 0) === 0) out.push('※ 2026E-2028E建设期，增量为0');
        else out.push('※ 2029E起募投项目逐步投产');
      }
      return out.join('\n');
    };
  },
  /* ── 地图类 tooltip（2026-09-20）─────────────────────────────────────────
     世界地图 / 中国地图共用同一套「取值 → 文案」约定，避免同一个国家两种写法。
     为什么必须用函数而不是 {b}/{c} 占位符：见下方两个 FNS 各自的注释（都踩过坑）。
     ──────────────────────────────────────────────────────────────────────── */

  /* 世界地图 tooltip。参数 a 支持**两种写法，必须同时支持** ——
     库里已入库的图行用的是旧写法，本函数改参数化时不能把它们改坏。

       旧：`China=中国|Australia=澳大利亚|…`                    ← 600456 钛铁矿等存量图
       新：`<指标名>~<单位>~<占比词>~<分母>~<无数据提示>|China=中国|…`

     判据：按 `|` 分段后，**含 `=` 的**是「英文=中文」对照表，
           **不含 `=` 的**是元信息段（旧写法里不存在 `~`，所以整段都进对照表）。
     ⇒ 换矿种只要在令牌最前面多写一段元信息，**壳不用再改、老数据也不必迁移**。
       （在此之前指标名/单位/分母 69000/无数据提示四样是写死在下面的，
         换矿种会串口径 —— 黄金图悬浮显示「钛铁矿储量」，2026-09-21 修。）

     ★ 为什么走函数而不是 "{b}<br/>{c}"：
       map series 的 data 是 {name, value} 形态时 `{c}` 取不到 value，
       ECharts 会把没有 value 的项渲染成字面量 **NaN** —— 用户截图3 里
       Mali 的 tooltip「钛铁矿储量：NaN 万吨」就是这个原因。
     ★ 为什么不用 {b} 当国名：底图 217 国里只有十几国有储量、
       且名字都是英文 ⇒ 必须自己查表翻中文。 */
  mapTip: function(a, opt){
    var m = {};
    var meta = {label: '钛铁矿储量', unit: '万吨', word: '占全球',
                base: 69000, nodata: 'USGS 2023 年统计未单独列示'};
    String(a || '').split('|').forEach(function(p){
      var i = p.indexOf('=');
      if(i > 0){ m[p.slice(0, i)] = p.slice(i + 1); return; }
      var t = String(p).split('~');
      if(t.length < 2) return;          /* 旧写法没有 `~` ⇒ 整段用默认值，行为与改前一致 */
      var lb = String(t[0] || '').replace(/^\s+|\s+$/g, '');
      if(lb) meta.label = lb;
      if(t[1]) meta.unit = t[1];
      if(t[2]) meta.word = t[2];
      var b = parseFloat(t[3]);
      if(b > 0) meta.base = b;
      if(t[4]) meta.nodata = t[4];
    });
    /* 从 map series 的 data 里按 name 反查 value —— 比只读 params.value 更稳：
       ECharts 对 `value: null` 的项，params.value 在不同版本里可能是 undefined
       或 null，甚至回落到底图自身的数据，统一走这次反查。 */
    function look(name){
      var ser = (opt && opt.series) || [];
      for(var i = 0; i < ser.length; i++){
        var d = ser[i] && ser[i].data;
        if(!Array.isArray(d)) continue;
        for(var j = 0; j < d.length; j++){
          if(d[j] && d[j].name === name){
            return (d[j].value == null ? null : d[j].value);
          }
        }
      }
      return undefined;
    }
    return function(p){
      var en = p.name || '', cn = m[en] || '';
      var head = cn ? (cn + '（' + en + '）') : en;
      /* 先信 params.value（有值就是有值）；为空才回查 data。
         ⚠️ 0 也要当「无数据」：储量统计里 0 意味着「USGS 未单独列示」，
            不是「这个国家真的没有资源」。把它当有效值会写出
            「储量：0 万吨 / 占全球 0.0%」这种误导性文案（已踩过）。 */
      var v = (p.value == null || p.value === 0) ? look(en) : p.value;
      var body;
      if(v == null || v === 0 || isNaN(v)){
        body = '暂无' + meta.label + '数据<div style="color:#8a8a86;font-size:11px;margin-top:2px">'
             + meta.nodata + '</div>';
      } else {
        body = meta.label + '：<b style="color:#d0202f">'
             + String(v).replace(/\B(?=(\d{3})+(?!\d))/g, ',')
             + '</b> ' + meta.unit + '<div style="color:#8a8a86;font-size:11px;margin-top:2px">'
             + meta.word + ' ' + (v / meta.base * 100).toFixed(1) + '%</div>';
      }
      return '<div style="font-weight:700;margin-bottom:2px">' + head + '</div>' + body;
    };
  },

  /* 中国地图 tooltip。参数 a 同样支持**两种写法**：
       旧：`<单位后缀>`（如 " 万吨"，**带前导空格**）         ← 600456 钛铁矿等存量图
       新：`<指标名>~<单位>~<无数据短名>`（如 "金矿资源储量~吨~金矿资源储量"）
     ★ 没有 `~` 时 unit **原样保留**（含那个前导空格），保证存量图的 tooltip
       一个字都不变 —— 别顺手 trim。
     ★ 为什么走函数：上一版写的是 "{b}<br/>原生钛铁矿（TiO₂）资源储量：<b>{@[2]} 万吨</b>"，
       `{@[2]}` 是 **scatter 专用的取数组下标语法**，但只在 formatter 是字符串、
       且 ECharts 走模板分支时才解析；实际渲染时被原样画了出来 —— 用户截图4
       看到的就是字面的 `{@[2]}`。函数里自己把数值拼出来，彻底绕开模板。
     ★ 文案与世界地图**对齐**：都是「名字 → 项目名：数值 + 单位 → 占比」三段。
     ★★ 兼容两种 data 形态（2026-09-20 晚）：
        ① `value: 7535.49`  —— 现在的**区域铺色版**（map series，标量）

           用上面 category 那两条默认值盖掉会丢掉整条缩放条的外观。 */
      var cnt = isTime ? seriesCount(opt) : n;
      var zoom = (cnt >= 5 && !NO_ZOOM[key]);
      if(zoom && !isTime){
        opt.dataZoom = [{type:'inside', start:0, end:100}, {type:'slider', show:false, start:0, end:100}];
      }
      if(zoom && isTime && !(opt.dataZoom && opt.dataZoom.length)){
        opt.dataZoom = [{type:'inside', xAxisIndex:0}, {type:'slider', xAxisIndex:0, bottom:8, height:16}];
      }
      var tspan = (zoom && isTime) ? timeSpan(opt) : null;
      var axspan = tspan ? axisExtentMs(opt, tspan) : null;
      delete opt.__noZoom;
      var inst = echarts.init(slot, THEME);
      inst.setOption(opt, true);
      btAlignZero(inst, opt);   /* 双轴：0 刻度对齐（只补 min/max，数据不碰） */
      St.inst[key] = inst;
      /* ★ 同一个 key 可以挂**多处槽位**（chartMargin 在 m11 与 m13 各有一块），
         St.inst[key] 只会留下最后初始化那个 ⇒ 另存一份全量列表，resize 才不漏图。 */
      St.insts.push(inst);
      St.slots.push({key:key, n:n, zoom:zoom, map:isMap, inst:inst, dom:slot,
                     tspan:tspan, axspan:axspan});
      if(isMap && !St.edit){
        var mg = document.createElement('div');
        mg.className = 'rpt-mapguide';
        mg.innerHTML = '<span>滚轮 <b>缩放</b></span><span>拖动 <b>平移</b></span>' +
                       '<span>双击 <b>复位</b></span>';
        slot.parentNode.insertBefore(mg, slot);   /* 压在图上，靠 CSS absolute 定位 */
        mg.onclick = (function(it){
          return function(){
            it.setOption({series:[{type:'map', center:null, zoom:1}]});
          };
        })(inst);
        mg.ondblclick = mg.onclick;
      }
    }catch(e){
      slot.innerHTML = '<div class="rpt-chartmiss">图表渲染失败：' + esc(String(e && e.message || e)) + '</div>';
    }
  }
  if(St.edit){
    var bts = document.querySelectorAll('[data-cedit]');
    for(var j = 0; j < bts.length; j++){
      bts[j].onclick = (function(k){
        return function(ev){ ev.stopPropagation(); Rpt.openChart(k); };
      })(bts[j].getAttribute('data-cedit'));
    }
  }
  renderToolbars();
  if(goneSlots.length) sweepGoneSlots(goneSlots);
  window.__RPT_CHARTS = St.slots.length;

/* ----------------------------------------------------------------
   图表数据「实质为空」判据（2026-09-20）
   ★ 只认「一个数据点都没有」：没有 series、或每条 series 的 data 都空。
     不猜别的 —— 全库 84 张图的 opt 实测都是 series[].data 形式、dataset 全为 false，
     所以这个判据不会误伤有数据的图。
   ---------------------------------------------------------------- */
function optEmpty(opt){
  if(!opt || typeof opt !== 'object') return true;
  if(opt.dataset) return false;
  var ss = opt.series;
  if(!ss || !ss.length) return true;
  for(var i = 0; i < ss.length; i++){
    var d = ss[i] && ss[i].data;
    if(d && d.length) return false;
  }
  return true;
}

/* ----------------------------------------------------------------
   空图槽位被隐藏后的并排收尾（2026-09-20）
   ★ 隐藏发生在 stackWide() 之后，并排容器不知道少了一块，会留下半栏空白。
     这里补一次重算：可见子块只剩 1 个 ⇒ 摘掉 .gr-pair 并加 .gr-solo（单列整行）；
     一个都不剩 ⇒ 连并排容器一起藏掉，别留一条空白槽。
   ---------------------------------------------------------------- */
function sweepGoneSlots(list){
  var seen = [];
  for(var i = 0; i < list.length; i++){
    var g = list[i].parentNode;
    while(g && g.nodeType === 1 && !(g.className || '').match(/(^|\s)grid[234](\s|$)/)) g = g.parentNode;
    if(!g || g.nodeType !== 1) continue;
    if(seen.indexOf(g) >= 0) continue;
    seen.push(g);
    var kids = g.children, vis = 0;
    for(var j = 0; j < kids.length; j++){
      var k = kids[j];
      if(k.nodeType !== 1) continue;
      if(k.style && k.style.display === 'none') continue;
      vis++;
    }
    if(vis === 0) g.style.display = 'none';
    else if(vis === 1){
      g.className = (g.className || '').replace(/(^|\s)gr-pair(\s|$)/g, ' ');
      addCls(g, 'gr-solo');
    }
  }
}
/* 时间范围按钮组（和原研报一致：3年 / 5年 / 10年 / 全部）
   ----------------------------------------------------------------
   2026-10-16 两处修正（用户反馈「m29 少了一个时间选择按钮」「m13 这里又多了一个」）：
   ① **取实例必须按槽位取，不能按 key 取**。原来写 `St.inst[s.key]` + `inst.getDom()`，
      而同一个 key 可以挂**多处槽位**（chartMargin 在 m11 与 m13 各有一块），
      `St.inst[key]` 只剩最后初始化的那个 ⇒ 两次都往同一块 DOM 前面插，
      于是 **m13 顶着两组按钮、m11 一组都没有**。现在用槽位自己的 `s.inst` / `s.dom`。
   ② **time 轴（EPS 与股价历史图）也进这个分支**。它没有 xAxis.data ⇒ catCount = 0
      ⇒ 原来连按钮都没有。现在按「真实时间」换算百分比窗口（见 yearWindow）。 */
function renderToolbars(){
  var old = document.querySelectorAll('.rpt-toolbar');
  for(var i = 0; i < old.length; i++) old[i].parentNode.removeChild(old[i]);
  (St.slots || []).forEach(function(s){
    if(!s.zoom) return;
    var inst = s.inst, dom = s.dom;
    if(!inst || !dom || !dom.parentNode) return;
    var bar = document.createElement('div');
    bar.className = 'rpt-toolbar';
    bar.innerHTML = '<button data-r="3">3年</button><button data-r="5">5年</button>' +
                    '<button data-r="10">10年</button><button data-r="all" class="on">全部</button>';
    dom.parentNode.insertBefore(bar, dom);
    var btns = bar.querySelectorAll('button');
    for(var b = 0; b < btns.length; b++){
      btns[b].onclick = (function(s, inst, bar){
        return function(){
          var bs = bar.querySelectorAll('button');
          for(var q = 0; q < bs.length; q++) bs[q].className = '';
          this.className = 'on';
          var raw = this.getAttribute('data-r');
          var win = null;
          if(s.axspan){
            /* time 轴：窗口按真实时间算 */
            win = (raw === 'all') ? [0, 100] : yearWindow(s.tspan, s.axspan, parseInt(raw, 10));
            if(!win) return;
          } else {
            /* category 轴：原逻辑，一个字节没动 */
            var n = s.n;
            var yrs = raw === 'all' ? 9999 : parseInt(raw, 10);
            win = [yrs >= n ? 0 : Math.round((n - yrs) / n * 100), 100];
          }
          inst.dispatchAction({type:'dataZoom', dataZoomIndex:1, start:win[0], end:win[1]});
          inst.dispatchAction({type:'dataZoom', dataZoomIndex:0, start:win[0], end:win[1]});
        };
      })(s, inst, bar);
    }
  });
}

  /* ---------------- 保存 ---------------- */
  ensureReport: function(){
    if(!REST) return Promise.reject(new Error('未配置云环境'));
    /* 页面上还没有研报记录时（比如从一个空代码进来），先兜一个最小壳 */
    if(!St.rep){
      St.rep = {id:St.code, code:St.code, name:'', kicker:'', title:'', subtitle:'', badges:[],
                verdict_title:'核心结论', verdict_html:'', notice_html:'', kpis:[], kpi_note:'', toc:[],
                essence_html:'', footer_html:'', theme:'red', sort:99};
    }
    var r = St.rep;
    var id = r.id || St.code;
    if(!id) return Promise.reject(new Error('缺少研报 ID'));
    var row = {
      id:id, code:r.code || id, name:r.name || '', kicker:r.kicker || '', title:r.title || '',
      subtitle:r.subtitle || '', badges:r.badges || [], verdict_title:r.verdict_title || '核心结论',
      verdict_html:r.verdict_html || '', notice_html:r.notice_html || '',
      kpis:r.kpis || [], kpi_note:r.kpi_note || '',
      toc:r.toc || [], essence_html:r.essence_html || '', footer_html:r.footer_html || '',
      theme:r.theme || 'red', sort:r.sort || 99, up:nowTs()
    };
    return api('wb_reports?on_conflict=id', {
      method:'POST',
      headers:{'Content-Type':'application/json', 'Prefer':'resolution=merge-duplicates,return=minimal'},
      body:[row]
    }).then(function(){
      r.id = id; St.src = 'cloud';
      if(St.all.map(function(x){ return String(x.id); }).indexOf(String(id)) < 0){
        St.all.push({id:id, code:row.code, name:row.name});
      }
    });
  },
  patch: function(table, q, body, label){
    if(!REST){ toast('未配置云环境，无法保存', 'bad'); return Promise.reject(new Error('no rest')); }
    var self = this;
    return this.ensureReport().then(function(){
      body.up = nowTs();
      return api(table + q, {
        method:'PATCH',
        headers:{'Content-Type':'application/json', 'Prefer':'return=minimal'},
        body:body
      });
    }).then(function(){
      toast(label + ' 已保存到数据库', 'ok');
    }).catch(function(e){
      toast('保存失败：' + String(e && e.message || e).slice(0, 110), 'bad');
      throw e;
    });
  },

  /* ---------- 页眉与结论 ---------- */
  svHead: function(){
    var r = St.rep || {};
    var v = function(id){ var e = $(id); return e ? e.value : ''; };
    var lines = v('h-badges').split('\n').map(function(s){ return s.trim(); }).filter(Boolean);
    var toc = v('h-toc').split('\n').map(function(s){ return s.trim(); }).filter(Boolean).map(function(s){
      var i = s.indexOf('|');
      return i < 0 ? {anchor:s, text:tocLabel(s)}
                   : {anchor:s.slice(0, i).trim(), text:tocLabel(s.slice(i + 1).trim())};
    });
    var kpis = [];
    var rows = document.querySelectorAll('#kpiEdit tr[data-k]');
    for(var i = 0; i < rows.length; i++){
      var g = function(n){ var e = rows[i].querySelector('[data-f="' + n + '"]'); return e ? e.value : ''; };
      if(!g('label') && !g('val')) continue;
      kpis.push({label:g('label'), val:g('val'), unit:g('unit'), cls:g('cls'), style:g('style')});
    }
    r.kicker = v('h-kicker'); r.title = v('h-title'); r.subtitle = v('h-sub');
    r.badges = lines;
    r.verdict_title = v('h-vt'); r.verdict_html = rteRead('h-vc', r.verdict_html);
    r.notice_html = rteRead('h-notice', r.notice_html);
    r.kpis = kpis; r.kpi_note = v('h-note');
    r.toc = toc;
    r.essence_html = rteRead('h-essence', r.essence_html);
    r.footer_html  = rteRead('h-footer', r.footer_html);

    r.name = r.name || '';
    ['h-vc', 'h-notice', 'h-essence', 'h-footer'].forEach(function(k){ UI.rteDirty[k] = 0; UI.rteSrcOrig[k] = undefined; });
    this.patch('wb_reports', '?id=eq.' + enc(r.id), {
      code:r.code, name:r.name, kicker:r.kicker, title:r.title, subtitle:r.subtitle,
      badges:r.badges, verdict_title:r.verdict_title, verdict_html:r.verdict_html,
      notice_html:r.notice_html, kpis:r.kpis, kpi_note:r.kpi_note, toc:r.toc,
      essence_html:r.essence_html, footer_html:r.footer_html, theme:r.theme || 'red'
    }, '页眉与结论').then(function(){
      St.rep = r; render();
    }).catch(function(){});
  },

  svMod: function(){

    var title = ($('m-title') || {}).value || '';
    /* ⚠️ 富文本：用户没动过编辑区时，rteRead 直接返回库里的原 HTML（一个字节都不改），

      .then(function(){ render(); Rpt.renderDrawer(); }).catch(function(){});

  /* 槽 29「企业评分」的页面调整落库（2026-09-22 用户令：「这个数据改完要提交到数据库里去」）
     material 由壳里的 scBuildHtml() 拼好 —— 与后端 build/_score_patch.py 同一套定点替换。
     ★ 只写 html（分数全在正文里），no/title/seq 原样回填，避免顺手改掉别的字段。
     ★ 本方法已被 RGATE 挂上管理员密码门（与「保存模块」同一套校验），调用方不要自己再弹密码。 */
  commitScore: function(id, material){
    var m = this.findMod(id);
    if(!m) return Promise.reject(new Error('找不到模块 ' + id));
    if(!material) return Promise.reject(new Error('没有要写入的内容'));
    return this.patch('wb_report_mods', '?id=eq.' + enc(id),
      {no:m.no, title:m.title, html:material, seq:m.seq, report_id:St.code, code:St.code},
      '模块 ' + m.no + ' 的评分'
    ).then(function(){
      m.html = material;            /* 本地同步，免得下一次提交还拿旧底稿 */
      render();
      if(St.edit) Rpt.renderDrawer();
      if(typeof toast === 'function') toast('评分已写入数据库 —— 所有人看到的都是这一版', 'ok');
    });
  },
  addMod: function(){
    var maxNo = 0;
    St.mods.forEach(function(m){ maxNo = Math.max(maxNo, parseInt(m.no, 10) || 0); });
    var no = String(maxNo + 1);

             title: (MOD_SKELETON[maxNo] || ('新模块 ' + no)), html: '<p>在此填写内容……</p>'};

  /* ---------- 数据表：导入 Excel / CSV、导出 CSV ----------
     用户诉求：「图表编辑增加一个可上传导入 excel 表格上传编辑数据」。
     三段式：impFile（拿到 File）→ impTable（读 + 解析，被 RGATE 包）→ impApply（改表，纯同步）。
     解析器全是顶层纯函数（见下方「Excel / CSV 解析」区块），方便探针直接喂字节。 */
  impPick: function(){ var e = $('c-file'); if(e) e.click(); },
  impFile: function(inp){
    var f = inp && inp.files && inp.files[0];
    if(inp) inp.value = '';          /* 立刻清空：同一个文件才能被连选两次 */
    if(!f) return;
    this.impTable(f);
  },
  impTable: function(file){
    var key = UI.selChart;
    if(!key){ toast('先选中一张图表再导入', 'bad'); return; }
    var nm = String((file && file.name) || '');
    var isX = /\.xlsx$/i.test(nm);
    if(!isX && !/\.(csv|txt|tsv)$/i.test(nm)){
      if(/\.xls$/i.test(nm)) toast('.xls（旧版二进制）解析不了：请在 Excel 里「另存为」→ .xlsx 或 .csv', 'bad');
      else toast('只支持 .xlsx / .csv / .txt 文件（收到：' + (nm || '未知') + '）', 'bad');
      return;
    }
    var fr = new FileReader();
    fr.onload = function(){
      var p;
      try{
        p = isX ? parseXlsx(fr.result)
                : Promise.resolve({rows: rowsFromText(decodeBuf(fr.result))});
      }catch(e){ toast('解析失败：' + String(e.message || e).slice(0, 90), 'bad'); return; }
      p.then(function(res){ Rpt.impApply(key, res.rows, nm); })
       .catch(function(e){ toast('导入失败：' + String(e.message || e).slice(0, 120), 'bad'); });
    };
    fr.onerror = function(){ toast('文件读取失败：' + nm, 'bad'); };
    fr.readAsArrayBuffer(file);
  },
  /* 把解析好的二维数组灌进数据表（不写数据库 —— 写库仍然只走「💾 保存图表」） */
  impApply: function(key, rows, fname){
    var rec = this.findChart(key);
    if(!rec){ toast('图表不存在（先点进一张图表）', 'bad'); return false; }
    if(!rows || !rows.length){ toast('文件里没读到任何数据行', 'bad'); return false; }
    var opt;
    try{ opt = JSON.parse(($('c-json') ? $('c-json').value : '') || '{}'); }
    catch(e){ toast('高级 JSON 现在有语法错误，先修好再导入', 'bad'); return false; }
    var s = opt.series || [];
    var kind = (s[0] && s[0].type === 'pie') ? 'pie' : 'series';
    if(!s.length){ toast('这张图表在高级 JSON 里没有 series，先补一个再导入', 'bad'); return false; }
    var m = rowsToModel(rows, kind);
    if(!m || !m.rows.length){ toast('文件里没读到数据行（第一行会被当成表头）', 'bad'); return false; }
    var note = [];
    if(m.serial) note.push('忽略序号列');
    if(kind !== 'pie'){
      var want = m.cols.length - 1;
      if(want < 1){ toast('只读到 1 列：需要「类别 + 至少一个系列」两列以上', 'bad'); return false; }
      if(s.length > want){
        note.push('移除 ' + (s.length - want) + ' 个多余系列');
        opt.series.length = want;
      }
      var added = 0;
      while(opt.series.length < want){
        var tpl = JSON.parse(JSON.stringify(opt.series[opt.series.length - 1]));
        /* 复制最后一列的样式，但把写死的颜色去掉 → 交给 ECharts 调色板出不同颜色 */
        delete tpl.color;
        if(tpl.itemStyle) delete tpl.itemStyle.color;
        if(tpl.lineStyle) delete tpl.lineStyle.color;
        opt.series.push(tpl);
        added++;
      }
      if(added) note.push('按最后一列补了 ' + added + ' 个系列');
      opt.series.forEach(function(x, i){ if(m.cols[i + 1]) x.name = m.cols[i + 1]; });
    }
    try{ opt = applyGrid(opt, m); }
    catch(e){ toast('写回失败：' + String(e.message || e).slice(0, 90), 'bad'); return false; }
    /* 以「真正会被保存的 option」为准回显，保证看到的就是存下去的 */
    var shown = chartModel(opt);
    var g = $('c-grid');
    if(g) g.innerHTML = gridHTML(shown);
    var gi = $('c-gridinfo');
    if(gi) gi.textContent = shown.rows.length + ' 行 × ' + Math.max(0, shown.cols.length - 1) + ' 个系列';
    if($('c-json')) $('c-json').value = JSON.stringify(opt, null, 1);
    toast('已从 ' + String(fname || '文件').slice(0, 28) + ' 读入 ' + shown.rows.length + ' 行 × ' +
          Math.max(0, shown.cols.length - 1) + ' 个系列' + (note.length ? '（' + note.join('、') + '）' : '') +
          ' —— 点「💾 保存图表」才写入数据库', 'ok');
    return true;
  },
  /* 把界面上的数据表导出成 CSV（BOM + CRLF，Excel 双击即开）—— 可以当导入模板用 */
  dlTable: function(){
    var key = UI.selChart;
    if(!key) return;
    var rec = this.findChart(key) || {};
    var cols = readGridCols(), rows = readGrid().rows;
    if(!rows.length){ toast('这张图表还没有数据行', 'bad'); return; }
    var q = function(v){
      v = String(v == null ? '' : v);
      return /[",\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
    };
    var lines = [cols.map(q).join(',')];
    for(var i = 0; i < rows.length; i++) lines.push(rows[i].map(q).join(','));
    var csv = '\ufeff' + lines.join('\r\n') + '\r\n';
    try{
      var a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv;charset=utf-8'}));
      a.download = String((St.rep && St.rep.code) || 'chart') + '_' + String(rec.name || key) + '_数据表.csv';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      toast('已导出 CSV —— 填好数字后直接「导入 Excel / CSV」回来就行', 'ok');
    }catch(e){ toast('导出失败：' + String(e.message), 'bad'); }
  },

  /* ---------- 数据表：增行 / 删行 ----------
     用户诉求：「模块的表格和图表的表格都增加一个删除行和增加行的功能」。
     共同点：**只改编辑框（DOM），一个字节都不写库** —— 写库仍然只走「💾 保存图表」，
     所以点错了、不保存就等于没发生。
     删行毕竟会丢掉已填的内容，按「删除」计并挂 RGATE（见文件末尾）；
     但 danger=false + 票据（tickFn 指向自己）→ 同一张抽屉里连着清十行只输一次密码。 */
  gridAddRow: function(){
    var g = $('c-grid');
    if(!g){ toast('先点进一张图表，再增删行', 'bad'); return false; }
    var m = readGrid(), cols = readGridCols();
    var n = Math.max(1, cols.length), row = [];
    for(var i = 0; i < n; i++) row.push('');
    m.rows.push(row);
    this.gridPaint(m);
    toast('末尾已增加 1 行（现在 ' + m.rows.length + ' 行）—— 点「💾 保存图表」才写入数据库', 'ok');
    return true;

  /* ---------- 写操作密码确认 ----------
     opts = {act:'保存'|'删除'|'新增'|'修改'|'导入', danger:bool}
     删除、覆盖导入这类不可逆操作永远要输密码；高频「保存 / 修改」可勾
     「15 分钟内免重复输入」（sessionStorage，关标签或退出登录即失效）。 */
  askPass: function(label, cb, opts){
    opts = opts || {};
    var act = opts.act || '删除';
    var danger = (opts.danger !== undefined) ? !!opts.danger : (act === '删除');
    if(!danger && rptPassFresh()){ if(cb) cb(''); return; }
    UI.confirmAct = act;
    UI.confirmDanger = danger;
    UI.confirmCb = cb;
    var last = '';
    try{ last = localStorage.getItem(AUTH_LAST_USER) || ''; }catch(e){}
    var offline = (!REST) || location.protocol === 'file:';
    $('rptPMask').innerHTML =
      '<div class="rpt-pbox" id="rptPBox" onclick="event.stopPropagation()">' +
        '<div class="hd">🔒 管理员密码确认</div>' +
        '<div class="bd">' +
          '<div class="warn">' + (danger ? '⚠️ <b>此操作不可撤销</b>' : '✍️ <b>写入确认</b>') + '<br>' +
            esc(label) + '<br>' +
            (offline ? '本机离线：密码只在本机校验（只存哈希），首次输入即成为本机管理密码。'
                     : (danger ? '请求会带上密码提交到云端函数校验，通过后才会真正删除，不可撤销。'
                               : '请求会带上密码提交到云端函数校验，通过后才会真正写入数据库。')) + '</div>' +
          (offline || Auth.token ? '' :
            '<div class="rfld"><label>管理员账号</label>' +
              '<input class="rinp" id="rpUser" value="' + attr(last) + '" placeholder="luoshui"></div>') +
          '<div class="rfld"><label>管理员密码' +
            (Auth.token ? ' <em>当前登录 ' + esc(Auth.user) + '</em>' : '') + '</label>' +
            '<input class="rinp" id="rpPass" type="password" autocomplete="off" placeholder="请输入管理员密码" ' +
            'onkeydown="if(event.key===\'Enter\')Rpt.confirmPass()"></div>' +
          (danger ? '' :
            '<label class="rkeep"><input type="checkbox" id="rpKeep">' +
            '<span>15 分钟内「保存 / 修改」免重复输入（<b>删除、覆盖导入仍需输入</b>）</span></label>') +
          '<div class="err" id="rpErr"></div>' +
        '</div>' +
        '<div class="ft"><button class="rbtn gh" onclick="Rpt.cancelPass()">取消</button>' +
          '<button class="rbtn ' + (danger ? 'red' : 'pri') + '" id="rpGo" onclick="Rpt.confirmPass()">确认' + esc(act) + '</button></div>' +
      '</div>';
    $('rptPMask').className = 'rpt-pmask on';
    setTimeout(function(){ var i = $('rpPass'); if(i) i.focus(); }, 70);
  },
  pErr: function(msg){
    var e = $('rpErr'); if(e) e.textContent = msg || '';
    var b = $('rptPBox');
    if(b && msg){ b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake'); }
    var i = $('rpPass'); if(i && msg) i.value = '';
  },
  cancelPass: function(){ UI.confirmCb = null; $('rptPMask').className = 'rpt-pmask'; },
  confirmPass: function(){
    var uEl = $('rpUser'), pEl = $('rpPass'), go = $('rpGo');
    var u = uEl ? String(uEl.value || '').trim() : '';
    var p = pEl ? String(pEl.value || '') : '';
    var act = UI.confirmAct || '删除';
    var keep = $('rpKeep') ? !!$('rpKeep').checked : false;
    if(!String(p).trim()){ this.pErr('请输入管理员密码'); return; }
    var self = this;
    if(go){ go.disabled = true; go.textContent = '验 证 中…'; }
    function ok(){
      if(go){ go.disabled = false; go.textContent = '确认' + act; }
      $('rptPMask').className = 'rpt-pmask';
      var cb = UI.confirmCb; UI.confirmCb = null;
      if(keep) rptPassStamp(true);
      if(cb) cb(String(p).trim());
    }
    function no(msg){
      if(go){ go.disabled = false; go.textContent = '确认' + act; }
      self.pErr(msg);
    }
    /* 桌面文件版 / 未配置云环境：本机哈希校验，明文不落盘 */
    if(!REST || location.protocol === 'file:'){
      localPassCheck(String(p).trim(), ok, no);
      return;
    }
    var chain;
    if(Auth.token){
      chain = rpc('wb_admin_verify', {p_token:Auth.token, p_pass:String(p).trim()});
    } else {
      if(!u){ no('请输入管理员账号'); return; }
      chain = rpc('wb_admin_login', {
        p_user:u, p_pass:String(p), p_device:(navigator.userAgent || '').slice(0, 80), p_days:7
      }).then(function(r){
        if(r && r.ok){
          Auth.token = r.token; Auth.user = r.user; Auth.name = r.name || r.user; Auth.role = r.role || 'super';
          persistAuth(r, true);
        }
        return r;
      });
    }
    chain.then(function(r){
      if(!r || !r.ok){ no((r && r.msg) || '账号或密码错误，操作已取消'); return; }
      ok();
    }).catch(function(e){ no('验证失败：' + String(e.message || e).slice(0, 90)); });
  }
};

/* ================================================================
   可视化编辑（RTE）—— 用户改的是「文字和样子」，不是代码
   设计要点：
   1) 正文/结论/一句话本质/页脚一律用 contenteditable 直接编辑，输入框里**不出现标签**；
   2) 图表占位在编辑区里显示成受保护的胶囊标签（contenteditable=false），点不动、也删不掉半截；
      保存时按标签上记下的 data-chart / class / style 原样还原成 <div data-chart="…"></div>；
   3) 双重保险：UI.rteDirty 没置位（用户根本没动）时，保存直接写回**库里原来的 HTML**，一个字节都不改；
   4) 源码只在折叠的「代码」区可见，且只在真的改了源码时才以此为准；
   5) 凡进入编辑区/写库的 HTML 都过一遍 sanitizeHtml（剥掉 script、iframe、style、
      on… 事件属性与 javascript: 链接）。
   ================================================================ */
var RTE_BAD = /^(script|style|link|meta|base|iframe|object|embed|form|input|button|textarea|select|noscript)$/i;

function sanitizeHtml(html){
  var box = document.createElement('div');
  box.innerHTML = (html == null ? '' : String(html));
  var all = box.querySelectorAll('*');
  for(var i = 0; i < all.length; i++){
    var el = all[i];
    if(RTE_BAD.test(el.tagName)){ if(el.parentNode) el.parentNode.removeChild(el); continue; }
    var at = el.attributes;
    for(var j = at.length - 1; j >= 0; j--){
      var n = at[j].name, v = at[j].value || '';
      if(/^on/i.test(n)){ el.removeAttribute(n); continue; }
      if(n === 'contenteditable'){ el.removeAttribute(n); continue; }
      if((n === 'href' || n === 'src' || n === 'xlink:href') && /^\s*javascript:/i.test(v)) el.removeAttribute(n);
    }
  }
  return box.innerHTML;
}

/* 库里的 HTML → 编辑区内容（图表 div 换成受保护的胶囊标签） */
function rteLoad(html){
  var box = document.createElement('div');
  box.innerHTML = sanitizeHtml(html);
  var ds = box.querySelectorAll('[data-chart]');
  for(var i = 0; i < ds.length; i++){
    var d = ds[i], k = d.getAttribute('data-chart') || '';
    var chip = document.createElement('span');
    chip.className = 'rte-chip';
    chip.setAttribute('contenteditable', 'false');
    chip.setAttribute('data-chart', k);
    chip.setAttribute('data-cls', d.getAttribute('class') || '');
    chip.setAttribute('data-sty', d.getAttribute('style') || '');
    chip.setAttribute('title', '图表「' + k + '」的位置：数据在「图表」页里改，改文字不会影响它');
    chip.textContent = '图表：' + k;
    if(d.parentNode) d.parentNode.replaceChild(chip, d);
  }
  return box.innerHTML;
}

/* 编辑区内容 → 存库的 HTML（把胶囊标签还原成带 data-chart 的 div） */
function rteSave(html){
  var box = document.createElement('div');
  box.innerHTML = sanitizeHtml(html);
  var cs = box.querySelectorAll('.rte-chip[data-chart]');
  for(var i = 0; i < cs.length; i++){
    var c = cs[i];
    var d = document.createElement('div');
    d.setAttribute('data-chart', c.getAttribute('data-chart') || '');
    var cls = c.getAttribute('data-cls') || '', sty = c.getAttribute('data-sty') || '';
    if(cls) d.setAttribute('class', cls);
    if(sty) d.setAttribute('style', sty);
    if(c.parentNode) c.parentNode.replaceChild(d, c);
  }
  return box.innerHTML;
}

/* 读取某个富文本字段的最终值：源码区开着就以源码为准；否则只在用户动过时才用编辑区内容 */
function rteRead(id, orig){
  var w = $(id + '-wrap'), src = $(id + '-src'), box = $(id);
  if(w && w.open && src) return rteSave(src.value);
  if(box && UI.rteDirty[id]) return rteSave(box.innerHTML);
  return (orig == null ? '' : String(orig));
}

/* 光标落在哪一行表格里。只认本编辑区内的 tr —— 否则会误改页面上别处的表格。
   （工具条按钮都带 onmousedown="return false"，所以点按钮不会把选区弄丢） */
function rteRowAt(id){
  var box = $(id);
  if(!box) return null;
  var n = null;
  try{ var sel = window.getSelection(); n = (sel && sel.rangeCount) ? sel.anchorNode : null; }catch(e){}
  var el = n ? (n.nodeType === 1 ? n : n.parentNode) : null;
  while(el && el !== box){
    if(el.nodeName && /^tr$/i.test(el.nodeName)) return el;
    el = el.parentNode;
  }
  return null;
}
/* 把光标放进某个元素里（插完行接着就能打字） */
function rteCaretIn(el){
  if(!el) return;
  try{
    var r = document.createRange();
    r.selectNodeContents(el); r.collapse(true);
    var sel = window.getSelection();
    sel.removeAllRanges(); sel.addRange(r);
  }catch(e){}
}

  /* 表格增删行。所有富文本字段（正文 / 结论 / 一句话本质 / 页脚）都带这组按钮 ——
     没把光标点进表格里时只给提示，不会瞎改。 ⚠️ onmousedown="return false" 不能省：

  h += '<span class="rteSep"></span>';

         'onclick="Rpt.rteChart(\'' + id + '\')">＋图表</button>';
  }
  h += '<span class="rtebar-tip">直接点文字就能改</span>';
  return h + '</div>';
}

/* 富文本字段（带工具条 + 折叠的源码区） */
function rteField(id, label, val, rows, hint, withChart){
  return '<div class="rfld"><label>' + label + (hint ? ' <em>' + hint + '</em>' : '') + '</label>' +

function chartModel(opt){
  var s = opt.series || [];
  if(s.length && s[0].type === 'pie' && Array.isArray(s[0].data) && s[0].data.length &&
     typeof s[0].data[0] === 'object' && !Array.isArray(s[0].data[0])){
    return {kind:'pie', cols:['名称', '数值'],
            rows:s[0].data.map(function(d){ return [d.name, d.value]; })};
  }
  var xa = Array.isArray(opt.xAxis) ? opt.xAxis[0] : opt.xAxis;
  var cats = (xa && Array.isArray(xa.data)) ? xa.data.slice() : null;
  var cols = ['类别'].concat(s.map(function(x, i){ return x.name || ('系列' + (i + 1)); }));
  var n = cats ? cats.length : 0;
  s.forEach(function(x){ n = Math.max(n, (x.data || []).length); });
  var rows = [];
  for(var i = 0; i < n; i++){
    var row = [cats ? cats[i] : ''];
    s.forEach(function(x){
      var d = (x.data || [])[i];
      row.push(d && typeof d === 'object' && !Array.isArray(d) ? d.value : (d === undefined ? '' : d));
    });
    rows.push(row);
  }
  return {kind:'series', cols:cols, rows:rows};
}
function applyGrid(opt, model){
  var s = opt.series || [];
  if(!s.length) return opt;
  if(model.kind === undefined){
    model.kind = (s[0].type === 'pie' && s[0].data && typeof s[0].data[0] === 'object') ? 'pie' : 'series';
  }
  if(model.kind === 'pie'){
    s[0].data = model.rows.map(function(r){
      return {name:String(r[0] == null ? '' : r[0]), value:parseFloat(r[1]) || 0};
    }).filter(function(d){ return d.name !== ''; });
    return opt;
  }
  var xa = Array.isArray(opt.xAxis) ? opt.xAxis[0] : opt.xAxis;
  var cats = model.rows.map(function(r){ return String(r[0] == null ? '' : r[0]); });
  if(xa && Array.isArray(xa.data)){
    xa.data = cats;
    if(Array.isArray(opt.xAxis) && opt.xAxis[1] && Array.isArray(opt.xAxis[1].data)) opt.xAxis[1].data = cats.slice();
  }
  s.forEach(function(x, i){
    var old = x.data || [];
    x.data = model.rows.map(function(r, ri){
      var v = r[i + 1];
      var num = (v === '' || v === null || v === undefined) ? null : parseFloat(v);
      if(num !== null && isNaN(num)) num = null;
      var o = old[ri];
      if(o && typeof o === 'object' && !Array.isArray(o)){ o.value = num; return o; }
      return num;
    });
  });
  return opt;
}
/* ---------------------------------------------------------------- 新建 / 导入 */
/* ============================================================================
   Excel / CSV 解析（顶层纯函数，探针可直接喂字节）
   —— 供「图表 → 数据表 → 📥 导入 Excel / CSV」用。

   三条设计取舍（都是权衡过才这么定的）：
   ① `.xlsx` 本质是 zip。单文件页要能离线打开，所以**不引第三方库**；也不手写 inflate
      （几百行、易错）。直接用浏览器原生的 `DecompressionStream('deflate-raw')`
      （Edge / Chrome 103+）。拿不到这个 API 时**明确报错让用户另存为 CSV**，
      绝不静默给出一张空表 —— 那是最坏的结果（看着像成功）。
   ② 表头约定：第一行 = 表头，第 1 列 = 类别，后面每列一个系列。
      `#` / `序号` / `no` / `编号` 这种纯序号列自动忽略；如果第一行全是数字
      （没有表头），就按「类别 + 系列N」生成，**不能把第一行数据当表头吃掉**。
   ③ 日期单元格（Excel 数字格式）解成 `YYYY-MM-DD`，而不是把 45000 这种序列号
      原样填进表里 —— 类别列最常见的恰好就是月份/年份。
   ============================================================================ */

/* 字节 → 文本：UTF-8 优先；出现替换符（多半是 GBK 导出的 CSV）再试 GBK */
function decodeBuf(buf){
  var u8 = new Uint8Array(buf), s = '';
  try{ s = new TextDecoder('utf-8').decode(u8); }catch(e){ s = ''; }
  if(s.indexOf('\uFFFD') >= 0){
    try{
      var g = new TextDecoder('gbk').decode(u8);
      if(g && g.indexOf('\uFFFD') < 0) return g.replace(/^\uFEFF/, '');
    }catch(e){}
  }
  return s.replace(/^\uFEFF/, '');
}

/* 分隔符嗅探：Excel 复制出来是 \t，另存为 CSV 是 , 或 ;（欧洲区） */
function sniffDelim(text){
  var head = String(text).split('\n').slice(0, 6).join('\n');
  var cands = ['\t', ',', ';', '|'], best = '\t', bn = 0;
  for(var i = 0; i < cands.length; i++){
    var n = head.split(cands[i]).length - 1;
    if(n > bn){ bn = n; best = cands[i]; }
  }
  return best;
}
/* 分隔文本 → 二维数组（支持 "引号包裹" 与 "" 转义、跨行字段） */
function rowsFromText(text){
  text = String(text == null ? '' : text).replace(/\r\n?/g, '\n');
  var d = sniffDelim(text);
  var rows = [], cur = [], cell = '', q = false;
  for(var i = 0; i < text.length; i++){
    var c = text.charAt(i);
    if(q){
      if(c === '"'){
        if(text.charAt(i + 1) === '"'){ cell += '"'; i++; }
        else q = false;
      } else cell += c;
      continue;
    }
    if(c === '"') q = true;
    else if(c === d){ cur.push(cell); cell = ''; }
    else if(c === '\n'){ cur.push(cell); rows.push(cur); cur = []; cell = ''; }
    else cell += c;
  }
  cur.push(cell); rows.push(cur);
  return rows;
}
/* 数据表表头（跳过最左边的「#」列）；导出 CSV 时当表头用 */
function readGridCols(){
  var ths = document.querySelectorAll('.rpt-grid thead th'), out = [];
  for(var i = 1; i < ths.length; i++) out.push(String(ths[i].textContent || '').trim());
  return out;

/* ---------------- zip ----------------
   ⚠️ 本地头里的 name/extra 长度与中央目录**不一定相同**（有 data descriptor 时更甚），
   所以数据起点必须按本地头重新算，不能拿中央目录的偏移直接推。 */
function zU16(b, o){ return b[o] | (b[o + 1] << 8); }
function zU32(b, o){ return (b[o] | (b[o+1] << 8) | (b[o+2] << 16) | (b[o+3] << 24)) >>> 0; }
function zStr(b, s, e){
  var out = '';
  for(var i = s; i < e; i++) out += String.fromCharCode(b[i]);
  return out;
}
function unzipEntries(buf){
  var b = new Uint8Array(buf), eo = -1;
  var lo = Math.max(0, b.length - 66000);
  for(var i = b.length - 22; i >= lo; i--){
    if(b[i] === 0x50 && b[i+1] === 0x4b && b[i+2] === 0x05 && b[i+3] === 0x06){ eo = i; break; }
  }
  if(eo < 0) throw new Error('不是有效的 xlsx（找不到 zip 结尾标记）');
  var cnt = zU16(b, eo + 10), p = zU32(b, eo + 16), out = {};
  for(var k = 0; k < cnt; k++){
    if(p + 46 > b.length || zU32(b, p) !== 0x02014b50) break;
    var method = zU16(b, p + 10), csize = zU32(b, p + 20), lho = zU32(b, p + 42);
    var nlen = zU16(b, p + 28), elen = zU16(b, p + 30), clen = zU16(b, p + 32);
    var name = zStr(b, p + 46, p + 46 + nlen);
    if(zU32(b, lho) === 0x04034b50){
      var ds = lho + 30 + zU16(b, lho + 26) + zU16(b, lho + 28);
      out[name] = {method:method, data:b.subarray(ds, ds + csize)};
    }
    p += 46 + nlen + elen + clen;
  }
  return out;
}
function entryText(ent){
  if(!ent) return Promise.resolve('');
  if(ent.method === 0) return Promise.resolve(new TextDecoder('utf-8').decode(ent.data));
  if(ent.method !== 8) return Promise.reject(new Error('压缩方式 ' + ent.method + ' 不支持'));
  if(typeof DecompressionStream !== 'function'){
    return Promise.reject(new Error('这个浏览器解压不了 xlsx —— 请在 Excel 里「另存为 → CSV」再导入'));
  }
  var st = new Blob([ent.data]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  return new Response(st).arrayBuffer().then(function(ab){
    return new TextDecoder('utf-8').decode(new Uint8Array(ab));
  });
}

/* ---------------- xlsx 里的 XML ---------------- */
function xmlUnesc(s){
  return String(s == null ? '' : s)
    .replace(/&#x([0-9a-fA-F]+);/g, function(m, h){ return String.fromCharCode(parseInt(h, 16)); })
    .replace(/&#(\d+);/g, function(m, d){ return String.fromCharCode(parseInt(d, 10)); })
    .replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"')
    .replace(/&apos;/g, "'").replace(/&amp;/g, '&');
}
function sharedStrings(xml){
  var out = [], re = /<si\b[^>]*>([\s\S]*?)<\/si>/g, m;
  while((m = re.exec(xml || ''))){
    var inner = m[1], t = '', r = /<t\b[^>]*>([\s\S]*?)<\/t>/g, mm;
    while((mm = r.exec(inner))) t += xmlUnesc(mm[1]);
    out.push(t);
  }
  return out;
}
/* 这个数字格式像日期吗（内置 14–22 / 45–47，或自定义格式里带 y/m/d/h/s） */
function isDateFmt(id, code){
  if((id >= 14 && id <= 22) || (id >= 45 && id <= 47)) return true;
  if(!code) return false;
  var c = String(code).replace(/"[^"]*"/g, '').replace(/\[[^\]]*\]/g, '').replace(/\\./g, '').toLowerCase();
  return /[ymdhs]/.test(c) && !/^[0#?.,]+$/.test(c);

/* cellXfs 顺序 = 单元格 s 属性的下标 → [是不是日期格式] */
function dateStyles(xml){

  var m = /<cellXfs\b[^>]*>([\s\S]*?)<\/cellXfs>/.exec(xml || '');
  if(!m) return out;
  var customs = {}, re1 = /<numFmt\b([^>]*)\/?>/g, x;
  while((x = re1.exec(xml))){
    var a = /numFmtId="(\d+)"/.exec(x[1]), b = /formatCode="([^"]*)"/.exec(x[1]);
    if(a) customs[a[1]] = xmlUnesc(b ? b[1] : '');
  }
  var re2 = /<xf\b([^>]*?)(?:\/>|>)/g, y;
  while((y = re2.exec(m[1]))){
    var idm = /numFmtId="(\d+)"/.exec(y[1]);
    var id = idm ? parseInt(idm[1], 10) : 0;
    out.push(isDateFmt(id, customs[String(id)]));

function colIdx(letters){
  var n = 0;
  for(var i = 0; i < letters.length; i++) n = n * 26 + (letters.charCodeAt(i) - 64);
  return n - 1;
}
/* Excel 1900 序列号 → YYYY-MM-DD（25569 = 1970-01-01 的序列号；按 UTC 算避免时区偏移） */
function serialDate(n){
  var d = new Date(Math.round((n - 25569) * 86400000));
  if(isNaN(d.getTime())) return String(n);
  var p = function(x){ return (x < 10 ? '0' : '') + x; };
  return d.getUTCFullYear() + '-' + p(d.getUTCMonth() + 1) + '-' + p(d.getUTCDate());

function sheetRows(xml, shared, dstyles){

  var sd = /<sheetData\b[^>]*>([\s\S]*?)<\/sheetData>/.exec(body);
  if(sd) body = sd[1];
  var out = [], rr = /<row\b[^>]*>([\s\S]*?)<\/row>/g, m;
  while((m = rr.exec(body))){
    var cells = [], cr = /<c\b([^>]*?)(?:\/>|>([\s\S]*?)<\/c>)/g, cm;
    while((cm = cr.exec(m[1]))){
      var at = cm[1], inner = cm[2] || '';
      var ref = /r="([A-Z]+)\d+"/.exec(at);
      var ci = ref ? colIdx(ref[1]) : cells.length;
      var t = (/t="([^"]+)"/.exec(at) || [0, ''])[1];
      var si = parseInt((/s="(\d+)"/.exec(at) || [0, 0])[1], 10) || 0;
      var val = '';
      if(t === 'inlineStr'){
        var im = /<t\b[^>]*>([\s\S]*?)<\/t>/.exec(inner);
        val = im ? xmlUnesc(im[1]) : '';
      } else {
        var vm = /<v\b[^>]*>([\s\S]*?)<\/v>/.exec(inner);
        var raw = vm ? xmlUnesc(vm[1]) : '';
        if(t === 's'){ var kk = parseInt(raw, 10); val = shared[kk] === undefined ? '' : shared[kk]; }
        else if(t === 'str'){ val = raw; }
        else if(t === 'b'){ val = (raw === '1' ? 'TRUE' : 'FALSE'); }
        else if(t === 'e'){ val = ''; }
        else if(raw !== ''){
          var num = parseFloat(raw);
          val = (dstyles[si] && !isNaN(num)) ? serialDate(num) : raw;

      if(ci >= 0) cells[ci] = val;

    for(var j = 0; j < cells.length; j++) row.push(cells[j] === undefined ? '' : cells[j]);

/* 取第一张工作表：Excel 导出的 sheet1.xml 就是第一张表（这里不追 workbook.xml 的

function pickSheet(z){
  var cands = [], k;
  for(k in z) if(/^xl\/worksheets\/sheet\d+\.xml$/.test(k)) cands.push(k);
  if(!cands.length) throw new Error('这个文件里没有工作表（确定是 .xlsx 吗？）');
  cands.sort(function(a, b){
    return parseInt(/(\d+)\.xml$/.exec(a)[1], 10) - parseInt(/(\d+)\.xml$/.exec(b)[1], 10);
  });
  return cands[0];
}
function parseXlsx(buf){
  var z;
  try{ z = unzipEntries(buf); }
  catch(e){ return Promise.reject(e); }
  var deflated = false, k;
  for(k in z) if(z[k].method === 8) deflated = true;
  if(deflated && typeof DecompressionStream !== 'function'){
    return Promise.reject(new Error('这个浏览器解压不了 xlsx —— 请在 Excel 里「另存为 → CSV」再导入'));
  }
  var sheet;
  try{ sheet = pickSheet(z); }
  catch(e){ return Promise.reject(e); }
  return Promise.all([
    entryText(z['xl/sharedStrings.xml']).catch(function(){ return ''; }),
    entryText(z['xl/styles.xml']).catch(function(){ return ''; }),
    entryText(z[sheet]).catch(function(e){ throw new Error('读取工作表失败：' + String(e.message || e)); })
  ]).then(function(a){
    return {rows: sheetRows(a[2], sharedStrings(a[0]), dateStyles(a[1])), sheet:sheet};
  });
}

/* ---------------- 二维数组 → 数据表模型 ---------------- */
function cellText(x){ return String(x == null ? '' : x).replace(/\u00a0/g, ' ').replace(/\s+/g, ' ').trim(); }
function rowsToModel(rows, kind){
  var clean = [], i, j;
  for(i = 0; i < rows.length; i++){
    var r = rows[i] || [], has = false;
    for(j = 0; j < r.length; j++){ if(cellText(r[j]) !== ''){ has = true; break; } }
    if(has) clean.push(r.map(cellText));
  }
  if(!clean.length) return null;
  var w = 0;
  for(i = 0; i < clean.length; i++) w = Math.max(w, clean[i].length);
  /* 表头判定：第一行只要有一个非数字单元，就当表头（否则整行都是数据） */
  var head = clean[0], isHead = false;
  for(j = 0; j < head.length; j++){
    if(head[j] && !/^-?[\d,]+(\.\d+)?%?$/.test(head[j])){ isHead = true; break; }
  }
  var serial = isHead && /^(#|no\.?|序号|编号|index|行号)$/i.test(head[0] || '');
  var off = serial ? 1 : 0;
  var cols = [], data = [];
  if(isHead){
    for(j = off; j < w; j++) cols.push(head[j] === undefined ? '' : head[j]);
    data = clean.slice(1).map(function(x){ return x.slice(off); });
  } else {
    cols = ['类别'];
    for(j = 1; j < w; j++) cols.push('系列' + j);
    data = clean.map(function(x){ return x.slice(off); });
  }
  if(kind === 'pie'){
    cols = ['名称', '数值'];
    data = data.map(function(x){ return [x[0] === undefined ? '' : x[0], x[1] === undefined ? '' : x[1]]; });
  } else {
    /* 末尾整列都是空的（Excel 里常见的幽灵列）→ 砍掉，别凭空多出一个系列 */
    var keep = cols.length;
    while(keep > 1){
      var empty = true;
      for(i = 0; i < data.length; i++){ if(cellText(data[i][keep - 1]) !== ''){ empty = false; break; } }
      if(!empty) break;
      keep--;
    }
    cols = cols.slice(0, keep);
    if(!cols[0] || /^(#|序号|编号|index)$/i.test(cols[0])) cols[0] = '类别';
  }
  return {cols:cols, rows:data, serial:serial, head:isHead};
}

function postAll(table, rows, size){
  var i = 0;
  function step(){
    if(i >= rows.length) return Promise.resolve();
    var part = rows.slice(i, i + size);
    i += size;
    return api(table + '?on_conflict=id', {
      method:'POST',
      headers:{'Content-Type':'application/json', 'Prefer':'resolution=merge-duplicates,return=minimal'},
      body:part
    }).then(step);
  }
  return step();
}

Rpt.importJSON = function(){
  var el = $('io-json');
  var txt = el ? String(el.value || '') : '';
  if(!txt.trim()){ toast('请先粘贴 JSON 内容', 'bad'); return; }
  var pack;
  try{ pack = JSON.parse(txt); }
  catch(e){ toast('JSON 格式错误：' + String(e.message).slice(0, 90), 'bad'); return; }
  if(!pack || !pack.report){ toast('JSON 里缺少 report 字段', 'bad'); return; }
  var code = St.code || pack.report.code || pack.report.id;
  pack.report.id = code; pack.report.code = pack.report.code || code;
  var mods = (pack.mods || []).map(function(m, i){
    return {id:code + '_m' + (m.no || (i + 1)), report_id:code, code:code, seq:m.seq || (i + 1),
            no:String(m.no || (i + 1)), title:m.title || '', html:m.html || '', up:nowTs()};
  });
  var charts = (pack.charts || []).map(function(c, i){
    var k = String(c.id || ('chart' + (i + 1)));
    if(k.indexOf(code + '_') === 0) k = k.slice(code.length + 1);
    return {id:code + '_' + k, report_id:code, code:code, seq:c.seq || (i + 1),
            name:c.name || k, opt:c.opt || {}, up:nowTs()};
  });
  St.rep = pack.report; St.mods = mods;
  St.charts = {}; St.chartKeys = [];
  charts.forEach(function(c){ St.charts[c.id.slice(code.length + 1)] = c; St.chartKeys.push(c.id.slice(code.length + 1)); });
  toast('正在写入数据库…');
  Rpt.ensureReport()
    .then(function(){ return postAll('wb_report_mods', mods, 6); })
    .then(function(){ return postAll('wb_report_charts', charts, 4); })
    .then(function(){
      toast('导入完成：' + mods.length + ' 个模块 · ' + charts.length + ' 张图表', 'ok');
      render(); Rpt.renderDrawer();
    })
    .catch(function(e){ toast('导入失败：' + String(e.message || e).slice(0, 100), 'bad'); });
};

/* ============================================================================
   公司资料库（顶部操作条「📂 公司资料库」）
   —— 给每家被研究的公司挂一个资料柜：上传 / 查看 / 下载 / 删除
      图片、PDF、Word、Excel、PPT、TXT 等任意格式。

   分两处存（各有各的道理）：
     · 文件本体 → CloudBase PG 存储 bucket `company-files`，前端**直传** HTTP API
         POST /v1/storages/object/company-files/<key>   （Bearer 可发布密钥即可）
       预览/下载走公开读：GET 同一路径，带 CORS —— 所以 <img>/<iframe>/fetch 都能直接用。
       为什么不塞进 PostgREST 表：base64 会让体积涨 33%，几十 MB 的年报根本传不动。
     · 元数据 → wb_company_files 表（原始文件名 / 类型 / 大小 / 上传时间 / 上传人）。
       原始文件名不能直接当对象名（中文·空格·重名·特殊字符都出问题），
       所以桶里用 `<code>/<时间戳>_<随机>.<ext>`，真名存在表里。

   ★ 删除 = 软删（is_del=true），走服务端 wb_del_company_file 校验管理员密码 ——
     与项目「删记录只软删」同一口径；桶里的对象保留，列表按 is_del 过滤。
   ★ 上传要过管理员密码门（act='上传'，danger=false）—— 本项目的既有模型是
     「匿名可写数据库」，所以「写」必须有人把关；勾上「15 分钟内免重复输入」后
     连续传多个文件不会反复弹。
   ============================================================================ */
var STORE = CFG.envId ? ('https://' + CFG.envId + '.api.tcloudbasegateway.com/v1/storages/') : '';
var CF_BUCKET = 'company-files';
/* 后缀 → 分类：决定图标底色，以及「能不能在浏览器里直接看」 */
var F_KIND = {
  pdf:'pdf',
  doc:'doc', docx:'doc', rtf:'doc', odt:'doc', wps:'doc',
  xls:'xls', xlsx:'xls', csv:'xls', ods:'xls', et:'xls',
  ppt:'ppt', pptx:'ppt', odp:'ppt', dps:'ppt',
  png:'img', jpg:'img', jpeg:'img', gif:'img', webp:'img', bmp:'img', svg:'img', avif:'img', ico:'img',
  txt:'txt', md:'txt', log:'txt', json:'txt', xml:'txt', yaml:'txt', yml:'txt', ini:'txt', html:'txt', htm:'txt',
  zip:'zip', rar:'zip', '7z':'zip', gz:'zip', tar:'zip', xz:'zip'
};
var F_ICON = {pdf:'📕', doc:'📘', xls:'📗', ppt:'📙', img:'🖼', txt:'📄', zip:'🗜', other:'📎'};
var F_NAME = {pdf:'PDF', doc:'Word', xls:'Excel', ppt:'PPT', img:'图片', txt:'文本', zip:'压缩包', other:'文件'};
var FIA = {rows:[], q:'', n:0};          /* 列表缓存 / 搜索词 / 上传批次序号 */
var F_MAX = 80 * 1024 * 1024;            /* 单文件上限 80MB（够装年报 PDF；再大浏览器上传体验就崩了） */

function fKind(r){ return F_KIND[String((r && r.ext) || '').toLowerCase()] || 'other'; }
function fSize(n){
  n = Number(n) || 0;
  if(n < 1024) return n + ' B';
  if(n < 1048576) return (n / 1024).toFixed(n < 10240 ? 1 : 0) + ' KB';
  if(n < 1073741824) return (n / 1048576).toFixed(n < 10485760 ? 2 : 1) + ' MB';
  return (n / 1073741824).toFixed(2) + ' GB';
}
function fTime(iso){
  if(!iso) return '';
  var d = new Date(iso);
  if(isNaN(d.getTime())) return String(iso).slice(0, 16).replace('T', ' ');
  function p(x){ return (x < 10 ? '0' : '') + x; }
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) +
         ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}
/* 桶内对象的公开读地址（对象名逐段编码：桶名与路径段分别 encode，斜杠要留） */
function fUrl(r){
  return STORE + 'object/' + enc(r.bucket || CF_BUCKET) + '/' +
         String(r.object_key || '').split('/').map(enc).join('/');
}

Rpt.fRender = function(err){
  var body = $('fBody'); if(!body) return;
  var total = 0, i;
  for(i = 0; i < FIA.rows.length; i++) total += Number(FIA.rows[i].size_bytes) || 0;
  this.fStat(FIA.rows.length ? (FIA.rows.length + ' 个文件 · 共 ' + fSize(total)) : '');
  var rows = FIA.q ? FIA.rows.filter(function(r){
    return String(r.name || '').toLowerCase().indexOf(FIA.q) >= 0;
  }) : FIA.rows;
  var h = '';
  if(err){
    h = '<div class="fempty"><span class="big">⚠️</span>' + esc(err) + '</div>';
  } else if(!FIA.rows.length){
    h = '<div class="fempty"><span class="big">📂</span>这家公司的资料柜还是空的<br>' +
        '点左上的 <b>⬆ 上传资料</b>，或把文件<b>直接拖进来</b></div>';
  } else if(!rows.length){
    h = '<div class="fempty"><span class="big">🔍</span>没有匹配「' + esc(FIA.q) + '」的文件</div>';
  } else {
    h = rows.map(function(r){
      var k = fKind(r), id = attr(r.id);
      return '<div class="fl">' +
        '<span class="fi k-' + k + '">' + (F_ICON[k] || F_ICON.other) + '</span>' +
        '<span class="fn" title="' + attr(r.name) + '" onclick="Rpt.fView(\'' + id + '\')">' + esc(r.name) + '</span>' +
        '<span class="fk">' + esc(F_NAME[k] || '文件') + '</span>' +
        '<span class="fs">' + fSize(r.size_bytes) + '</span>' +
        '<span class="fd">' + fTime(r.t) + '</span>' +
        '<span class="fo">' +
          '<button class="ib" onclick="Rpt.fView(\'' + id + '\')" title="查看">👁 查看</button>' +
          '<button class="ib" onclick="Rpt.fDl(\'' + id + '\')" title="下载到本机">⬇</button>' +
          '<button class="ib del" onclick="Rpt.fDel(\'' + id + '\')" title="删除">🗑</button>' +
        '</span></div>';
    }).join('');
  }
  body.innerHTML = h;
};

/* 上传入口：先过大文件预检，再过密码门，最后串行上传（串行才能给出逐项进度） */
Rpt.fUp = function(fl){
  var arr = [].slice.call(fl || []);
  if(!arr.length) return;
  if(!STORE || !REST){ toast('未配置云环境，无法上传', 'bad'); return; }
  var big = [];
  arr = arr.filter(function(f){
    if(f.size > F_MAX){ big.push(f.name + '（' + fSize(f.size) + '）'); return false; }
    return true;
  });
  if(big.length) toast('超过单文件上限 ' + fSize(F_MAX) + '，已跳过：' + big.join('、'), 'bad');
  if(!arr.length) return;
  var co = (St.rep && (St.rep.name || St.rep.code)) || St.code || '';
  Rpt.askPass('上传 ' + arr.length + ' 个文件到「' + co + '」资料库', function(pw){
    Rpt.fRun(arr, pw);
  }, {act:'上传', danger:false});
};

Rpt.fRun = function(arr, pw){
  var self = this, body = $('fBody'); if(!body) return;
  FIA.n++;
  var qid = 'fq' + FIA.n;
  var q = document.createElement('div');
  q.className = 'fqueue'; q.id = qid;
  q.innerHTML = arr.map(function(f, i){
    return '<div class="fprog" id="' + qid + '_' + i + '">' +
      '<span class="nm" title="' + attr(f.name) + '">' + esc(f.name) + '</span>' +
      '<span class="pb"><i></i></span>' +
      '<span class="st">等待…</span></div>';
  }).join('');
  body.insertBefore(q, body.firstChild);
  var ok = 0, fail = 0;
  function step(i){
    if(i >= arr.length){
      if(fail) toast('上传完成：成功 ' + ok + ' 个，失败 ' + fail + ' 个', 'bad');
      else toast('已上传 ' + ok + ' 个文件到资料库', 'ok');
      /* ⚠️ 别立刻 fLoad：它会重建整个列表区（队列是列表区的兄弟节点），
         逐项「✓ 完成 / ✕ 失败」会被瞬间抹掉 —— 一次传十个文件时用户根本看不清哪几个失败。
         停 900ms 再刷新，让结果看得见。 */
      setTimeout(function(){ self.fLoad(); }, 900);
      return;
    }
    var cell = $(qid + '_' + i);
    function st(txt, cls){
      if(!cell) return;
      cell.className = 'fprog' + (cls ? ' ' + cls : '');
      var s = cell.querySelector('.st'); if(s) s.textContent = txt;
    }
    function pb(p){ if(!cell) return; var b = cell.querySelector('.pb i'); if(b) b.style.width = Math.round(p * 100) + '%'; }
    st('上传中');
    self.fOne(arr[i], pb).then(function(){
      pb(1); st('✓ 完成', 'ok'); ok++;
    }).catch(function(e){
      st('✕ 失败', 'bad'); fail++;
      if(cell) cell.title = String((e && e.message) || e).slice(0, 200);
    }).then(function(){ step(i + 1); });
  }
  step(0);
};

Rpt.fOne = function(f, onprog){
  var code = St.code || 'other';
  var nm = String(f.name || '');
  var ext = nm.indexOf('.') >= 0 ? nm.split('.').pop().toLowerCase() : '';
  if(!/^[a-z0-9]{1,8}$/.test(ext)) ext = '';
  var stamp = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  var key = code + '/' + stamp + (ext ? '.' + ext : '');
  var id = code + '_' + stamp;
  return this.fPut(f, key, onprog).then(function(){
    return api('wb_company_files', {
      method:'POST',
      headers:{'Content-Type':'application/json', 'Prefer':'return=minimal'},
      body:[{id:id, report_id:code, code:code, name:nm, ext:ext, mime:f.type || '',
             size_bytes:f.size || 0, bucket:CF_BUCKET, object_key:key,
             uploader:(Auth.name || Auth.user || ''), up:nowTs()}]
    });
  });
};

/* 直传存储。用 XHR 而不是 fetch —— 只有 XHR 拿得到上传进度（fetch 没有 upload 进度事件） */
Rpt.fPut = function(f, key, onprog){
  var url = STORE + 'object/' + enc(CF_BUCKET) + '/' + String(key).split('/').map(enc).join('/');
  return new Promise(function(res, rej){
    var x = new XMLHttpRequest();
    x.open('POST', url, true);
    try{
      x.setRequestHeader('Authorization', 'Bearer ' + CFG.key);
      /* 存真实 MIME：PDF/图片 以后重新下载时类型才对，浏览器预览也认 */
      x.setRequestHeader('Content-Type', f.type || 'application/octet-stream');
    }catch(e){}
    if(x.upload && onprog){
      x.upload.onprogress = function(ev){ if(ev.lengthComputable) onprog(ev.loaded / ev.total); };
    }
    x.onload = function(){
      if(x.status >= 200 && x.status < 300){ res(true); return; }
      rej(new Error('HTTP ' + x.status + ' ' + String(x.responseText || '').slice(0, 140)));
    };
    x.onerror = function(){ rej(new Error('网络错误，上传中断')); };
    x.send(f);
  });
};

/* 下载：走 fetch → blob → a[download]。
   ⚠️ 不能直接 `<a href=跨域地址 download>`：跨域时 download 属性会被浏览器忽略，
      变成「打开」而不是「下载」（服务端也没给 Content-Disposition）。 */
Rpt.fDl = function(id){
  var r = this.fFind(id); if(!r) return;
  toast('正在准备下载…', 'ok');
  fetch(fUrl(r)).then(function(res){
    if(!res.ok) throw new Error('HTTP ' + res.status);
    return res.blob();
  }).then(function(b){
    var a = document.createElement('a');
    var u = URL.createObjectURL(b);
    a.href = u; a.download = r.name || 'download';
    document.body.appendChild(a); a.click();
    setTimeout(function(){
      URL.revokeObjectURL(u);
      if(a.parentNode) a.parentNode.removeChild(a);
    }, 1500);
  }).catch(function(e){
    toast('下载失败：' + String((e && e.message) || e).slice(0, 110), 'bad');
  });
};

/* 预览：图片 / PDF / 纯文本直接在页面里看；Office 与压缩包浏览器渲染不了，提示下载 */
Rpt.fView = function(id){
  var r = this.fFind(id); if(!r) return;
  var k = fKind(r), url = fUrl(r), body;
  var ext = String(r.ext || '').toLowerCase();
  /* csv/tsv 归在「Excel」类（图标、打开方式都对），但它本质是纯文本 ⇒ 也走文本预览 */
  var csv = (ext === 'csv' || ext === 'tsv');
  var isText = (k === 'txt') || csv;
  var label = csv ? 'CSV' : (F_NAME[k] || '文件');
  if(k === 'img'){
    body = '<img src="' + attr(url) + '" alt="' + attr(r.name) + '">';
  } else if(k === 'pdf'){
    /* #view=FitH 让阅读器默认按宽度铺满。部分浏览器（手机 Safari / 关掉内置阅读器）不内嵌 PDF，
       会显示一片空白 —— 此时靠下面这条提示把用户引到「⬇ 下载」。 */
    body = '<div class="vpdf"><iframe src="' + attr(url) + '#view=FitH" title="' + attr(r.name) + '"></iframe>' +
           '<div class="vhint">若上方空白，说明当前浏览器不内嵌 PDF —— 点「⬇ 下载」用本地软件打开即可</div></div>';
  } else if(isText){
    body = '<pre id="vTxt">读取中…</pre>';
  } else {
    body = '<div class="nopv"><span class="big">' + (F_ICON[k] || F_ICON.other) + '</span>' +
           '浏览器不能内嵌预览 ' + esc(F_NAME[k] || '这种') + ' 文件<br>' +
           '点「⬇ 下载」后用本地软件打开即可</div>';
  }
  $('rptVMask').innerHTML =
    '<div class="rpt-vbox">' +
      '<div class="hd"><span class="tt">' + esc(r.name) + '</span>' +
        '<span class="x" onclick="Rpt.closeView()" title="关闭（Esc）">✕</span></div>' +
      '<div class="bd">' + body + '</div>' +
      '<div class="ft">' +
        '<span class="meta">' + esc(label) + ' · ' + fSize(r.size_bytes) +
          ' · ' + esc(fTime(r.t)) + (r.uploader ? (' · ' + esc(r.uploader)) : '') + '</span>' +
        '<button class="rbtn gh" onclick="Rpt.fDl(\'' + attr(r.id) + '\')">⬇ 下载</button>' +
        '<button class="rbtn gh" onclick="Rpt.closeView()">关闭</button>' +
      '</div>' +
    '</div>';
  $('rptVMask').className = 'rpt-vmask on';
  if(isText){
    fetch(url).then(function(res){
      if(!res.ok) throw new Error('HTTP ' + res.status);
      return res.text();
    }).then(function(t){
      var p = $('vTxt'); if(!p) return;
      p.textContent = t.length > 500000
        ? (t.slice(0, 500000) + '\n\n…（文件较大，上面只显示前 500KB，完整内容请点「⬇ 下载」）')
        : t;
    }).catch(function(e){
      var p = $('vTxt'); if(p) p.textContent = '读取失败：' + String((e && e.message) || e);
    });
  }
};
Rpt.closeView = function(){
  var m = $('rptVMask'); m.className = 'rpt-vmask'; m.innerHTML = '';
};

/* 删除：走密码门（danger），服务端 wb_del_company_file 做软删 */
Rpt.fDel = function(id){
  var r = this.fFind(id); if(!r) return;
  var self = this;
  Rpt.askPass('删除资料「' + String(r.name || '').slice(0, 46) + '」（' + fSize(r.size_bytes) + '）',
    function(pw){ self.fDelGo(id, pw); },
    {act:'删除', danger:true});
};
Rpt.fDelGo = function(id, pw){
  var self = this;
  rpc('wb_del_company_file', {p_token: Auth.token || '', p_id: id, p_pass: pw})
    .then(function(res){
      if(!res || !res.ok){ toast((res && res.msg) || '删除失败', 'bad'); return; }
      toast('已删除', 'ok');
      self.fLoad();
    })
    .catch(function(e){ toast('删除失败：' + String((e && e.message) || e).slice(0, 110), 'bad'); });
};

/* ============================================================================
   写操作门禁装配
   —— 把 Rpt 上所有「会改数据库」的方法统一包一层密码确认。
   协议：包装层先弹密码框；校验通过后把私有哨兵 RPASS_OK 追加为最后一个参数
   再调原方法 —— 原方法看到哨兵就直通，内部重入不会再弹第二次。
   ⚠️ delMod / delChart / delReport 已经在内部调 askPass，不要放进这张表（会连弹两次）。
   ⚠️ 弹窗用的是独立的 #rptPMask，所以抽屉里正在填的表单不会被清掉。 */
var RPASS_OK = {__rpassOk:true};

/* —— 编辑会话票据（与工作台 13.5 / 13.6 同一套语义）——
   入口「＋ 新增模块 / ＋ 新增图表」验过密码后开一张单子，紧接着在抽屉里点「保存」
   凭单直通，用户只输一次；抽屉一关（closeDrawer）或退出登录整张作废 ——
   所以下次再点「＋ 新增模块」照样要重新输密码。 */
var RTICK = {};
var RTICK_MS = 30 * 60 * 1000;
function rTickIssue(k){ RTICK[k] = Date.now(); }
function rTickHas(k){
  var t = RTICK[k];
  if(!t) return false;
  if(Date.now() - t > RTICK_MS){ delete RTICK[k]; return false; }
  return true;
}
function rTickClear(){ if(!RTICK) return; for(var k in RTICK){ delete RTICK[k]; } }

var RGATE = [
  /* [方法, 动作, 不可逆, 是否拦（返回 false 直通）, 目标描述] */
  ['toggleEdit','编辑',false,function(){ return !St.edit; },
    function(){ return '进入编辑模式（可直接改正文 / 结论 / 一句话本质 / 页脚）'; }],
  ['svHead','保存',false,null,
    function(){ return '页眉与核心结论：标题 / 副标题 / 徽标 / 8 项指标 / 目录 / 一句话本质 / 页脚'; }],
  ['svMod','保存',false,null,
    function(){ var m = Rpt.findMod(UI.selMod) || {};
                return '模块 ' + (m.no || '') + '：' + String(m.title || '').slice(0, 40); }],
  /* 槽 29 页面调整落库（2026-09-22 用户令）—— 与「保存模块」同级：写的是模块正文、公开页立即可见。
     没有 when 条件 ⇒ 每次都验管理员密码（它不是从抽屉里发起的，没有可借的编辑票据）。 */
  ['commitScore','提交',false,null,
    function(id){
      var m = Rpt.findMod(id) || {};
      return '把槽 29「企业评分」当前这版分数提交到数据库（模块 ' + (m.no || '') +
             '：' + String(m.title || '').slice(0, 24) + '）';
    }],
  ['addMod','新增',false,null,
    function(){ return '新增一个空模块（编号自动接在最后，随后会写入数据库）'; }, 'svMod'],
  ['svChart','保存',false,null,
    function(){ var k = UI.selChart, r = Rpt.findChart(k) || {};
                return '图表「' + String(r.name || k || '') + '」的数据与样式'; }],
  ['addChart','新增',false,null,
    function(){ return '新增一张示例图表（随后会写入数据库）'; }, 'svChart'],
  /* 覆盖式写入（整表覆盖编辑框里的数据表）：与 JSON 导入同级 —— 不可逆，永远要输密码。
     位置在 addChart 之后、createReport 之前；标签函数里点出是「哪一张图表」。 */
  ['impTable','导入',true,null,
    function(){ var k = UI.selChart, r = Rpt.findChart(k) || {};
                return '把上传的 Excel / CSV 整表覆盖到图表「' + String(r.name || k || '') + '」的数据表上'; }],
  /* 表格增删行（图表数据表 / 模块正文里的表格）：
     都是**只改编辑缓冲、不写库**的动作（写库仍走「保存」），所以 danger=false；
     但删行会丢掉已填的内容，所以按「删除」计 —— 且 danger=false 才带得出
     「15 分钟免重复输入」那个口子。票据指向自己：同一张抽屉里连着删十行只输一次密码，
     抽屉一关（closeDrawer）票据作废。插行不需要验（纯新增，随时可删）。 */
  ['gridDelRow','删除',false,null,
    function(idx){
      var k = UI.selChart, r = Rpt.findChart(k) || {}, m = readGrid();
      var i = parseInt(idx, 10);
      var at = isNaN(i) ? m.rows.length : (i + 1);
      var lab = (!isNaN(i) && m.rows[i]) ? String(m.rows[i][0] == null ? '' : m.rows[i][0]).slice(0, 14) : '';
      return '删除图表「' + String(r.name || k || '') + '」数据表里的第 ' + at + ' 行' +
             (lab ? '（' + lab + '）' : '') + ' —— 还没入库，点「💾 保存图表」才生效';
    }, 'gridDelRow'],
  ['rteRow','删除',false,function(id, delta){ return delta < 0; },
    function(id, delta){
      var m = (UI.tab === 'mods') ? Rpt.findMod(UI.selMod) : null;
      return '删除' + (m ? ('模块 ' + (m.no || '') + '「' + String(m.title || '').slice(0, 24) + '」')
                          : '这一段正文') + '表格里光标所在的那一行 —— 还没入库，点保存才生效';
    }, 'rteRow'],
  ['createReport','新增',false,null,
    function(){ return '新建研报（代码 ' + String(($('n-code') || {}).value || '') +
                      '），会写入壳记录 + 31 个空模块'; }],
  /* 覆盖式写入：不可逆，永远要输密码 */
  ['importJSON','导入',true,null,
    function(){ return '把粘贴的 JSON 覆盖写入数据库（模块 + 图表，按 id upsert）'; }]
];
RGATE.forEach(function(sp){
  var name = sp[0], act = sp[1], danger = !!sp[2], when = sp[3], label = sp[4];
  var tickFn = sp[5] || null;
  var raw = Rpt[name];
  if(typeof raw !== 'function') return;
  Rpt[name] = function(){
    var args = [].slice.call(arguments);
    if(args.length && args[args.length - 1] === RPASS_OK){
      args.pop();
      return raw.apply(Rpt, args);
    }
    if(when && !when.apply(Rpt, args)) return raw.apply(Rpt, args);
    /* 抽屉是刚验过密码才打开的（票据未作废）→ 凭单直通，别让用户在同一张表单里输第二次 */
    if(rTickHas(name)) return raw.apply(Rpt, args);
    var txt;
    try{ txt = label.apply(null, args); }catch(e){ txt = name; }
    Rpt.askPass(txt, function(){
      if(tickFn) rTickIssue(tickFn);   /* 开票：这张抽屉里的「保存」凭票直通 */
      args.push(RPASS_OK);
      return raw.apply(Rpt, args);
    }, {act:act, danger:danger});
  };
  /* 给验收探针留的标记：可断言「这个方法确实被门禁包过」 */
  Rpt[name].__gated = true;
  Rpt[name].__act = act;
  Rpt[name].__danger = danger;
  Rpt[name].__raw = raw;
});



</script>
<script id="rte-tools-js">/* 研报编辑器工具栏扩展（2026-10-20）
   用户令：编辑里增加 ①文字大小 ②文字颜色 ③填充颜色 ④编号样式（多几种）。

   实现思路：**不改模板里那份 rteBar**，而是在末尾用「包装器」接管它 ——
   先把原始 rteBar 存起来，调用后再往返回的 HTML 里插入新控件。
   好处：模板原文一个字不动，后续若模板升级也不会打架；坏处：依赖 .rtebar-tip 这个锚点，
   所以下面用 indexOf 判空，找不到就原样返回（绝不抛错）。

   ⚠️ 所有按钮都要 onmousedown="return false"：否则点按钮会抢走编辑区选区，
      execCommand / getSelection 全部失效（模板里原有按钮也是这么写的）。
*/
(function(){
  if (window.__rteTools) return;
  window.__rteTools = 1;

  var FG = ['#c0392b', '#a5232f', '#d4541f', '#c9a227', '#0f7b6c',
            '#1f5fa8', '#3f51b5', '#6b3fa0', '#14100e', '#6b6259'];
  var BG = ['#fff3cd', '#fde2e2', '#fce8d5', '#e3eefc', '#e6f4ea', '#efe6fa', '#efeae0'];

  function swatch(kind, c, id){
    return '<button type="button" class="rte-col" onmousedown="return false" title="' + c + '" ' +
      'style="background:' + c + '" ' +
      'onclick="Rpt.rteColor(\'' + id + '\',\'' + kind + '\',\'' + c + '\')"></button>';
  }

  function palette(id, kind){
    var list = kind === 'bg' ? BG : FG;
    var rows = list.map(function(c){ return swatch(kind, c, id); }).join('');
    return '<div class="rte-pal" id="' + id + '-pal-' + kind + '">' +
      '<div class="row"><span class="lab">' + (kind === 'bg' ? '底色' : '字色') + '</span>' + rows + '</div>' +
      '<div class="row"><span class="lab">清除</span>' +
        '<button type="button" class="rteb" onmousedown="return false" title="恢复默认颜色" ' +
        'onclick="Rpt.rteColor(\'' + id + '\',\'' + kind + '\',\'\')">默认</button>' +
      '</div></div>';
  }

  /* 打开色板的按钮。⚠️ 2026-10-20 踩坑：上一版只注入了 palette(fg)/palette(bg) 两块面板，
     却漏了这两个触发器 ⇒ 面板永远打不开，用户看到的就是「文字色和填充色没了」。
     以后加面板必须同时加触发器，两边成对出现。 */
  function palBtn(id, kind, label){
    var c = kind === 'bg' ? '#f0d98a' : '#c0392b';
    return '<button type="button" class="rteb rteb-pal" onmousedown="return false" title="' +
      (kind === 'bg' ? '填充颜色（给选中的字加底色）' : '文字颜色') + '" ' +
      'onclick="Rpt.rtePal(\'' + id + '\',\'' + kind + '\')">' + label +
      '<i class="sw" style="background:' + c + '"></i></button>';
  }

  function sizePal(id){
    var sizes = [12, 13, 14, 16, 18, 20, 24, 28];
    var btns = sizes.map(function(px){
      return '<button type="button" class="rteb" onmousedown="return false" title="' + px + 'px" ' +
        'onclick="Rpt.rteSize(\'' + id + '\',' + px + ')">' + px + '</button>';
    }).join('');
    return '<div class="rte-pal" id="' + id + '-pal-size">' +
      '<div class="row"><span class="lab">字号</span>' + btns + '</div></div>';
  }

  function listPal(id){
    var L = [['decimal', '1. 2. 3.'], ['decimal-leading-zero', '01. 02.'], ['lower-alpha', 'a. b. c.'],
             ['upper-alpha', 'A. B. C.'], ['lower-roman', 'i. ii. iii.'], ['upper-roman', 'I. II. III.'],
             ['cjk-ideographic', '一、二、三'], ['disc', '• 圆点'], ['square', '▪ 方块'], ['none', '无序号']];
    var btns = L.map(function(x){
      return '<button type="button" class="rteb" onmousedown="return false" ' +
        'onclick="Rpt.rteList(\'' + id + '\',\'' + x[0] + '\')">' + x[1] + '</button>';
    }).join('');
    return '<div class="rte-pal" id="' + id + '-pal-list">' +
      '<div class="row" style="flex-wrap:wrap;max-width:360px">' +
      '<span class="lab">编号</span>' + btns + '</div></div>';
  }

  var _rteBar0 = window.rteBar;
  if (typeof _rteBar0 === 'function') {
    window.rteBar = function(id, withChart){
      var h = _rteBar0.apply(this, arguments);
      if (typeof h !== 'string' || h.indexOf('rtebar-tip') < 0) return h;
      var extra =
        '<span class="rteSep"></span>' +
        /* ★ select 上绝不能写 onmousedown="return false"：那会连原生下拉一起禁掉，
           用户看到的就是「点不了」。改成先存选区、选完再还原（见 rteSaveSel/rteRestoreSel）。 */
        palBtn(id, 'fg', '字色') +
        palBtn(id, 'bg', '底色') +
        '<button type="button" class="rteb" onmousedown="return false" title="文字大小" ' +
          'onclick="Rpt.rtePal(\'' + id + '\',\'size\')">A<sup>±</sup></button>' +
        '<button type="button" class="rteb" onmousedown="return false" title="编号样式（先把光标点进列表）" ' +
          'onclick="Rpt.rtePal(\'' + id + '\',\'list\')">编号</button>' +
        sizePal(id) + listPal(id) +
        palette(id, 'fg') + palette(id, 'bg');
      /* ★ 模板原有的「图表」下拉也写着 onmousedown="return false" —— 同样打不开。
         这里统一把**所有 select 上的这条拦截**换成「先存选区」。 */
      h = h.replace(/<select([^>]*?)\s+onmousedown="return false"/g,
                    '<select$1 onmousedown="Rpt.rteSaveSel(\'' + id + '\')"');
      return h.replace('<span class="rtebar-tip">', extra + '<span class="rtebar-tip">');
    };
  }

  /* ---------- 保存时修结构 ----------
     Chrome 在 contenteditable 里编辑块级元素会**把 class 剥掉**：
     实测 600328 保存后 `<div class="vbox">`、`<p class="vlead">` 全丢，
     页面上的「导语 + 编号卡片」就退化成普通段落（用户看到「样式不一致 / 改了没反应」）。
     这里在写库前统一补回：有 .vlist 而没 .vbox ⇒ 包一层；首个 <p> 补 vlead。 */
  function fixVBox(h){
    if (!h || h.indexOf('vlist') < 0) return h;
    if (h.indexOf('vbox') >= 0) {
      /* 已经有 vbox，只补 vlead */
      return h.replace(/(<div class="vbox">\s*)<p(?!\s+class)/i, '$1<p class="vlead"');
    }
    var i = h.indexOf('<ul');
    if (i < 0) return h;
    var head = h.slice(0, i), tail = h.slice(i);
    head = head.replace(/<p(\s[^>]*)?>/i, function(m, a){
      a = a || '';
      if (/class=/.test(a)) return '<p' + a.replace(/class="([^"]*)"/, 'class="$1 vlead"') + '>';
      return '<p class="vlead"' + a + '>';
    });
    return '<div class="vbox">' + head + tail + '</div>';
  }

  function fixEssence(h){
    if (!h || h.indexOf('essence') < 0) return h;
    if (h.indexOf('class="ec"') >= 0) return h;
    var m = h.match(/<div class="essence"[^>]*>([\s\S]*?)<\/div>\s*$/i);
    var inner = m ? m[1] : h;
    inner = inner.replace(/<div class="et">[\s\S]*?<\/div>/i, '');
    return '<div class="essence" id="essence"><div class="et">THE ESSENCE · 一句话本质（可证伪命题）</div>' +
           '<div class="ec">' + inner + '</div></div>';
  }

  function fixStruct(id, h){
    try{
      if (id === 'h-essence') return fixEssence(h);
      if (id === 'h-vc') return fixVBox(h);
    }catch(e){}
    return h;
  }

  var _rteSave0 = window.rteSave;
  if (typeof _rteSave0 === 'function') {
    window.rteSave = function(html){ return fixStruct(UI.__rteId || '', _rteSave0.apply(this, arguments)); };
  }

  /* rteRead 里调用 rteSave 时拿不到 id，这里记一下「当前正在读哪个字段」 */
  var _rteRead0 = window.rteRead;
  if (typeof _rteRead0 === 'function') {
    window.rteRead = function(id, orig){
      UI.__rteId = id;
      try { return _rteRead0.apply(this, arguments); }
      finally { UI.__rteId = ''; }
    };
  }

  /* 选区记忆（给 select 用）：点 select 会让编辑区失去选区，所以在 mousedown 时先克隆一份 Range */
  Rpt._sel = {};
  Rpt.rteSaveSel = function(id){
    try{
      var sel = window.getSelection();
      if(sel && sel.rangeCount) Rpt._sel[id] = sel.getRangeAt(0).cloneRange();
    }catch(e){}
  };
  Rpt.rteRestoreSel = function(id){
    var r = Rpt._sel[id];
    if(!r) return false;
    try{
      var sel = window.getSelection();
      sel.removeAllRanges(); sel.addRange(r);
      return true;
    }catch(e){ return false; }
  };

  /* 选区兜底：**当前选区本来就在这个编辑区里时，绝不要去「还原」记忆里的旧 Range**。
     2026-10-20 踩坑：连续两次改色时 Rpt._sel 还停在上一步的位置（selectionchange 是异步的），
     一还原就把新选区顶掉，颜色落到上一段文字上 —— 表现就是「改了不认识的那块」。
     顺序：先看现状 → 不在框里才回填记忆。 */
  function _inBox(box){
    try{
      var s = window.getSelection();
      if (!s || !s.rangeCount) return false;
      var n = s.anchorNode;
      while (n && n !== box) n = n.parentNode;
      return n === box;
    }catch(e){ return false; }
  }
  function _ensureSel(box, id){
    if (!_inBox(box)) Rpt.rteRestoreSel(id);
    var s = window.getSelection();
    return !!(s && s.rangeCount);
  }

  /* 字号：用 Range 包一层 span（execCommand('fontSize') 只能给 1—7 档，且产出 <font>） */
  Rpt.rteSize = function(id, px){
    if (!px) return;
    var box = $(id); if (!box) return;
    box.focus();
    if (!_ensureSel(box, id)) { toast('先选中要改的字', 'bad'); return; }
    var sel = window.getSelection();
    var r = sel.getRangeAt(0);
    if (r.collapsed) { toast('先选中要改的字，再选字号', 'bad'); return; }
    try {
      var sp = document.createElement('span');
      sp.style.fontSize = px + 'px';
      sp.appendChild(r.extractContents());
      r.insertNode(sp);
      var nr = document.createRange(); nr.selectNodeContents(sp);
      sel.removeAllRanges(); sel.addRange(nr);
    } catch (e) { toast('字号没改成功，可展开「代码」手改', 'bad'); return; }
    UI.rteDirty[id] = 1;
    Rpt.rtePal(id, '');
  };

  /* ---------- 颜色：与线上同一套色号 ----------
     ⚠️ 2026-10-20 用户「颜色改不进去，编辑里也获取不到，颜色不一致」的根因：
     线上三色是 **类**（裸 <b> = 朱砂 / .hl2 = 靛蓝 / .hl3 = 黛紫），且规则全挂在
     `#mods b.hl2{…!important}` / `.card b.hl2` 这类**页面作用域**上。而
     execCommand('foreColor') 产出的是内联 span/font，回到页面被 !important 盖掉
     ⇒ 改了不生效，编辑区里又因为 .rte 不匹配那些作用域而全是黑字。
     改法：① 命中加粗短语就**换 class**（保住三色体系）；
           ② 普通文字才包 span，且内联色带 !important（行内 important 压过样式表 important）；
           ③ 默认色 = 去掉类与内联色，回到裸 <b>（一级朱砂）。 */
  var C_RED = '#c0392b', C_BLUE = '#1f5fa8', C_PURPLE = '#6b3fa0';

  function _anc(n, box, names){
    while (n && n !== box){
      if (n.nodeType === 1 && names.indexOf(n.nodeName) >= 0) return n;
      n = n.parentNode;
    }
    return null;
  }
  function _touched(box, r){
    var all = box.querySelectorAll('b,strong'), out = [], i;
    for (i = 0; i < all.length; i++){
      try { if (r.intersectsNode && r.intersectsNode(all[i])) out.push(all[i]); } catch(e){}
    }
    return out;
  }
  function _setInl(el, prop, val){
    if (val) el.style.setProperty(prop, val, 'important');
    else el.style.removeProperty(prop);
    if (!el.getAttribute('style')) el.removeAttribute('style');
  }
  function _paintB(b, color){
    b.classList.remove('hl2'); b.classList.remove('hl3');
    if (color === C_BLUE) b.classList.add('hl2');
    else if (color === C_PURPLE) b.classList.add('hl3');
    if (!b.getAttribute('class')) b.removeAttribute('class');
    if (!color || color === C_RED || color === C_BLUE || color === C_PURPLE) _setInl(b, 'color', '');
    else _setInl(b, 'color', color);        /* 三色之外的任意色走内联 important */
  }
  function _spanOf(n, box, mark){
    while (n && n !== box){
      if (n.nodeType === 1 && n.hasAttribute && n.hasAttribute(mark)) return n;
      n = n.parentNode;
    }
    return null;
  }
  function _unwrap(el){
    var p = el.parentNode; if (!p) return null;
    while (el.firstChild) p.insertBefore(el.firstChild, el);
    p.removeChild(el);
    return p;
  }
  function _wrapSel(r, attrs, styleStr){
    var sp = document.createElement('span'), k;
    for (k in attrs) sp.setAttribute(k, attrs[k]);
    if (styleStr) sp.setAttribute('style', styleStr);
    sp.appendChild(r.extractContents());
    r.insertNode(sp);
    try{
      var nr = document.createRange(); nr.selectNodeContents(sp);
      var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(nr);
    }catch(e){}
    return sp;
  }

  Rpt.rteColor = function(id, kind, color){
    var box = $(id); if (!box) return;
    box.focus();
    if (!_ensureSel(box, id)) { toast('先把光标点进要改色的文字里', 'bad'); return; }   /* ★ 别用裸 restore：会顶掉当前选区 */
    var sel = window.getSelection();
    var r = sel.getRangeAt(0);
    var prop = kind === 'bg' ? 'background-color' : 'color';
    var mark = kind === 'bg' ? 'data-b' : 'data-c';

    /* ① 落在加粗短语上 → 换类，保持线上的三色体系 */
    if (kind === 'fg'){
      var bs = _touched(box, r);
      if (bs.length){
        for (var i = 0; i < bs.length; i++) _paintB(bs[i], color || C_RED);
        UI.rteDirty[id] = 1; Rpt.rtePal(id, '');
        return;
      }
    }

    /* ② 已经有自己包过的 span → 就地改 / 去掉 */
    var sp = _spanOf(r.startContainer, box, mark);
    if (sp){
      if (color) _setInl(sp, prop, color); else _unwrap(sp);
      UI.rteDirty[id] = 1; Rpt.rtePal(id, '');
      return;
    }

    /* ③ 普通文字 → 包一层带 !important 的 span */
    if (!color){ if (kind === 'fg') toast('这段本来就是默认色', 'ok'); Rpt.rtePal(id, ''); return; }
    if (r.collapsed){ toast('先选中要改色的字，再点颜色', 'bad'); return; }
    try {
      _wrapSel(r, kind === 'bg' ? {'data-b':'1'} : {'data-c':'1'}, prop + ':' + color + ' !important');
    } catch (e) { toast('颜色没改成功，可展开「代码」手改', 'bad'); return; }
    UI.rteDirty[id] = 1; Rpt.rtePal(id, '');
  };

  Rpt.rtePal = function(id, kind){
    var kinds = ['fg', 'bg', 'size', 'list'];
    var target = kind ? document.getElementById(id + '-pal-' + kind) : null;
    for (var i = 0; i < kinds.length; i++) {
      var el = document.getElementById(id + '-pal-' + kinds[i]);
      if (el) el.classList.toggle('on', el === target);
    }
  };

  /* 编号样式：只改光标所在 ol / ul 的 list-style-type，不影响其它列表 */
  Rpt.rteList = function(id, type){
    var box = $(id); if (!box) return;
    box.focus();
    if (!_ensureSel(box, id)) { toast('先把光标点进列表里，再选编号样式', 'bad'); return; }
    var sel = window.getSelection();
    var n = sel && sel.anchorNode;
    while (n && n !== box && n.nodeName !== 'OL' && n.nodeName !== 'UL') n = n.parentNode;
    if (!n || n === box) { toast('先把光标点进列表里，再选编号样式', 'bad'); return; }
    n.style.listStyleType = type || '';
    UI.rteDirty[id] = 1;
    Rpt.rtePal(id, '');
  };

  /* 持续记录选区：select 会抢焦点，靠 mousedown 存一次不够稳。
     监听 selectionchange，只要锚点在某个 .rte 里就把 Range 克隆下来。 */
  document.addEventListener('selectionchange', function(){
    try{
      var sel = window.getSelection();
      if(!sel || !sel.rangeCount) return;
      var n = sel.anchorNode;
      var el = (n && n.nodeType === 1) ? n : (n && n.parentNode);
      while(el && !(el.classList && el.classList.contains('rte'))) el = el.parentNode;
      if(el && el.id) Rpt._sel[el.id] = sel.getRangeAt(0).cloneRange();
    }catch(e){}
  });

  /* 图表下拉选完要插到「原来选中的位置」，所以同样先还原选区 */
  if (typeof Rpt.rteChart === 'function') {
    var _chart0 = Rpt.rteChart;
    Rpt.rteChart = function(id){
      var box = $(id);
      if (box) box.focus();
      Rpt.rteRestoreSel(id);
      return _chart0.apply(this, arguments);
    };
  }

  /* 点空白处收起色板 */
  document.addEventListener('mousedown', function(e){
    var t = e.target;
    /* 点在色板内部（含「默认」按钮）不要收起 —— 否则 mousedown 一收起，
       mouseup 落在隐藏元素上，click 根本不触发，看起来就是「点了没反应」。 */
    if (t && t.closest && t.closest('.rte-pal')) return;
    if (t && t.className && String(t.className).indexOf('rte-col') >= 0) return;
    var pals = document.querySelectorAll('.rte-pal.on');
    for (var i = 0; i < pals.length; i++) pals[i].classList.remove('on');
  }, true);
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>深度研究报告</title>
<script>
/* 最早注入错误钩子：脚本块语法错之外的运行时错误都能抓到（探针用） */
window.__RPT_ERR = [];
window.onerror = function(m, s, l, c){ window.__RPT_ERR.push(String(m) + ' @' + l + ':' + c); };
window.addEventListener('unhandledrejection', function(e){ window.__RPT_ERR.push('unhandled: ' + String(e.reason && e.reason.message || e.reason)); });
</script>
<script>/*__ECHARTS__*/</script>
<style>
/*__REPORTCSS__*/

/* ============================================================
   研报页附加样式（顶部操作条 / 编辑抽屉 / 图表工具条 / 空态）
   主题色：正红 #c8102e · 深红 #8c0a20 · 亮红 #e63946 · 金 #c9a227
   ============================================================ */
:root{
  --brand:#c8102e; --brand-deep:#8c0a20; --brand-bright:#e63946;
  --brand-soft:#fdecee; --brand-line:rgba(200,16,46,.18); --gold2:#c9a227;
}
body{font-size:15.5px}

/* ---------- 顶部操作条 ---------- */
.rbar{
  position:sticky;top:10px;z-index:60;display:flex;align-items:center;gap:9px;flex-wrap:wrap;
  padding:9px 12px;margin:0 0 18px;border-radius:14px;
  background:rgba(255,255,255,.94);
  backdrop-filter:saturate(180%) blur(12px);-webkit-backdrop-filter:saturate(180%) blur(12px);
  border:1px solid var(--brand-line);box-shadow:0 6px 22px rgba(140,10,32,.08);
}
.rbar .rb-brand{font-weight:800;color:var(--brand-deep);font-size:15px;letter-spacing:.2px;white-space:nowrap}
.rbar .rb-brand em{font-style:normal;color:var(--brand)}
.rbar .rb-sp{flex:1;min-width:8px}
.rbar .rb-tag{font-size:12px;padding:2px 9px;border-radius:999px;background:var(--brand-soft);
  color:var(--brand-deep);border:1px solid var(--brand-line);white-space:nowrap}
.rbar .rb-tag.ok{background:#eefaf3;color:#0b8a5c;border-color:rgba(11,138,92,.25)}
.rbar .rb-tag.warn{background:#fff8e8;color:#8a6d10;border-color:rgba(201,162,39,.35)}
.rbtn{
  font:inherit;font-size:13px;line-height:1;padding:8px 13px;border-radius:10px;cursor:pointer;
  border:1px solid var(--brand-line);background:#fff;color:var(--brand-deep);
  transition:.16s;white-space:nowrap;
}
.rbtn:hover{background:var(--brand-soft);border-color:var(--brand)}
.rbtn.pri{background:linear-gradient(135deg,var(--brand),var(--brand-deep));color:#fff;border-color:transparent;
  box-shadow:0 4px 14px rgba(200,16,46,.24)}
.rbtn.pri:hover{filter:brightness(1.08)}
.rbtn.on{background:linear-gradient(135deg,#e63946,#c8102e);color:#fff;border-color:transparent}
.rbtn.gh{background:transparent;border-color:rgba(140,10,32,.22);color:#7d5b60}
.rbtn.sm{font-size:12px;padding:6px 10px;border-radius:8px}
.rbtn:disabled{opacity:.55;cursor:default}
.rsel{font:inherit;font-size:13px;padding:7px 9px;border-radius:10px;
  border:1px solid var(--brand-line);background:#fff;color:var(--brand-deep);cursor:pointer;max-width:190px}

/* ---------- 模块上的编辑按钮（仅编辑模式显示） ---------- */
.rpt-ops{position:absolute;top:14px;right:16px;display:none;gap:6px;z-index:5}
html.edit .rpt-ops{display:flex}
.rpt-ops .rbtn{background:rgba(255,255,255,.96);box-shadow:0 3px 10px rgba(140,10,32,.12)}
.rpt-chartwrap{position:relative}
html.edit .rpt-chartwrap::after{
  content:'📊 点右上角按钮编辑图表数据';position:absolute;inset:0;pointer-events:none;
  border:2px dashed rgba(200,16,46,.30);border-radius:12px;background:rgba(253,236,238,.10);
}
html.edit .rpt-chartwrap>.rpt-cops{display:flex}
.rpt-cops{position:absolute;top:6px;right:8px;display:none;gap:6px;z-index:6}

/* ---------- 图表占位 / 失败 ---------- */
.rpt-chartmiss{display:flex;align-items:center;justify-content:center;height:100%;min-height:120px;
  color:#a0888d;font-size:13px;background:repeating-linear-gradient(45deg,#fffafb,#fffafb 10px,#fdf2f3 10px,#fdf2f3 20px);
  border-radius:10px}
.rpt-toolbar{display:flex;justify-content:flex-end;gap:3px;margin:2px 0 4px}
.rpt-toolbar button{font:inherit;font-size:11.5px;padding:3px 9px;border-radius:7px;cursor:pointer;
  border:1px solid #f2dce0;background:#fff;color:#a0888d;transition:.14s}
.rpt-toolbar button:hover{border-color:var(--brand);color:var(--brand)}
.rpt-toolbar button.on{background:var(--brand);border-color:var(--brand);color:#fff}

/* ---------- 空态 ---------- */
.rpt-empty{background:#fff;border:1px dashed var(--brand-line);border-radius:16px;
  padding:44px 26px;text-align:center;color:#7d5b60;box-shadow:0 4px 18px rgba(140,10,32,.05)}
.rpt-empty .big{font-size:38px;line-height:1;margin-bottom:12px}
.rpt-empty h3{font-size:19px;color:var(--brand-deep);margin-bottom:8px;font-weight:800}
.rpt-empty p{font-size:13.5px;line-height:2;max-width:620px;margin:0 auto}

/* ---------- 编辑抽屉 ---------- */
.rpt-mask{position:fixed;inset:0;z-index:200;display:none;background:rgba(74,7,16,.44)}
.rpt-mask.on{display:block;animation:rptFade .18s ease}
@keyframes rptFade{from{opacity:0}to{opacity:1}}
.rpt-drawer{
  position:absolute;top:0;right:0;bottom:0;width:min(880px,94vw);
  display:flex;flex-direction:column;background:#fffdfd;
  box-shadow:-16px 0 50px rgba(74,7,16,.22);
  animation:rptSlide .24s cubic-bezier(.22,.8,.36,1);
}
@keyframes rptSlide{from{transform:translateX(30px);opacity:.5}to{transform:none;opacity:1}}
.rpt-dhead{display:flex;align-items:center;gap:10px;padding:14px 18px;
  background:linear-gradient(135deg,#8c0a20,#c8102e);color:#fff}
.rpt-dhead b{font-size:16px;font-weight:800}
.rpt-dhead .sub{font-size:12px;opacity:.82}
.rpt-dhead .x{margin-left:auto;cursor:pointer;font-size:20px;line-height:1;opacity:.9;padding:2px 6px;
  border-radius:8px}
.rpt-dhead .x:hover{background:rgba(255,255,255,.16)}
.rpt-tabs{display:flex;gap:6px;padding:10px 18px 0;background:#fff;border-bottom:1px solid #f6e6e9}
.rpt-tabs button{font:inherit;font-size:13.5px;padding:8px 14px;border:0;background:transparent;cursor:pointer;
  color:#9a7d82;border-bottom:2px solid transparent;transition:.15s}
.rpt-tabs button:hover{color:var(--brand)}
.rpt-tabs button.on{color:var(--brand-deep);font-weight:700;border-bottom-color:var(--brand)}
.rpt-dbody{flex:1;overflow:auto;padding:16px 18px 26px}
.rpt-dfoot{display:flex;gap:8px;justify-content:flex-end;align-items:center;
  padding:11px 18px;border-top:1px solid #f6e6e9;background:#fffafb}
.rpt-dfoot .lf{margin-right:auto;font-size:12px;color:#a0888d}

.rfld{margin-bottom:14px}
.rfld>label{display:block;font-size:12.5px;font-weight:700;color:#7d5b60;margin-bottom:6px}
.rfld>label em{font-style:normal;font-weight:400;color:#b09a9e;margin-left:6px}
.rinp,.rtxt,.rsel2{width:100%;font:inherit;font-size:13.5px;padding:9px 11px;border-radius:10px;
  border:1px solid #f0dde0;background:#fff;color:#3a2024;transition:.15s}
.rinp:focus,.rtxt:focus,.rsel2:focus{outline:0;border-color:var(--brand);box-shadow:0 0 0 3px rgba(200,16,46,.10)}
.rtxt{font-family:ui-monospace,Consolas,"Courier New",monospace;font-size:12.5px;line-height:1.75;
  resize:vertical;min-height:260px;white-space:pre;overflow-wrap:normal;overflow-x:auto}
.rtxt.js{min-height:200px}
.rgrid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.rgrid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 14px}
.rhint{font-size:12px;color:#a0888d;line-height:1.85;margin:-4px 0 12px}
.rhint code{background:#fdf2f3;padding:1px 5px;border-radius:5px;color:var(--brand-deep);font-size:11.5px}

/* 抽屉里的列表 */
.rlist{display:flex;flex-direction:column;gap:6px}
.rlist .it{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:11px;
  border:1px solid #f4e4e7;background:#fff;cursor:pointer;transition:.14s}
.rlist .it:hover{border-color:var(--brand);background:#fffafb;transform:translateX(2px)}
.rlist .it .no{flex:0 0 30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#c8102e,#8c0a20);color:#fff;font-size:12.5px;font-weight:800}
.rlist .it .tx{flex:1;min-width:0}
.rlist .it .tx b{display:block;font-size:13.5px;color:#3a2024;font-weight:700;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rlist .it .tx span{font-size:11.5px;color:#a0888d}

/* 可视化编辑区（所见即所得，用户不必面对 HTML 代码） */
.rtebar{display:flex;flex-wrap:wrap;gap:4px;align-items:center;padding:6px 8px;
  background:#fdf2f3;border:1px solid #f0dde0;border-bottom:none;border-radius:10px 10px 0 0}
.rteb{font:inherit;font-size:12px;line-height:1;padding:6px 9px;border-radius:8px;cursor:pointer;
  border:1px solid #f0dde0;background:#fff;color:#7d5b60;transition:.14s}
.rteb:hover{border-color:var(--brand);color:var(--brand-deep);background:#fffafb}
.rteb:active{transform:translateY(1px)}
.rteb b,.rteb i,.rteb u,.rteb s{font-size:12.5px}
.rteSep{width:1px;height:17px;background:#edd6da;margin:0 3px}
.rtesel{font:inherit;font-size:12px;padding:5px 6px;border-radius:8px;border:1px solid #f0dde0;
  background:#fff;color:#7d5b60;max-width:150px}
.rtebar-tip{margin-left:auto;font-size:11.5px;color:#b09a9e;padding-right:4px}

.rte{min-height:170px;max-height:50vh;overflow:auto;padding:14px 16px;background:#fff;
  border:1px solid #f0dde0;border-radius:0 0 10px 10px;font-size:14px;line-height:1.78;color:#3a2024;
  outline:0;transition:.15s}
.rte:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(200,16,46,.10)}
.rte>*:first-child{margin-top:0}
.rte>*:last-child{margin-bottom:0}
.rte img{max-width:100%}
.rte table{max-width:100%}

/* 图表位置：受保护的标签，点不动、改不了，避免误删代码 */
.rte-chip{display:inline-block;vertical-align:middle;margin:3px 2px;padding:4px 11px;border-radius:20px;
  background:#fde8ea;border:1px dashed #d99aa3;color:#a3122a;font-size:12.5px;font-weight:700;
  user-select:none;-webkit-user-select:none;cursor:default;white-space:nowrap}
.rte-chip::before{content:'📊 ';font-weight:400}

.rsrc{margin-top:9px}
.rsrc>summary{cursor:pointer;font-size:12px;color:#a0888d;list-style:none;padding:3px 0}
.rsrc>summary::-webkit-details-marker{display:none}
.rsrc>summary::before{content:'▸ '}
.rsrc[open]>summary::before{content:'▾ '}
.rsrc-warn{font-size:12px;color:#a3122a;background:#fdecee;border:1px solid #f4d4d8;
  border-radius:9px;padding:7px 10px;margin:4px 0 7px;line-height:1.7}
.rsrc-txt{min-height:120px !important;font-size:12px;line-height:1.6}

/* 新建研报：代码已存在时的拒绝提示（防止整份覆盖） */
.n-warn{margin:4px 0 12px;padding:11px 13px;border-radius:11px;font-size:13px;line-height:1.8;
  background:#fdecee;border:1px solid #f0c7cc;color:#8c0a20}
.n-warn b{color:#a3122a}

/* 数据表格编辑器 */
/* 数据表上方的「导入 Excel / CSV」工具条（放在 .rpt-gridwrap 上面，别塞进滚动区里） */
.rpt-iotools{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 9px}
.rpt-iotools .tip{flex:1;min-width:170px;font-size:11.5px;line-height:1.7;color:#b09a9e}
.rpt-iotools .tip code{background:#fdf2f3;color:#a3122a;padding:1px 4px;border-radius:4px;font-size:11px}
.rpt-gridwrap{border:1px solid #f2dce0;border-radius:12px;overflow:auto;max-height:52vh;background:#fff}
table.rpt-grid{border-collapse:separate;border-spacing:0;width:100%;font-size:12.5px}
table.rpt-grid th{position:sticky;top:0;z-index:2;background:#fdf2f3;color:#8c0a20;font-weight:700;
  padding:7px 8px;border-bottom:1px solid #f2dce0;white-space:nowrap;font-size:12px}
table.rpt-grid td{padding:2px 4px;border-bottom:1px solid #fbf0f1}
table.rpt-grid td input{width:100%;font:inherit;font-size:12.5px;padding:5px 7px;border-radius:7px;
  border:1px solid transparent;background:transparent;color:#3a2024}
table.rpt-grid td input:hover{border-color:#f2dce0}
table.rpt-grid td input:focus{outline:0;background:#fff;border-color:var(--brand);box-shadow:0 0 0 3px rgba(200,16,46,.09)}
table.rpt-grid td.ix{width:58px;text-align:center;color:#c0a8ac;font-size:11px;white-space:nowrap}
table.rpt-grid tr:hover td{background:#fffafb}
/* 行号列里的「删这一行」小按钮。常显但很淡 —— 别做成 hover 才出现，
   藏起来的功能等于没有（上一版导入按钮就吃过这个亏）；悬停才变红。 */
table.rpt-grid td.ix .gx{font:inherit;font-size:11px;line-height:1;margin-left:4px;padding:2px 4px;
  border:1px solid #f2dce0;border-radius:6px;background:#fff;color:#d8b6bb;cursor:pointer;vertical-align:middle}
table.rpt-grid td.ix .gx:hover{background:#fdecee;border-color:#e9a9b3;color:#c8102e}

/* 提示条 */
.rpt-toast{position:fixed;left:50%;bottom:34px;transform:translate(-50%,20px);z-index:600;
  padding:11px 20px;border-radius:12px;font-size:13.5px;font-weight:600;color:#fff;
  background:linear-gradient(135deg,#8c0a20,#c8102e);box-shadow:0 10px 30px rgba(140,10,32,.3);
  opacity:0;pointer-events:none;transition:.24s;max-width:80vw;text-align:center}
.rpt-toast.on{opacity:1;transform:translate(-50%,0)}
.rpt-toast.bad{background:linear-gradient(135deg,#4a0710,#7a0a1c)}
.rpt-toast.ok{background:linear-gradient(135deg,#0b6b47,#0b8a5c)}

/* 密码弹窗 */
.rpt-pmask{position:fixed;inset:0;z-index:500;display:none;align-items:center;justify-content:center;
  background:rgba(74,7,16,.5)}
.rpt-pmask.on{display:flex}
.rpt-pbox{width:min(420px,92vw);background:#fff;border-radius:16px;overflow:hidden;
  box-shadow:0 24px 70px rgba(74,7,16,.35);animation:rptSlide .2s ease}
.rpt-pbox .hd{padding:14px 18px;background:linear-gradient(135deg,#8c0a20,#c8102e);color:#fff;font-weight:800}
.rpt-pbox .bd{padding:16px 18px}
.rpt-pbox .warn{background:#fff6f7;border:1px solid #f6d5da;border-radius:10px;padding:11px 13px;
  font-size:12.5px;color:#8c0a20;line-height:1.9;margin-bottom:12px}
.rpt-pbox .err{color:#c8102e;font-size:12.5px;min-height:18px}
.rpt-pbox .ft{display:flex;gap:8px;justify-content:flex-end;padding:0 18px 16px}
.rpt-pbox .rkeep{display:flex;align-items:flex-start;gap:7px;font-size:12.2px;color:#7d5b60;
  margin:2px 0 8px;cursor:pointer;user-select:none;line-height:1.55}
/* ⚠️ 文字必须裹在单个 <span>：flex 会把每段文本 / 每个内联元素当独立子项横排，
   否则「…仍需输入（<b>…</b>）」会被拆成三列、括号飘到下一行。 */
.rpt-pbox .rkeep>span{flex:1 1 auto;min-width:0}
.rpt-pbox .rkeep input{width:15px;height:15px;accent-color:#c8102e;margin:0;margin-top:1px;flex:0 0 auto;cursor:pointer}
.rpt-pbox .rkeep b{color:#8c0a20}
.rbtn.red{background:linear-gradient(135deg,#a3122a,#8c0a20);color:#fff;border-color:transparent;
  box-shadow:0 4px 14px -6px rgba(140,10,32,.85)}
.rbtn.red:hover{background:linear-gradient(135deg,#b81530,#9c0b23)}
.shake{animation:rptShake .38s}
@keyframes rptShake{0%,100%{transform:none}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}

/* 卡片入场（比原来的 IntersectionObserver 方案更稳：不会因为没滚动而永远透明） */
.card,.stat,.verdict,.essence,.criteria{animation:rptIn .5s cubic-bezier(.22,.8,.36,1) both}
@keyframes rptIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

@media print{
  .rbar,.rpt-ops,.rpt-toolbar,.rpt-toast,nav.toc{display:none!important}
  body{background:#fff;padding:0!important}
}
@media (max-width:820px){
  /* ⚠️ 这里是 100vw 会踩的老坑：100vw 把竖向滚动条的宽度也算进去，窄屏下抽屉比屏幕宽
     ~15px，底部「保存图表」会被切掉一截（截图才看出来）。父级 .rpt-mask 是 inset:0，
     所以 100% 才是真正的可视宽度。 */
  .rpt-drawer{width:100%}
  /* 工具条的说明文字在窄屏独占一行，别被挤成三行贴在按钮右边 */
  .rpt-iotools .tip{flex:1 1 100%;min-width:0}
  .rgrid2,.rgrid3{grid-template-columns:1fr}
  .rbar .rb-tag{display:none}
}
</style>
</head>
<body>
<div class="bg-orbs"><i></i><i></i><i></i><i></i></div>

<div class="wrap" id="wrap">
  <div class="rbar" id="rbar"></div>
  <header class="hero" id="hero"></header>
  <div id="verdict"></div>
  <div class="grid4" id="kpis"></div>
  <p class="muted" id="kpiNote"></p>
  <nav class="toc" id="toc"></nav>
  <div id="mods"></div>
  <div id="foot"></div>
</div>

<aside class="rpt-mask" id="rptMask" onclick="if(event.target===this)Rpt.closeDrawer()">
  <div class="rpt-drawer" id="rptDrawer"></div>
</aside>
<div class="rpt-pmask" id="rptPMask"></div>
<div class="rpt-toast" id="rptToast"></div>

<script>/*__RPTCFG__*/</script>
<script>
/* ============================================================================
   研报页 · 核心
   —— 数据全部来自数据库（wb_reports / wb_report_mods / wb_report_charts）
   —— 页面只负责渲染与编辑，改文案/改数字都不用动代码
   ============================================================================ */
var CFG   = window.RPT_CFG || {envId:'', key:''};
var REST  = CFG.envId ? ('https://' + CFG.envId + '.api.tcloudbasegateway.com/v1/rdb/rest/') : '';
var SEED  = window.RPT_SEED || null;
var THEME = 'report';

var AUTH_KEY = 'wb_auth_v1', AUTH_TTL = 7 * 24 * 3600 * 1000, AUTH_LAST_USER = 'wb_last_user_v1';
var Auth = {token:'', user:'', name:'', role:''};

var St = {
  code:'', rep:null, mods:[], charts:{}, chartKeys:[], all:[],
  src:'',                     /* cloud | seed */
  edit:false, inst:{}
};
var UI = {tab:'head', selMod:'', selChart:'', preview:false, confirmCb:null,
          confirmAct:'删除', confirmDanger:true,
          rteDirty:{}, rteSrcOrig:{}};

/* ---------------------------------------------------------------- 小工具 */
function $(id){ return document.getElementById(id); }
function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function escq(s){ return esc(s); }
function attr(s){ return esc(s); }
function qs(k){
  var m = new RegExp('[?&]' + k + '=([^&]*)').exec(location.search || '');
  return m ? decodeURIComponent(m[1].replace(/\+/g, ' ')) : '';
}
function enc(s){ return encodeURIComponent(String(s == null ? '' : s)); }
function nowTs(){ return Date.now(); }
var _tt = null;
function toast(msg, kind){
  var t = $('rptToast'); if(!t) return;
  t.className = 'rpt-toast on' + (kind ? ' ' + kind : '');
  t.textContent = msg;
  clearTimeout(_tt);
  _tt = setTimeout(function(){ t.className = 'rpt-toast'; }, 2600);
}
function copy(o){ return JSON.parse(JSON.stringify(o == null ? null : o)); }

/* ---------------------------------------------------------------- 云端访问 */
function api(table, opt){
  if(!REST) return Promise.reject(new Error('未配置云环境'));
  opt = opt || {};
  var h = {'Authorization': 'Bearer ' + CFG.key};
  if(opt.headers) for(var k in opt.headers) h[k] = opt.headers[k];
  var init = {method: opt.method || 'GET', headers: h};
  if(opt.body !== undefined) init.body = JSON.stringify(opt.body);
  return fetch(REST + table + (opt.q || ''), init).then(function(r){
    if(!r.ok){
      return r.text().then(function(t){
        throw new Error('HTTP ' + r.status + ' ' + String(t).slice(0, 220));
      });
    }
    if(r.status === 204) return null;
    return r.text().then(function(t){
      if(!t) return null;
      try{ return JSON.parse(t); }catch(e){ return null; }
    });
  });
}
function rpc(fn, args){
  return api('rpc/' + fn, {method:'POST', headers:{'Content-Type':'application/json'}, body:args || {}});
}

/* ---------------------------------------------------------------- 写操作密码门禁
   与工作台同一套语义：删除 / 覆盖导入永远要输密码；保存 / 修改可勾 15 分钟免重复输入。
   桌面文件版（file://）连不上云端 → 退化为本机哈希校验，明文不落盘。 */
var RPASS_FRESH_KEY = 'rpt_pass_fresh_v1';
var RPASS_HASH_KEY  = 'wb_pass_h_v1';        /* 与工作台共用同一个本机校验密码 */
var RPASS_FRESH_MS  = 15 * 60 * 1000;
function rptPassFresh(){
  try{ return (parseInt(sessionStorage.getItem(RPASS_FRESH_KEY) || '0', 10) || 0) > Date.now(); }
  catch(e){ return false; }
}
function rptPassStamp(on){
  try{
    if(on) sessionStorage.setItem(RPASS_FRESH_KEY, String(Date.now() + RPASS_FRESH_MS));
    else sessionStorage.removeItem(RPASS_FRESH_KEY);
  }catch(e){}
}
function rptHashPass(p){
  var s = 'wb-pass|' + String(p);
  if(window.crypto && crypto.subtle && crypto.subtle.digest && window.TextEncoder){
    try{
      return crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)).then(function(buf){
        var b = new Uint8Array(buf), h = '';
        for(var i = 0; i < b.length; i++) h += (b[i] < 16 ? '0' : '') + b[i].toString(16);
        return h;
      });
    }catch(e){}
  }
  var h2 = 5381;
  for(var j = 0; j < s.length; j++) h2 = ((h2 * 33) ^ s.charCodeAt(j)) >>> 0;
  return Promise.resolve('d' + h2.toString(16));
}
function localPassCheck(pass, onOk, onBad){
  var has = null;
  try{ has = localStorage.getItem(RPASS_HASH_KEY); }catch(e){}
  rptHashPass(pass).then(function(h){
    if(!has){
      try{ localStorage.setItem(RPASS_HASH_KEY, h); }catch(e){}
      toast('已把本次密码记为本机校验密码（仅存哈希）', 'ok');
      onOk(); return;
    }
    if(h === has){ onOk(); return; }
    onBad('本机密码不正确，操作已取消');
  }).catch(function(){ onBad('本机校验失败，操作已取消'); });
}

/* 左侧竖排目录：滚动时高亮当前模块（顶部操作条会压住定位点，预留 110px 余量） */
function tocSpy(){
  var box = $('toc');
  if(!box) return;
  var as = box.querySelectorAll('a');
  if(!as.length) return;
  var cur = 0;
  for(var i = 0; i < as.length; i++){
    var id = String(as[i].getAttribute('href') || '').replace(/^#/, '');
    var el = id ? document.getElementById(id) : null;
    if(!el) continue;
    var rc = el.getBoundingClientRect();
    /* ⚠️ display:none 的模块 rect 全是 0，会被误判成「已经在视口上方」→ 必须跳过 */
    if(!rc.height) continue;
    if(rc.top <= 110) cur = i;
  }
  var de = document.documentElement;
  if(window.innerHeight + window.pageYOffset >= de.scrollHeight - 8) cur = as.length - 1;
  for(var j = 0; j < as.length; j++){
    if(j === cur){ if(as[j].className !== 'on') as[j].className = 'on'; }
    else if(as[j].className){ as[j].className = ''; }
  }
  /* 目录条本身可滚动时（手机上横向 / 条数多时纵向），把当前项带进可视区 */
  var a = as[cur];
  if(box.scrollWidth > box.clientWidth + 4){
    box.scrollLeft = Math.max(0, a.offsetLeft - (box.clientWidth - a.offsetWidth) / 2);
  } else if(box.scrollHeight > box.clientHeight + 4){
    box.scrollTop = Math.max(0, a.offsetTop - (box.clientHeight - a.offsetHeight) / 2);
  }
}

/* ---------------------------------------------------------------- 图表 */
var FNS = {
  catBreak: function(){ return function(v){ return String(v).split(' ').join('\n'); }; },
  nullDash: function(){ return function(p){ return p.value == null ? '—' : p.value; }; },
  unit: function(u){ return function(v){ return (v == null ? '—' : v) + u; }; },
  valUnit: function(u){ return function(p){ return p.value + u; }; },
  /* 指定数据点覆盖标签：第 idx 个点写成固定文案，其余照常显示数值
     （底稿里出现过：某年实际为负值 / 需附同比，标签要写成特例）
     ⚠️ 标记里不能带花括号，所以用 @c@ 代表「该点的数值」，这里自己拼进去。

     ★★ 血泪坑（贵研铂业 chartRev 踩过）：**绝不能返回字面量 '{c}'**。
        ECharts 只在 `formatter` 是**字符串模板**时才做 {a}/{b}/{c} 替换；
        一旦 formatter 是函数，返回值原样输出 → 图上会把 "{c}" 直接画出来。
        所以这里统一自己把数值拼好，目标点用文案、其余点用数值。 */
  idxText: function(a){
    var n = parseFloat(a[0]), t = a.slice(1).join(':');
    return function(p){
      var v = (p.value == null ? '' : p.value);
      if(p.dataIndex === n) return String(t).replace(/@c@/g, v);
      return v;
    };
  },
  idxColorList: function(list){
    return function(p){ return list[p.dataIndex] || list[0]; };
  },
  idxColorBreak: function(a){
    var n = parseFloat(a[0]), c1 = a[1], c2 = a[2];
    return function(p){ return p.dataIndex < n ? c1 : c2; };
  },
  stackSum: function(which, opt){
    var rb = seriesArr(opt, which === 'rev' ? '营业收入·存量' : '归母净利润·存量');
    var ra = seriesArr(opt, which === 'rev' ? '营业收入·募投增量' : '归母净利润·募投增量');
    return function(p){
      return ((rb[p.dataIndex] || 0) + (ra[p.dataIndex] || 0)).toFixed(1);
    };
  },
  forecastTip: function(_a, opt){
    var xa = Array.isArray(opt.xAxis) ? opt.xAxis[0] : opt.xAxis;
    var years = (xa && xa.data) || [];
    var rb = seriesArr(opt, '营业收入·存量'),   ra = seriesArr(opt, '营业收入·募投增量');
    var nb = seriesArr(opt, '归母净利润·存量'), na = seriesArr(opt, '归母净利润·募投增量');
    return function(ps){
      if(!ps || !ps.length) return '';
      var i = ps[0].dataIndex, out = [String(years[i]) + '年'];
      function f(v){ return (v == null ? 0 : v).toFixed(2); }
      if(i < 24){
        out.push('营业收入：' + f(rb[i]) + ' 亿（实际披露）');
        out.push('归母净利润：' + f(nb[i]) + ' 亿（实际披露）');
      } else {
        out.push('营业收入：' + f(rb[i]) + ((ra[i] || 0) > 0 ? ' + ' + f(ra[i]) + '（募投增量）' : '') + ' = ' + f((rb[i] || 0) + (ra[i] || 0)) + ' 亿');
        out.push('归母净利润：' + f(nb[i]) + ((na[i] || 0) > 0 ? ' + ' + f(na[i]) + '（募投增量）' : '') + ' = ' + f((nb[i] || 0) + (na[i] || 0)) + ' 亿');
        if((ra[i] || 0) === 0 && (na[i] || 0) === 0) out.push('※ 2026E-2028E建设期，增量为0');
        else out.push('※ 2029E起募投项目逐步投产');
      }
      return out.join('\n');
    };
  }
};
function seriesArr(opt, name){
  var s = opt.series || [];
  for(var i = 0; i < s.length; i++) if(s[i] && s[i].name === name) return s[i].data || [];
  return [];
}
function mkFn(token, opt){
  var i = token.indexOf(':');
  var name = i < 0 ? token : token.slice(0, i);
  var arg  = i < 0 ? '' : token.slice(i + 1);
  /* 容错：早期导出脚本每个标记多写了一个右花括号（`{{fn:unit: 亿元}}}`），
     剥掉尾巴上的 `}` 与空白，保证已入库的老数据也能正确还原 */
  name = String(name).replace(/[}\s]+$/, '');
  arg  = String(arg).replace(/[}\s]+$/, '');
  var f = FNS[name];
  if(!f) return undefined;
  if(name === 'idxColorList')  return f(arg.split(','));
  if(name === 'idxColorBreak') return f(arg.split(':'));
  if(name === 'idxText')       return f(arg.split(':'));
  if(name === 'stackSum')      return f(arg, opt);
  if(name === 'forecastTip')   return f(arg, opt);
  return f(arg, opt);
}
/* 把 option 里的 {{fn:xxx}} 标记还原成真正的函数（存库只存 JSON，渲染时才还原） */
function revive(node, opt){
  if(typeof node === 'string'){
    var m = /^\{\{fn:([\s\S]+)\}\}$/.exec(node);
    if(m){ var fn = mkFn(m[1], opt); if(fn) return fn; }
    return node;
  }
  if(Array.isArray(node)){
    var a = []; for(var i = 0; i < node.length; i++) a[i] = revive(node[i], opt); return a;
  }
  if(node && typeof node === 'object'){
    var o = {}; for(var k in node) o[k] = revive(node[k], opt); return o;
  }
  return node;
}
function catCount(opt){
  var xa = Array.isArray(opt.xAxis) ? opt.xAxis[0] : opt.xAxis;
  return (xa && Array.isArray(xa.data)) ? xa.data.length : 0;
}
var NO_ZOOM = {chartForecast: 1, chart2: 1};
function renderCharts(){
  var slots = document.querySelectorAll('[data-chart]');
  St.inst = {};
  St.slots = [];
  for(var i = 0; i < slots.length; i++){
    var el = slots[i];
    var key = el.getAttribute('data-chart');
    var rec = St.charts[key];
    el.setAttribute('data-key', key);
    if(!(el.getAttribute('class') || '').match(/chart|mi-chart/)) el.className = (el.className || '') + ' chart-box short';
    if(St.edit){

      box.appendChild(el);
      var ops = document.createElement('div');

      ops.innerHTML = '<button class="rbtn sm" data-cedit="' + attr(key) + '">✏️ 图表数据</button>';
      box.appendChild(ops);
    }
    var slot = el;
    if(!rec){
      slot.innerHTML = '<div class="rpt-chartmiss">图表「' + esc(key) + '」暂无数据 —— 点「✏️ 图表数据」导入或编辑</div>';
      continue;
    }
    try{
      var opt = revive(copy(rec.opt), copy(rec.opt));
      var n = catCount(opt);
      var zoom = (n >= 5 && !NO_ZOOM[key]);
      if(zoom){
        opt.dataZoom = [{type:'inside', start:0, end:100}, {type:'slider', show:false, start:0, end:100}];
      }
      delete opt.__noZoom;
      var inst = echarts.init(slot, THEME);
      inst.setOption(opt, true);
      St.inst[key] = inst;
      St.slots.push({key:key, n:n, zoom:zoom});
    }catch(e){
      slot.innerHTML = '<div class="rpt-chartmiss">图表渲染失败：' + esc(String(e && e.message || e)) + '</div>';
    }
  }
  if(St.edit){
    var bts = document.querySelectorAll('[data-cedit]');
    for(var j = 0; j < bts.length; j++){
      bts[j].onclick = (function(k){
        return function(ev){ ev.stopPropagation(); Rpt.openChart(k); };
      })(bts[j].getAttribute('data-cedit'));
    }
  }
  renderToolbars();
  window.__RPT_CHARTS = St.slots.length;
}
/* 时间范围按钮组（和原研报一致：3年 / 5年 / 10年 / 全部） */
function renderToolbars(){
  var old = document.querySelectorAll('.rpt-toolbar');
  for(var i = 0; i < old.length; i++) old[i].parentNode.removeChild(old[i]);
  (St.slots || []).forEach(function(s){

                    '<button data-r="10">10年</button><button data-r="all" class="on">全部</button>';
    dom.parentNode.insertBefore(bar, dom);

          inst.dispatchAction({type:'dataZoom', dataZoomIndex:0, start:st, end:100});

  /* ---------------- 可视化编辑（工具条动作） ---------------- */
  rteDo: function(id, cmd, arg){
    var box = $(id);
    if(!box) return;
    box.focus();
    if(cmd === 'link'){
      var sel = '';
      try{ sel = String(window.getSelection() || ''); }catch(e){}
      if(!sel.trim()){ toast('先在编辑区里选中要加链接的文字', 'bad'); return; }
      var url = window.prompt('链接地址（http:// 或 https:// 开头）：', 'https://');
      if(!url) return;
      if(!/^https?:\/\//i.test(url)){ toast('只允许 http / https 链接', 'bad'); return; }
      try{ document.execCommand('createLink', false, url); }catch(e){}
      UI.rteDirty[id] = 1;
      return;
    }
    try{
      document.execCommand('styleWithCSS', false, false);
      document.execCommand(cmd, false, arg === undefined ? null : arg);
      UI.rteDirty[id] = 1;
    }catch(e){ toast('这个格式没生效（浏览器不支持），可展开「代码」手动改', 'bad'); }
  },
  rteChart: function(id){
    var box = $(id), pick = $(id + '-pick');
    if(!box || !pick) return;
    var k = pick.value;
    if(!k){ toast('「图表」页里还没有图表', 'bad'); return; }
    box.focus();
    var chip = '<span class="rte-chip" contenteditable="false" data-chart="' + attr(k) +
               '" data-cls="" data-sty="">图表：' + esc(k) + '</span>&nbsp;';
    try{ document.execCommand('insertHTML', false, chip); }
    catch(e){ box.innerHTML += chip; }
    UI.rteDirty[id] = 1;
    toast('已插入图表位置：' + k, 'ok');
  },
  /* 富文本表格：在光标所在行下面插一行 / 删掉光标所在的那一行。
     只改编辑缓冲，不写数据库（写库仍然只走「💾 保存模块」）。
     ⚠️⚠️ 改完必须置 UI.rteDirty —— rteRead() 只在 dirty 时才把编辑区内容写回，
     漏了这一步的后果是「界面上看着改了、保存下去还是老样子」，而且一声不响。
     ⚠️ 插行时样式照抄目标区同一列：光标在表头行时抄 tbody 第一行，
     否则新行会带上表头的红底白字，看着像多了一行表头。 */
  rteRow: function(id, delta){
    var box = $(id);
    if(!box) return false;
    var tr = rteRowAt(id);
    if(!tr){ toast('先把光标点进表格里，再点「＋ 行 / － 行」', 'bad'); return false; }
    var tb = tr.parentNode;
    if(!tb || !tb.nodeName) return false;
    var isHead = /^thead$/i.test(tb.nodeName);
    var fresh = null;
    if(delta < 0){
      if(isHead){ toast('这是表头行，删不了 —— 想换表头直接改文字就行', 'bad'); return false; }
      var all = tb.getElementsByTagName ? tb.getElementsByTagName('tr') : [];
      if(all.length <= 1){ toast('表格至少留一行 —— 整张表不要了，展开下面的「代码」区删掉它', 'bad'); return false; }
      tb.removeChild(tr);
    } else {
      var table = tb.parentNode, body = null;
      if(table && table.getElementsByTagName) body = table.getElementsByTagName('tbody')[0] || null;
      var donor = isHead ? (body ? body.getElementsByTagName('tr')[0] : null) : tr;
      var n = tr.cells ? tr.cells.length : 0;
      fresh = document.createElement('tr');
      for(var i = 0; i < n; i++){
        var td = document.createElement('td');
        var src = (donor && donor.cells) ? donor.cells[i] : null;
        if(src && src.getAttribute){
          if(src.getAttribute('class')) td.setAttribute('class', src.getAttribute('class'));
          if(src.getAttribute('style')) td.setAttribute('style', src.getAttribute('style'));
        }
        td.innerHTML = '&nbsp;';
        fresh.appendChild(td);
      }
      if(isHead){
        /* 永远不做第二行表头：光标在表头里时，新行插进 tbody 的最前面 */
        if(!body){
          body = document.createElement('tbody');
          if(table) table.appendChild(body);
        }
        body.insertBefore(fresh, body.firstChild);
      } else {
        tb.insertBefore(fresh, tr.nextSibling);
      }
    }
    UI.rteDirty[id] = 1;
    if(fresh){ try{ box.focus(); }catch(e){} rteCaretIn(fresh.firstChild); }
    toast(delta < 0 ? '已删掉表格里的 1 行 —— 点「💾 保存模块」才写入数据库'
                    : '已在下面插入 1 行 —— 点「💾 保存模块」才写入数据库', 'ok');
    return true;
  },
  rteToggle: function(id, det){
    var box = $(id), src = $(id + '-src');
    if(!box || !src) return;
    if(det.open){
      /* 进源码前，先把可视化内容原样同步下来（用户看到的就是当前真正的代码） */
      src.value = rteSave(box.innerHTML);
      UI.rteSrcOrig[id] = src.value;
    } else if(UI.rteSrcOrig[id] !== undefined && src.value !== UI.rteSrcOrig[id]){
      /* 只在源码真的被改过时才按源码重建，否则保持原样不动 */
      box.innerHTML = rteLoad(src.value);
      UI.rteDirty[id] = 1;
    }
  },

  /* ---------------- 保存 ---------------- */
  ensureReport: function(){
    if(!REST) return Promise.reject(new Error('未配置云环境'));
    /* 页面上还没有研报记录时（比如从一个空代码进来），先兜一个最小壳 */
    if(!St.rep){
      St.rep = {id:St.code, code:St.code, name:'', kicker:'', title:'', subtitle:'', badges:[],
                verdict_title:'核心结论', verdict_html:'', kpis:[], kpi_note:'', toc:[],
                essence_html:'', footer_html:'', theme:'red', sort:99};
    }
    var r = St.rep;
    var id = r.id || St.code;
    if(!id) return Promise.reject(new Error('缺少研报 ID'));
    var row = {
      id:id, code:r.code || id, name:r.name || '', kicker:r.kicker || '', title:r.title || '',
      subtitle:r.subtitle || '', badges:r.badges || [], verdict_title:r.verdict_title || '核心结论',
      verdict_html:r.verdict_html || '', kpis:r.kpis || [], kpi_note:r.kpi_note || '',
      toc:r.toc || [], essence_html:r.essence_html || '', footer_html:r.footer_html || '',
      theme:r.theme || 'red', sort:r.sort || 99, up:nowTs()
    };
    return api('wb_reports?on_conflict=id', {
      method:'POST',
      headers:{'Content-Type':'application/json', 'Prefer':'resolution=merge-duplicates,return=minimal'},
      body:[row]
    }).then(function(){
      r.id = id; St.src = 'cloud';
      if(St.all.map(function(x){ return String(x.id); }).indexOf(String(id)) < 0){
        St.all.push({id:id, code:row.code, name:row.name});
      }
    });
  },
  patch: function(table, q, body, label){
    if(!REST){ toast('未配置云环境，无法保存', 'bad'); return Promise.reject(new Error('no rest')); }
    var self = this;
    return this.ensureReport().then(function(){
      body.up = nowTs();
      return api(table + q, {
        method:'PATCH',
        headers:{'Content-Type':'application/json', 'Prefer':'return=minimal'},
        body:body
      });
    }).then(function(){
      toast(label + ' 已保存到数据库', 'ok');
    }).catch(function(e){
      toast('保存失败：' + String(e && e.message || e).slice(0, 110), 'bad');
      throw e;
    });
  },

  /* ---------- 页眉与结论 ---------- */
  svHead: function(){
    var r = St.rep || {};
    var v = function(id){ var e = $(id); return e ? e.value : ''; };
    var lines = v('h-badges').split('\n').map(function(s){ return s.trim(); }).filter(Boolean);
    var toc = v('h-toc').split('\n').map(function(s){ return s.trim(); }).filter(Boolean).map(function(s){
      var i = s.indexOf('|');
      return i < 0 ? {anchor:s, text:s} : {anchor:s.slice(0, i).trim(), text:s.slice(i + 1).trim()};
    });
    var kpis = [];
    var rows = document.querySelectorAll('#kpiEdit tr[data-k]');
    for(var i = 0; i < rows.length; i++){
      var g = function(n){ var e = rows[i].querySelector('[data-f="' + n + '"]'); return e ? e.value : ''; };
      if(!g('label') && !g('val')) continue;
      kpis.push({label:g('label'), val:g('val'), unit:g('unit'), cls:g('cls'), style:g('style')});
    }
    r.kicker = v('h-kicker'); r.title = v('h-title'); r.subtitle = v('h-sub');
    r.badges = lines;
    r.verdict_title = v('h-vt'); r.verdict_html = rteRead('h-vc', r.verdict_html);
    r.kpis = kpis; r.kpi_note = v('h-note');
    r.toc = toc;
    r.essence_html = rteRead('h-essence', r.essence_html);
    r.footer_html  = rteRead('h-footer', r.footer_html);
    r.id = r.id || St.code; r.code = r.code || St.code;
    r.name = r.name || '';
    ['h-vc', 'h-essence', 'h-footer'].forEach(function(k){ UI.rteDirty[k] = 0; UI.rteSrcOrig[k] = undefined; });
    this.patch('wb_reports', '?id=eq.' + enc(r.id), {
      code:r.code, name:r.name, kicker:r.kicker, title:r.title, subtitle:r.subtitle,
      badges:r.badges, verdict_title:r.verdict_title, verdict_html:r.verdict_html,
      kpis:r.kpis, kpi_note:r.kpi_note, toc:r.toc, essence_html:r.essence_html,
      footer_html:r.footer_html, theme:r.theme || 'red'
    }, '页眉与结论').then(function(){
      St.rep = r; render();
    }).catch(function(){});

  /* ---------- 模块 ---------- */
  svMod: function(){
    var id = UI.selMod; if(!id) return;
    var m = this.findMod(id); if(!m) return;
    var no = ($('m-no') || {}).value || m.no;
    var title = ($('m-title') || {}).value || '';
    /* ⚠️ 富文本：用户没动过编辑区时，rteRead 直接返回库里的原 HTML（一个字节都不改），
       避免「打开-保存」这种无意义操作把排版洗掉。 */
    var html = rteRead('m-edit', m.html);
    m.no = String(no).trim(); m.title = String(title).trim(); m.html = html;
    UI.rteDirty['m-edit'] = 0; UI.rteSrcOrig['m-edit'] = undefined;
    this.patch('wb_report_mods', '?id=eq.' + enc(id),
      {no:m.no, title:m.title, html:m.html, seq:m.seq, report_id:St.code, code:St.code}, '模块 ' + m.no)
      .then(function(){ render(); Rpt.renderDrawer(); }).catch(function(){});

    var maxNo = 0;
    St.mods.forEach(function(m){ maxNo = Math.max(maxNo, parseInt(m.no, 10) || 0); });
    var no = String(maxNo + 1);
    var id = St.code + '_m' + no;
    var m = {id:id, report_id:St.code, code:St.code, seq:St.mods.length + 1, no:no,
             title: (MOD_SKELETON[maxNo] || ('新模块 ' + no)), html: '<p>在此填写内容……</p>'};
    var self = this;
    this.ensureReport().then(function(){
      return api('wb_report_mods?on_conflict=id', {
        method:'POST',
        headers:{'Content-Type':'application/json', 'Prefer':'resolution=merge-duplicates,return=minimal'},
        body:[{id:id, report_id:St.code, code:St.code, seq:m.seq, no:m.no, title:m.title, html:m.html, up:nowTs()}]
      });
    }).then(function(){
      St.mods.push(m);
      UI.selMod = id;
      toast('已新增模块 ' + no, 'ok');
      render(); self.renderDrawer();

      rpc('wb_admin_delete_row', {p_token:Auth.token, p_kind:'reportmod', p_id:id, p_pass:pw})

          St.mods = St.mods.filter(function(x){ return String(x.id) !== String(id); });
          UI.selMod = '';

        }).catch(function(e){ toast('删除失败：' + String(e.message || e).slice(0, 90), 'bad'); });
    });

  /* ---------- 图表 ---------- */
  svChart: function(){
    var key = UI.selChart; if(!key) return;
    var rec = this.findChart(key); if(!rec) return;
    var name = ($('c-name') || {}).value || key;
    var opt;
    try{
      opt = JSON.parse(($('c-json') || {}).value || '{}');
    }catch(e){ toast('图表 option 不是合法 JSON：' + String(e.message).slice(0, 80), 'bad'); return; }
    /* 优先用界面上那张数据表覆盖 series / 类别 */
    var model = readGrid();
    if(model.rows.length){
      try{ opt = applyGrid(opt, model); }
      catch(e){ toast('数据表写回失败：' + String(e.message).slice(0, 80), 'bad'); return; }
      if($('c-json')) $('c-json').value = JSON.stringify(opt, null, 1);
    }
    rec.name = String(name).trim(); rec.opt = opt;
    var id = rec.id || (St.code + '_' + key);
    if(!rec.id) rec.id = id;
    this.ensureReport().then(function(){
      return api('wb_report_charts?on_conflict=id', {
        method:'POST',
        headers:{'Content-Type':'application/json', 'Prefer':'resolution=merge-duplicates,return=minimal'},
        body:[{id:id, report_id:St.code, code:St.code, seq:rec.seq, name:rec.name, opt:opt, up:nowTs()}]
      });
    }).then(function(){
      toast('图表「' + rec.name + '」已保存', 'ok');
      render(); Rpt.renderDrawer();
    }).catch(function(e){ toast('保存失败：' + String(e.message || e).slice(0, 100), 'bad'); });
  },
  addChart: function(){
    var n = 1;
    while(St.charts['newchart' + n]) n++;
    var key = 'newchart' + n;
    var id = St.code + '_' + key;
    var rec = {id:id, report_id:St.code, code:St.code, seq:St.chartKeys.length + 1,
               name:'新图表 ' + n,
               opt:{tooltip:{trigger:'axis'}, legend:{data:['系列1']},
                    grid:{left:50, right:30, top:40, bottom:40},
                    xAxis:{type:'category', data:['A','B','C','D','E']},
                    yAxis:{type:'value'}, series:[{name:'系列1', type:'bar', data:[1,2,3,2,1]}]}};
    var self = this;
    this.ensureReport().then(function(){
      return api('wb_report_charts?on_conflict=id', {
        method:'POST',
        headers:{'Content-Type':'application/json', 'Prefer':'resolution=merge-duplicates,return:minimal'},
        body:[{id:id, report_id:St.code, code:St.code, seq:rec.seq, name:rec.name, opt:rec.opt, up:nowTs()}]
      });
    }).then(function(){
      St.charts[key] = rec; St.chartKeys.push(key);
      toast('已新增图表（记得在模块正文里放 &lt;div data-chart="' + key + '"&gt;&lt;/div&gt; 才会显示）', 'ok');
      UI.selChart = key;
      self.renderDrawer();
    }).catch(function(e){ toast('新增失败：' + String(e.message || e).slice(0, 100), 'bad'); });
  },
  delChart: function(key){
    var rec = this.findChart(key) || {};
    this.askPass('删除图表「' + (rec.name || key) + '」（模块正文里的占位会变成空框）', function(pw){
      rpc('wb_admin_delete_row', {p_token:Auth.token, p_kind:'reportchart', p_id:rec.id, p_pass:pw})
        .then(function(r){
          if(!r || !r.ok){ toast((r && r.msg) || '删除失败', 'bad'); return; }
          delete St.charts[key];
          St.chartKeys = St.chartKeys.filter(function(k){ return k !== key; });
          UI.selChart = '';
          toast('已删除图表', 'ok');
          render(); Rpt.renderDrawer();
        }).catch(function(e){ toast('删除失败：' + String(e.message || e).slice(0, 90), 'bad'); });
    });
  },

  /* ---------- 数据表：导入 Excel / CSV、导出 CSV ----------
     用户诉求：「图表编辑增加一个可上传导入 excel 表格上传编辑数据」。
     三段式：impFile（拿到 File）→ impTable（读 + 解析，被 RGATE 包）→ impApply（改表，纯同步）。
     解析器全是顶层纯函数（见下方「Excel / CSV 解析」区块），方便探针直接喂字节。 */
  impPick: function(){ var e = $('c-file'); if(e) e.click(); },
  impFile: function(inp){
    var f = inp && inp.files && inp.files[0];
    if(inp) inp.value = '';          /* 立刻清空：同一个文件才能被连选两次 */
    if(!f) return;
    this.impTable(f);
  },
  impTable: function(file){
    var key = UI.selChart;
    if(!key){ toast('先选中一张图表再导入', 'bad'); return; }
    var nm = String((file && file.name) || '');
    var isX = /\.xlsx$/i.test(nm);
    if(!isX && !/\.(csv|txt|tsv)$/i.test(nm)){
      if(/\.xls$/i.test(nm)) toast('.xls（旧版二进制）解析不了：请在 Excel 里「另存为」→ .xlsx 或 .csv', 'bad');
      else toast('只支持 .xlsx / .csv / .txt 文件（收到：' + (nm || '未知') + '）', 'bad');
      return;
    }
    var fr = new FileReader();
    fr.onload = function(){
      var p;
      try{
        p = isX ? parseXlsx(fr.result)
                : Promise.resolve({rows: rowsFromText(decodeBuf(fr.result))});
      }catch(e){ toast('解析失败：' + String(e.message || e).slice(0, 90), 'bad'); return; }
      p.then(function(res){ Rpt.impApply(key, res.rows, nm); })
       .catch(function(e){ toast('导入失败：' + String(e.message || e).slice(0, 120), 'bad'); });
    };
    fr.onerror = function(){ toast('文件读取失败：' + nm, 'bad'); };
    fr.readAsArrayBuffer(file);
  },
  /* 把解析好的二维数组灌进数据表（不写数据库 —— 写库仍然只走「💾 保存图表」） */
  impApply: function(key, rows, fname){
    var rec = this.findChart(key);
    if(!rec){ toast('图表不存在（先点进一张图表）', 'bad'); return false; }
    if(!rows || !rows.length){ toast('文件里没读到任何数据行', 'bad'); return false; }
    var opt;
    try{ opt = JSON.parse(($('c-json') ? $('c-json').value : '') || '{}'); }
    catch(e){ toast('高级 JSON 现在有语法错误，先修好再导入', 'bad'); return false; }
    var s = opt.series || [];
    var kind = (s[0] && s[0].type === 'pie') ? 'pie' : 'series';
    if(!s.length){ toast('这张图表在高级 JSON 里没有 series，先补一个再导入', 'bad'); return false; }
    var m = rowsToModel(rows, kind);
    if(!m || !m.rows.length){ toast('文件里没读到数据行（第一行会被当成表头）', 'bad'); return false; }
    var note = [];
    if(m.serial) note.push('忽略序号列');
    if(kind !== 'pie'){
      var want = m.cols.length - 1;
      if(want < 1){ toast('只读到 1 列：需要「类别 + 至少一个系列」两列以上', 'bad'); return false; }
      if(s.length > want){
        note.push('移除 ' + (s.length - want) + ' 个多余系列');
        opt.series.length = want;
      }
      var added = 0;
      while(opt.series.length < want){
        var tpl = JSON.parse(JSON.stringify(opt.series[opt.series.length - 1]));
        /* 复制最后一列的样式，但把写死的颜色去掉 → 交给 ECharts 调色板出不同颜色 */
        delete tpl.color;
        if(tpl.itemStyle) delete tpl.itemStyle.color;
        if(tpl.lineStyle) delete tpl.lineStyle.color;
        opt.series.push(tpl);
        added++;
      }
      if(added) note.push('按最后一列补了 ' + added + ' 个系列');
      opt.series.forEach(function(x, i){ if(m.cols[i + 1]) x.name = m.cols[i + 1]; });
    }
    try{ opt = applyGrid(opt, m); }
    catch(e){ toast('写回失败：' + String(e.message || e).slice(0, 90), 'bad'); return false; }
    /* 以「真正会被保存的 option」为准回显，保证看到的就是存下去的 */
    var shown = chartModel(opt);
    var g = $('c-grid');
    if(g) g.innerHTML = gridHTML(shown);
    var gi = $('c-gridinfo');
    if(gi) gi.textContent = shown.rows.length + ' 行 × ' + Math.max(0, shown.cols.length - 1) + ' 个系列';
    if($('c-json')) $('c-json').value = JSON.stringify(opt, null, 1);
    toast('已从 ' + String(fname || '文件').slice(0, 28) + ' 读入 ' + shown.rows.length + ' 行 × ' +
          Math.max(0, shown.cols.length - 1) + ' 个系列' + (note.length ? '（' + note.join('、') + '）' : '') +
          ' —— 点「💾 保存图表」才写入数据库', 'ok');
    return true;
  },
  /* 把界面上的数据表导出成 CSV（BOM + CRLF，Excel 双击即开）—— 可以当导入模板用 */
  dlTable: function(){
    var key = UI.selChart;
    if(!key) return;
    var rec = this.findChart(key) || {};
    var cols = readGridCols(), rows = readGrid().rows;
    if(!rows.length){ toast('这张图表还没有数据行', 'bad'); return; }
    var q = function(v){
      v = String(v == null ? '' : v);
      return /[",\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
    };
    var lines = [cols.map(q).join(',')];
    for(var i = 0; i < rows.length; i++) lines.push(rows[i].map(q).join(','));
    var csv = '\ufeff' + lines.join('\r\n') + '\r\n';
    try{
      var a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv;charset=utf-8'}));
      a.download = String((St.rep && St.rep.code) || 'chart') + '_' + String(rec.name || key) + '_数据表.csv';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      toast('已导出 CSV —— 填好数字后直接「导入 Excel / CSV」回来就行', 'ok');
    }catch(e){ toast('导出失败：' + String(e.message), 'bad'); }
  },

  /* ---------- 数据表：增行 / 删行 ----------
     用户诉求：「模块的表格和图表的表格都增加一个删除行和增加行的功能」。
     共同点：**只改编辑框（DOM），一个字节都不写库** —— 写库仍然只走「💾 保存图表」，
     所以点错了、不保存就等于没发生。
     删行毕竟会丢掉已填的内容，按「删除」计并挂 RGATE（见文件末尾）；
     但 danger=false + 票据（tickFn 指向自己）→ 同一张抽屉里连着清十行只输一次密码。 */
  gridAddRow: function(){
    var g = $('c-grid');
    if(!g){ toast('先点进一张图表，再增删行', 'bad'); return false; }
    var m = readGrid(), cols = readGridCols();
    var n = Math.max(1, cols.length), row = [];
    for(var i = 0; i < n; i++) row.push('');
    m.rows.push(row);
    this.gridPaint(m);
    toast('末尾已增加 1 行（现在 ' + m.rows.length + ' 行）—— 点「💾 保存图表」才写入数据库', 'ok');
    return true;
  },
  gridDelRow: function(idx){
    var g = $('c-grid');
    if(!g){ toast('先点进一张图表，再增删行', 'bad'); return false; }
    var m = readGrid();
    if(m.rows.length <= 1){ toast('至少要留 1 行 —— 整张图表不要了请用下面的「🗑 删除图表」', 'bad'); return false; }
    var i = parseInt(idx, 10);
    if(isNaN(i)) i = m.rows.length - 1;        /* 没给行号（工具栏那个按钮）→ 删最后一行 */
    if(i < 0 || i >= m.rows.length){ toast('这一行已经不在表里了，重新点一次就好', 'bad'); return false; }
    var lab = String(((m.rows[i] || [])[0] == null ? '' : (m.rows[i] || [])[0])).trim();
    m.rows.splice(i, 1);
    this.gridPaint(m);
    toast('已删除第 ' + (i + 1) + ' 行' + (lab ? '（' + lab.slice(0, 14) + '）' : '') +
          '，现在 ' + m.rows.length + ' 行 —— 点「💾 保存图表」才写入数据库', 'ok');
    return true;
  },
  /* 工具栏的「－ 删除行」：删光标所在的那一行；没点进任何格子就删最后一行 */
  gridDelFocus: function(){
    var a = document.activeElement, r = (a && a.getAttribute) ? a.getAttribute('data-r') : null;
    if(r === null || r === undefined || r === '') r = readGrid().rows.length - 1;
    return this.gridDelRow(parseInt(r, 10));
  },
  /* 拿一份新的 model 重画数据表（表头沿用界面上现有的 → 系列数不变） */
  gridPaint: function(m){
    var g = $('c-grid'); if(!g) return false;
    var cols = readGridCols();          /* ★ 必须在换掉 innerHTML 之前读 */
    g.innerHTML = gridHTML({cols:cols, rows:(m && m.rows) || []});
    var gi = $('c-gridinfo');
    if(gi) gi.textContent = ((m && m.rows) || []).length + ' 行 × ' + Math.max(0, cols.length - 1) + ' 个系列';
    return true;
  },

  /* ---------- 整份研报 ---------- */
  delReport: function(){

                 ' 个模块与 ' + St.chartKeys.length + ' 张图表一起删除', function(pw){
      rpc('wb_admin_delete_row', {p_token:Auth.token, p_kind:'report', p_id:(r.id || St.code), p_pass:pw})
        .then(function(x){

          toast('整份研报已删除', 'ok');

  /* ---------- 导入 / 导出 ---------- */
  exportJSON: function(){

    var txt = JSON.stringify(pack, null, 1);

  /* ---------- 写操作密码确认 ----------
     opts = {act:'保存'|'删除'|'新增'|'修改'|'导入', danger:bool}
     删除、覆盖导入这类不可逆操作永远要输密码；高频「保存 / 修改」可勾
     「15 分钟内免重复输入」（sessionStorage，关标签或退出登录即失效）。 */
  askPass: function(label, cb, opts){
    opts = opts || {};
    var act = opts.act || '删除';
    var danger = (opts.danger !== undefined) ? !!opts.danger : (act === '删除');
    if(!danger && rptPassFresh()){ if(cb) cb(''); return; }
    UI.confirmAct = act;
    UI.confirmDanger = danger;
    UI.confirmCb = cb;
    var last = '';
    try{ last = localStorage.getItem(AUTH_LAST_USER) || ''; }catch(e){}
    var offline = (!REST) || location.protocol === 'file:';
    $('rptPMask').innerHTML =
      '<div class="rpt-pbox" id="rptPBox" onclick="event.stopPropagation()">' +
        '<div class="hd">🔒 管理员密码确认</div>' +
        '<div class="bd">' +
          '<div class="warn">' + (danger ? '⚠️ <b>此操作不可撤销</b>' : '✍️ <b>写入确认</b>') + '<br>' +
            esc(label) + '<br>' +
            (offline ? '本机离线：密码只在本机校验（只存哈希），首次输入即成为本机管理密码。'
                     : (danger ? '请求会带上密码提交到云端函数校验，通过后才会真正删除，不可撤销。'
                               : '请求会带上密码提交到云端函数校验，通过后才会真正写入数据库。')) + '</div>' +
          (offline || Auth.token ? '' :
            '<div class="rfld"><label>管理员账号</label>' +
              '<input class="rinp" id="rpUser" value="' + attr(last) + '" placeholder="luoshui"></div>') +
          '<div class="rfld"><label>管理员密码' +
            (Auth.token ? ' <em>当前登录 ' + esc(Auth.user) + '</em>' : '') + '</label>' +
            '<input class="rinp" id="rpPass" type="password" autocomplete="off" placeholder="请输入管理员密码" ' +
            'onkeydown="if(event.key===\'Enter\')Rpt.confirmPass()"></div>' +
          (danger ? '' :
            '<label class="rkeep"><input type="checkbox" id="rpKeep">' +
            '<span>15 分钟内「保存 / 修改」免重复输入（<b>删除、覆盖导入仍需输入</b>）</span></label>') +
          '<div class="err" id="rpErr"></div>' +
        '</div>' +
        '<div class="ft"><button class="rbtn gh" onclick="Rpt.cancelPass()">取消</button>' +
          '<button class="rbtn ' + (danger ? 'red' : 'pri') + '" id="rpGo" onclick="Rpt.confirmPass()">确认' + esc(act) + '</button></div>' +
      '</div>';
    $('rptPMask').className = 'rpt-pmask on';
    setTimeout(function(){ var i = $('rpPass'); if(i) i.focus(); }, 70);
  },
  pErr: function(msg){
    var e = $('rpErr'); if(e) e.textContent = msg || '';
    var b = $('rptPBox');
    if(b && msg){ b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake'); }
    var i = $('rpPass'); if(i && msg) i.value = '';
  },
  cancelPass: function(){ UI.confirmCb = null; $('rptPMask').className = 'rpt-pmask'; },
  confirmPass: function(){
    var uEl = $('rpUser'), pEl = $('rpPass'), go = $('rpGo');
    var u = uEl ? String(uEl.value || '').trim() : '';
    var p = pEl ? String(pEl.value || '') : '';
    var act = UI.confirmAct || '删除';
    var keep = $('rpKeep') ? !!$('rpKeep').checked : false;
    if(!String(p).trim()){ this.pErr('请输入管理员密码'); return; }
    var self = this;
    if(go){ go.disabled = true; go.textContent = '验 证 中…'; }
    function ok(){
      if(go){ go.disabled = false; go.textContent = '确认' + act; }
      $('rptPMask').className = 'rpt-pmask';
      var cb = UI.confirmCb; UI.confirmCb = null;
      if(keep) rptPassStamp(true);
      if(cb) cb(String(p).trim());
    }
    function no(msg){
      if(go){ go.disabled = false; go.textContent = '确认' + act; }
      self.pErr(msg);
    }
    /* 桌面文件版 / 未配置云环境：本机哈希校验，明文不落盘 */
    if(!REST || location.protocol === 'file:'){
      localPassCheck(String(p).trim(), ok, no);
      return;
    }
    var chain;
    if(Auth.token){
      chain = rpc('wb_admin_verify', {p_token:Auth.token, p_pass:String(p).trim()});
    } else {
      if(!u){ no('请输入管理员账号'); return; }
      chain = rpc('wb_admin_login', {
        p_user:u, p_pass:String(p), p_device:(navigator.userAgent || '').slice(0, 80), p_days:7
      }).then(function(r){
        if(r && r.ok){
          Auth.token = r.token; Auth.user = r.user; Auth.name = r.name || r.user; Auth.role = r.role || 'super';
          persistAuth(r, true);
        }
        return r;
      });
    }
    chain.then(function(r){
      if(!r || !r.ok){ no((r && r.msg) || '账号或密码错误，操作已取消'); return; }
      ok();
    }).catch(function(e){ no('验证失败：' + String(e.message || e).slice(0, 90)); });
  }
};

/* ================================================================
   可视化编辑（RTE）—— 用户改的是「文字和样子」，不是代码
   设计要点：
   1) 正文/结论/一句话本质/页脚一律用 contenteditable 直接编辑，输入框里**不出现标签**；
   2) 图表占位在编辑区里显示成受保护的胶囊标签（contenteditable=false），点不动、也删不掉半截；
      保存时按标签上记下的 data-chart / class / style 原样还原成 <div data-chart="…"></div>；
   3) 双重保险：UI.rteDirty 没置位（用户根本没动）时，保存直接写回**库里原来的 HTML**，一个字节都不改；
   4) 源码只在折叠的「代码」区可见，且只在真的改了源码时才以此为准；
   5) 凡进入编辑区/写库的 HTML 都过一遍 sanitizeHtml（剥掉 script、iframe、style、
      on… 事件属性与 javascript: 链接）。
   ================================================================ */
var RTE_BAD = /^(script|style|link|meta|base|iframe|object|embed|form|input|button|textarea|select|noscript)$/i;

function sanitizeHtml(html){
  var box = document.createElement('div');
  box.innerHTML = (html == null ? '' : String(html));
  var all = box.querySelectorAll('*');
  for(var i = 0; i < all.length; i++){
    var el = all[i];
    if(RTE_BAD.test(el.tagName)){ if(el.parentNode) el.parentNode.removeChild(el); continue; }
    var at = el.attributes;
    for(var j = at.length - 1; j >= 0; j--){
      var n = at[j].name, v = at[j].value || '';
      if(/^on/i.test(n)){ el.removeAttribute(n); continue; }
      if(n === 'contenteditable'){ el.removeAttribute(n); continue; }
      if((n === 'href' || n === 'src' || n === 'xlink:href') && /^\s*javascript:/i.test(v)) el.removeAttribute(n);
    }
  }
  return box.innerHTML;
}

/* 库里的 HTML → 编辑区内容（图表 div 换成受保护的胶囊标签） */
function rteLoad(html){
  var box = document.createElement('div');
  box.innerHTML = sanitizeHtml(html);
  var ds = box.querySelectorAll('[data-chart]');
  for(var i = 0; i < ds.length; i++){
    var d = ds[i], k = d.getAttribute('data-chart') || '';
    var chip = document.createElement('span');
    chip.className = 'rte-chip';
    chip.setAttribute('contenteditable', 'false');
    chip.setAttribute('data-chart', k);
    chip.setAttribute('data-cls', d.getAttribute('class') || '');
    chip.setAttribute('data-sty', d.getAttribute('style') || '');
    chip.setAttribute('title', '图表「' + k + '」的位置：数据在「图表」页里改，改文字不会影响它');
    chip.textContent = '图表：' + k;
    if(d.parentNode) d.parentNode.replaceChild(chip, d);
  }
  return box.innerHTML;
}

/* 编辑区内容 → 存库的 HTML（把胶囊标签还原成带 data-chart 的 div） */
function rteSave(html){
  var box = document.createElement('div');
  box.innerHTML = sanitizeHtml(html);
  var cs = box.querySelectorAll('.rte-chip[data-chart]');
  for(var i = 0; i < cs.length; i++){
    var c = cs[i];
    var d = document.createElement('div');
    d.setAttribute('data-chart', c.getAttribute('data-chart') || '');
    var cls = c.getAttribute('data-cls') || '', sty = c.getAttribute('data-sty') || '';
    if(cls) d.setAttribute('class', cls);
    if(sty) d.setAttribute('style', sty);
    if(c.parentNode) c.parentNode.replaceChild(d, c);
  }
  return box.innerHTML;
}

/* 光标落在哪一行表格里。只认本编辑区内的 tr —— 否则会误改页面上别处的表格。
   （工具条按钮都带 onmousedown="return false"，所以点按钮不会把选区弄丢） */
function rteRowAt(id){
  var box = $(id);
  if(!box) return null;
  var n = null;
  try{ var sel = window.getSelection(); n = (sel && sel.rangeCount) ? sel.anchorNode : null; }catch(e){}
  var el = n ? (n.nodeType === 1 ? n : n.parentNode) : null;
  while(el && el !== box){
    if(el.nodeName && /^tr$/i.test(el.nodeName)) return el;
    el = el.parentNode;
  }
  return null;
}
/* 把光标放进某个元素里（插完行接着就能打字） */
function rteCaretIn(el){
  if(!el) return;
  try{
    var r = document.createRange();
    r.selectNodeContents(el); r.collapse(true);
    var sel = window.getSelection();
    sel.removeAllRanges(); sel.addRange(r);
  }catch(e){}
}

function readGrid(){
  var ins = document.querySelectorAll('.rpt-grid input[data-r]');
  var rows = {}, maxR = -1, maxC = -1;
  for(var i = 0; i < ins.length; i++){
    var r = parseInt(ins[i].getAttribute('data-r'), 10);
    var c = parseInt(ins[i].getAttribute('data-c'), 10);
    if(!rows[r]) rows[r] = [];
    rows[r][c] = ins[i].value;
    if(r > maxR) maxR = r;
    if(c > maxC) maxC = c;
  }
  var out = [];
  for(var r2 = 0; r2 <= maxR; r2++){
    var arr = [];
    for(var c2 = 0; c2 <= maxC; c2++){
      var cell = (rows[r2] || [])[c2];
      arr.push(cell === undefined ? '' : cell);
    }
    out.push(arr);
  }
  return {rows: out};
}
/* option ←→ 数据表 */
function chartModel(opt){
  var s = opt.series || [];
  if(s.length && s[0].type === 'pie' && Array.isArray(s[0].data) && s[0].data.length &&
     typeof s[0].data[0] === 'object' && !Array.isArray(s[0].data[0])){
    return {kind:'pie', cols:['名称', '数值'],
            rows:s[0].data.map(function(d){ return [d.name, d.value]; })};
  }
  var xa = Array.isArray(opt.xAxis) ? opt.xAxis[0] : opt.xAxis;
  var cats = (xa && Array.isArray(xa.data)) ? xa.data.slice() : null;
  var cols = ['类别'].concat(s.map(function(x, i){ return x.name || ('系列' + (i + 1)); }));
  var n = cats ? cats.length : 0;
  s.forEach(function(x){ n = Math.max(n, (x.data || []).length); });
  var rows = [];
  for(var i = 0; i < n; i++){
    var row = [cats ? cats[i] : ''];
    s.forEach(function(x){
      var d = (x.data || [])[i];
      row.push(d && typeof d === 'object' && !Array.isArray(d) ? d.value : (d === undefined ? '' : d));
    });
    rows.push(row);
  }
  return {kind:'series', cols:cols, rows:rows};
}
function applyGrid(opt, model){
  var s = opt.series || [];
  if(!s.length) return opt;
  if(model.kind === undefined){
    model.kind = (s[0].type === 'pie' && s[0].data && typeof s[0].data[0] === 'object') ? 'pie' : 'series';
  }
  if(model.kind === 'pie'){
    s[0].data = model.rows.map(function(r){
      return {name:String(r[0] == null ? '' : r[0]), value:parseFloat(r[1]) || 0};
    }).filter(function(d){ return d.name !== ''; });
    return opt;
  }
  var xa = Array.isArray(opt.xAxis) ? opt.xAxis[0] : opt.xAxis;
  var cats = model.rows.map(function(r){ return String(r[0] == null ? '' : r[0]); });
  if(xa && Array.isArray(xa.data)){
    xa.data = cats;
    if(Array.isArray(opt.xAxis) && opt.xAxis[1] && Array.isArray(opt.xAxis[1].data)) opt.xAxis[1].data = cats.slice();
  }
  s.forEach(function(x, i){
    var old = x.data || [];
    x.data = model.rows.map(function(r, ri){
      var v = r[i + 1];
      var num = (v === '' || v === null || v === undefined) ? null : parseFloat(v);
      if(num !== null && isNaN(num)) num = null;
      var o = old[ri];
      if(o && typeof o === 'object' && !Array.isArray(o)){ o.value = num; return o; }
      return num;
    });
  });
  return opt;
}
/* ---------------------------------------------------------------- 新建 / 导入 */
/* ============================================================================
   Excel / CSV 解析（顶层纯函数，探针可直接喂字节）
   —— 供「图表 → 数据表 → 📥 导入 Excel / CSV」用。

   三条设计取舍（都是权衡过才这么定的）：
   ① `.xlsx` 本质是 zip。单文件页要能离线打开，所以**不引第三方库**；也不手写 inflate
      （几百行、易错）。直接用浏览器原生的 `DecompressionStream('deflate-raw')`
      （Edge / Chrome 103+）。拿不到这个 API 时**明确报错让用户另存为 CSV**，
      绝不静默给出一张空表 —— 那是最坏的结果（看着像成功）。
   ② 表头约定：第一行 = 表头，第 1 列 = 类别，后面每列一个系列。
      `#` / `序号` / `no` / `编号` 这种纯序号列自动忽略；如果第一行全是数字
      （没有表头），就按「类别 + 系列N」生成，**不能把第一行数据当表头吃掉**。
   ③ 日期单元格（Excel 数字格式）解成 `YYYY-MM-DD`，而不是把 45000 这种序列号
      原样填进表里 —— 类别列最常见的恰好就是月份/年份。
   ============================================================================ */

/* 字节 → 文本：UTF-8 优先；出现替换符（多半是 GBK 导出的 CSV）再试 GBK */
function decodeBuf(buf){
  var u8 = new Uint8Array(buf), s = '';
  try{ s = new TextDecoder('utf-8').decode(u8); }catch(e){ s = ''; }
  if(s.indexOf('\uFFFD') >= 0){
    try{
      var g = new TextDecoder('gbk').decode(u8);
      if(g && g.indexOf('\uFFFD') < 0) return g.replace(/^\uFEFF/, '');
    }catch(e){}
  }
  return s.replace(/^\uFEFF/, '');
}

/* 分隔符嗅探：Excel 复制出来是 \t，另存为 CSV 是 , 或 ;（欧洲区） */
function sniffDelim(text){
  var head = String(text).split('\n').slice(0, 6).join('\n');
  var cands = ['\t', ',', ';', '|'], best = '\t', bn = 0;
  for(var i = 0; i < cands.length; i++){
    var n = head.split(cands[i]).length - 1;
    if(n > bn){ bn = n; best = cands[i]; }
  }
  return best;
}
/* 分隔文本 → 二维数组（支持 "引号包裹" 与 "" 转义、跨行字段） */
function rowsFromText(text){
  text = String(text == null ? '' : text).replace(/\r\n?/g, '\n');
  var d = sniffDelim(text);
  var rows = [], cur = [], cell = '', q = false;
  for(var i = 0; i < text.length; i++){
    var c = text.charAt(i);
    if(q){
      if(c === '"'){
        if(text.charAt(i + 1) === '"'){ cell += '"'; i++; }
        else q = false;
      } else cell += c;
      continue;
    }
    if(c === '"') q = true;
    else if(c === d){ cur.push(cell); cell = ''; }
    else if(c === '\n'){ cur.push(cell); rows.push(cur); cur = []; cell = ''; }
    else cell += c;
  }
  cur.push(cell); rows.push(cur);
  return rows;
}
/* 数据表表头（跳过最左边的「#」列）；导出 CSV 时当表头用 */
function readGridCols(){

  for(var i = 1; i < ths.length; i++) out.push(String(ths[i].textContent || '').trim());

}

/* ---------------- zip ----------------
   ⚠️ 本地头里的 name/extra 长度与中央目录**不一定相同**（有 data descriptor 时更甚），
   所以数据起点必须按本地头重新算，不能拿中央目录的偏移直接推。 */
function zU16(b, o){ return b[o] | (b[o + 1] << 8); }
function zU32(b, o){ return (b[o] | (b[o+1] << 8) | (b[o+2] << 16) | (b[o+3] << 24)) >>> 0; }
function zStr(b, s, e){
  var out = '';
  for(var i = s; i < e; i++) out += String.fromCharCode(b[i]);
  return out;
}
function unzipEntries(buf){
  var b = new Uint8Array(buf), eo = -1;
  var lo = Math.max(0, b.length - 66000);
  for(var i = b.length - 22; i >= lo; i--){
    if(b[i] === 0x50 && b[i+1] === 0x4b && b[i+2] === 0x05 && b[i+3] === 0x06){ eo = i; break; }
  }
  if(eo < 0) throw new Error('不是有效的 xlsx（找不到 zip 结尾标记）');
  var cnt = zU16(b, eo + 10), p = zU32(b, eo + 16), out = {};
  for(var k = 0; k < cnt; k++){
    if(p + 46 > b.length || zU32(b, p) !== 0x02014b50) break;
    var method = zU16(b, p + 10), csize = zU32(b, p + 20), lho = zU32(b, p + 42);
    var nlen = zU16(b, p + 28), elen = zU16(b, p + 30), clen = zU16(b, p + 32);
    var name = zStr(b, p + 46, p + 46 + nlen);
    if(zU32(b, lho) === 0x04034b50){
      var ds = lho + 30 + zU16(b, lho + 26) + zU16(b, lho + 28);
      out[name] = {method:method, data:b.subarray(ds, ds + csize)};
    }
    p += 46 + nlen + elen + clen;
  }
  return out;
}
function entryText(ent){
  if(!ent) return Promise.resolve('');
  if(ent.method === 0) return Promise.resolve(new TextDecoder('utf-8').decode(ent.data));
  if(ent.method !== 8) return Promise.reject(new Error('压缩方式 ' + ent.method + ' 不支持'));
  if(typeof DecompressionStream !== 'function'){
    return Promise.reject(new Error('这个浏览器解压不了 xlsx —— 请在 Excel 里「另存为 → CSV」再导入'));
  }
  var st = new Blob([ent.data]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  return new Response(st).arrayBuffer().then(function(ab){
    return new TextDecoder('utf-8').decode(new Uint8Array(ab));
  });
}

/* ---------------- xlsx 里的 XML ---------------- */
function xmlUnesc(s){
  return String(s == null ? '' : s)
    .replace(/&#x([0-9a-fA-F]+);/g, function(m, h){ return String.fromCharCode(parseInt(h, 16)); })
    .replace(/&#(\d+);/g, function(m, d){ return String.fromCharCode(parseInt(d, 10)); })
    .replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"')
    .replace(/&apos;/g, "'").replace(/&amp;/g, '&');
}
function sharedStrings(xml){
  var out = [], re = /<si\b[^>]*>([\s\S]*?)<\/si>/g, m;
  while((m = re.exec(xml || ''))){
    var inner = m[1], t = '', r = /<t\b[^>]*>([\s\S]*?)<\/t>/g, mm;
    while((mm = r.exec(inner))) t += xmlUnesc(mm[1]);
    out.push(t);
  }
  return out;
}
/* 这个数字格式像日期吗（内置 14–22 / 45–47，或自定义格式里带 y/m/d/h/s） */
function isDateFmt(id, code){
  if((id >= 14 && id <= 22) || (id >= 45 && id <= 47)) return true;
  if(!code) return false;
  var c = String(code).replace(/"[^"]*"/g, '').replace(/\[[^\]]*\]/g, '').replace(/\\./g, '').toLowerCase();
  return /[ymdhs]/.test(c) && !/^[0#?.,]+$/.test(c);
}
/* cellXfs 顺序 = 单元格 s 属性的下标 → [是不是日期格式] */
function dateStyles(xml){
  var out = [];
  var m = /<cellXfs\b[^>]*>([\s\S]*?)<\/cellXfs>/.exec(xml || '');
  if(!m) return out;
  var customs = {}, re1 = /<numFmt\b([^>]*)\/?>/g, x;
  while((x = re1.exec(xml))){
    var a = /numFmtId="(\d+)"/.exec(x[1]), b = /formatCode="([^"]*)"/.exec(x[1]);
    if(a) customs[a[1]] = xmlUnesc(b ? b[1] : '');
  }
  var re2 = /<xf\b([^>]*?)(?:\/>|>)/g, y;
  while((y = re2.exec(m[1]))){
    var idm = /numFmtId="(\d+)"/.exec(y[1]);
    var id = idm ? parseInt(idm[1], 10) : 0;
    out.push(isDateFmt(id, customs[String(id)]));
  }
  return out;
}
function colIdx(letters){
  var n = 0;
  for(var i = 0; i < letters.length; i++) n = n * 26 + (letters.charCodeAt(i) - 64);
  return n - 1;
}
/* Excel 1900 序列号 → YYYY-MM-DD（25569 = 1970-01-01 的序列号；按 UTC 算避免时区偏移） */
function serialDate(n){
  var d = new Date(Math.round((n - 25569) * 86400000));
  if(isNaN(d.getTime())) return String(n);
  var p = function(x){ return (x < 10 ? '0' : '') + x; };
  return d.getUTCFullYear() + '-' + p(d.getUTCMonth() + 1) + '-' + p(d.getUTCDate());
}
/* 工作表 XML → 二维数组（按 r="B3" 定位，xlsx 允许整行整列空缺） */
function sheetRows(xml, shared, dstyles){
  var body = String(xml || '');
  var sd = /<sheetData\b[^>]*>([\s\S]*?)<\/sheetData>/.exec(body);
  if(sd) body = sd[1];
  var out = [], rr = /<row\b[^>]*>([\s\S]*?)<\/row>/g, m;
  while((m = rr.exec(body))){
    var cells = [], cr = /<c\b([^>]*?)(?:\/>|>([\s\S]*?)<\/c>)/g, cm;
    while((cm = cr.exec(m[1]))){
      var at = cm[1], inner = cm[2] || '';
      var ref = /r="([A-Z]+)\d+"/.exec(at);
      var ci = ref ? colIdx(ref[1]) : cells.length;
      var t = (/t="([^"]+)"/.exec(at) || [0, ''])[1];
      var si = parseInt((/s="(\d+)"/.exec(at) || [0, 0])[1], 10) || 0;
      var val = '';
      if(t === 'inlineStr'){
        var im = /<t\b[^>]*>([\s\S]*?)<\/t>/.exec(inner);
        val = im ? xmlUnesc(im[1]) : '';
      } else {
        var vm = /<v\b[^>]*>([\s\S]*?)<\/v>/.exec(inner);
        var raw = vm ? xmlUnesc(vm[1]) : '';
        if(t === 's'){ var kk = parseInt(raw, 10); val = shared[kk] === undefined ? '' : shared[kk]; }
        else if(t === 'str'){ val = raw; }
        else if(t === 'b'){ val = (raw === '1' ? 'TRUE' : 'FALSE'); }
        else if(t === 'e'){ val = ''; }
        else if(raw !== ''){
          var num = parseFloat(raw);
          val = (dstyles[si] && !isNaN(num)) ? serialDate(num) : raw;
        }
      }
      if(ci >= 0) cells[ci] = val;
    }
    var row = [];
    for(var j = 0; j < cells.length; j++) row.push(cells[j] === undefined ? '' : cells[j]);
    out.push(row);
  }
  return out;
}
/* 取第一张工作表：Excel 导出的 sheet1.xml 就是第一张表（这里不追 workbook.xml 的
   sheet 顺序 —— 多花十几行异步代码只为极端重排场景，不值） */
function pickSheet(z){
  var cands = [], k;
  for(k in z) if(/^xl\/worksheets\/sheet\d+\.xml$/.test(k)) cands.push(k);
  if(!cands.length) throw new Error('这个文件里没有工作表（确定是 .xlsx 吗？）');
  cands.sort(function(a, b){
    return parseInt(/(\d+)\.xml$/.exec(a)[1], 10) - parseInt(/(\d+)\.xml$/.exec(b)[1], 10);
  });
  return cands[0];
}
function parseXlsx(buf){
  var z;
  try{ z = unzipEntries(buf); }
  catch(e){ return Promise.reject(e); }
  var deflated = false, k;
  for(k in z) if(z[k].method === 8) deflated = true;
  if(deflated && typeof DecompressionStream !== 'function'){
    return Promise.reject(new Error('这个浏览器解压不了 xlsx —— 请在 Excel 里「另存为 → CSV」再导入'));
  }
  var sheet;
  try{ sheet = pickSheet(z); }
  catch(e){ return Promise.reject(e); }
  return Promise.all([
    entryText(z['xl/sharedStrings.xml']).catch(function(){ return ''; }),
    entryText(z['xl/styles.xml']).catch(function(){ return ''; }),
    entryText(z[sheet]).catch(function(e){ throw new Error('读取工作表失败：' + String(e.message || e)); })
  ]).then(function(a){
    return {rows: sheetRows(a[2], sharedStrings(a[0]), dateStyles(a[1])), sheet:sheet};
  });
}

/* ---------------- 二维数组 → 数据表模型 ---------------- */
function cellText(x){ return String(x == null ? '' : x).replace(/\u00a0/g, ' ').replace(/\s+/g, ' ').trim(); }
function rowsToModel(rows, kind){
  var clean = [], i, j;
  for(i = 0; i < rows.length; i++){
    var r = rows[i] || [], has = false;
    for(j = 0; j < r.length; j++){ if(cellText(r[j]) !== ''){ has = true; break; } }
    if(has) clean.push(r.map(cellText));
  }
  if(!clean.length) return null;
  var w = 0;
  for(i = 0; i < clean.length; i++) w = Math.max(w, clean[i].length);
  /* 表头判定：第一行只要有一个非数字单元，就当表头（否则整行都是数据） */
  var head = clean[0], isHead = false;
  for(j = 0; j < head.length; j++){
    if(head[j] && !/^-?[\d,]+(\.\d+)?%?$/.test(head[j])){ isHead = true; break; }
  }
  var serial = isHead && /^(#|no\.?|序号|编号|index|行号)$/i.test(head[0] || '');
  var off = serial ? 1 : 0;
  var cols = [], data = [];
  if(isHead){
    for(j = off; j < w; j++) cols.push(head[j] === undefined ? '' : head[j]);
    data = clean.slice(1).map(function(x){ return x.slice(off); });
  } else {
    cols = ['类别'];
    for(j = 1; j < w; j++) cols.push('系列' + j);
    data = clean.map(function(x){ return x.slice(off); });
  }
  if(kind === 'pie'){
    cols = ['名称', '数值'];
    data = data.map(function(x){ return [x[0] === undefined ? '' : x[0], x[1] === undefined ? '' : x[1]]; });
  } else {
    /* 末尾整列都是空的（Excel 里常见的幽灵列）→ 砍掉，别凭空多出一个系列 */
    var keep = cols.length;
    while(keep > 1){
      var empty = true;
      for(i = 0; i < data.length; i++){ if(cellText(data[i][keep - 1]) !== ''){ empty = false; break; } }
      if(!empty) break;
      keep--;
    }
    cols = cols.slice(0, keep);
    if(!cols[0] || /^(#|序号|编号|index)$/i.test(cols[0])) cols[0] = '类别';
  }
  return {cols:cols, rows:data, serial:serial, head:isHead};
}

function postAll(table, rows, size){
  var i = 0;
  function step(){
    if(i >= rows.length) return Promise.resolve();
    var part = rows.slice(i, i + size);
    i += size;
    return api(table + '?on_conflict=id', {
      method:'POST',
      headers:{'Content-Type':'application/json', 'Prefer':'resolution=merge-duplicates,return=minimal'},
      body:part
    }).then(step);
  }
  return step();
}

Rpt.importJSON = function(){

  });
  var charts = (pack.charts || []).map(function(c, i){

    .catch(function(e){ toast('导入失败：' + String(e.message || e).slice(0, 100), 'bad'); });
};

/* 把「数据管理面板」挂到 Rpt 上（保持内联 onclick 的调用点统一） */
Rpt.createReport = RptCreate;

/* ============================================================================
   写操作门禁装配
   —— 把 Rpt 上所有「会改数据库」的方法统一包一层密码确认。
   协议：包装层先弹密码框；校验通过后把私有哨兵 RPASS_OK 追加为最后一个参数
   再调原方法 —— 原方法看到哨兵就直通，内部重入不会再弹第二次。
   ⚠️ delMod / delChart / delReport 已经在内部调 askPass，不要放进这张表（会连弹两次）。
   ⚠️ 弹窗用的是独立的 #rptPMask，所以抽屉里正在填的表单不会被清掉。 */
var RPASS_OK = {__rpassOk:true};

/* —— 编辑会话票据（与工作台 13.5 / 13.6 同一套语义）——
   入口「＋ 新增模块 / ＋ 新增图表」验过密码后开一张单子，紧接着在抽屉里点「保存」
   凭单直通，用户只输一次；抽屉一关（closeDrawer）或退出登录整张作废 ——
   所以下次再点「＋ 新增模块」照样要重新输密码。 */
var RTICK = {};
var RTICK_MS = 30 * 60 * 1000;
function rTickIssue(k){ RTICK[k] = Date.now(); }
function rTickHas(k){
  var t = RTICK[k];
  if(!t) return false;
  if(Date.now() - t > RTICK_MS){ delete RTICK[k]; return false; }
  return true;
}
function rTickClear(){ if(!RTICK) return; for(var k in RTICK){ delete RTICK[k]; } }

var RGATE = [
  /* [方法, 动作, 不可逆, 是否拦（返回 false 直通）, 目标描述] */
  ['toggleEdit','编辑',false,function(){ return !St.edit; },
    function(){ return '进入编辑模式（可直接改正文 / 结论 / 一句话本质 / 页脚）'; }],
  ['svHead','保存',false,null,
    function(){ return '页眉与核心结论：标题 / 副标题 / 徽标 / 8 项指标 / 目录 / 一句话本质 / 页脚'; }],
  ['svMod','保存',false,null,
    function(){ var m = Rpt.findMod(UI.selMod) || {};
                return '模块 ' + (m.no || '') + '：' + String(m.title || '').slice(0, 40); }],
  ['addMod','新增',false,null,
    function(){ return '新增一个空模块（编号自动接在最后，随后会写入数据库）'; }, 'svMod'],
  ['svChart','保存',false,null,
    function(){ var k = UI.selChart, r = Rpt.findChart(k) || {};
                return '图表「' + String(r.name || k || '') + '」的数据与样式'; }],
  ['addChart','新增',false,null,
    function(){ return '新增一张示例图表（随后会写入数据库）'; }, 'svChart'],
  /* 覆盖式写入（整表覆盖编辑框里的数据表）：与 JSON 导入同级 —— 不可逆，永远要输密码。
     位置在 addChart 之后、createReport 之前；标签函数里点出是「哪一张图表」。 */
  ['impTable','导入',true,null,
    function(){ var k = UI.selChart, r = Rpt.findChart(k) || {};
                return '把上传的 Excel / CSV 整表覆盖到图表「' + String(r.name || k || '') + '」的数据表上'; }],
  /* 表格增删行（图表数据表 / 模块正文里的表格）：
     都是**只改编辑缓冲、不写库**的动作（写库仍走「保存」），所以 danger=false；
     但删行会丢掉已填的内容，所以按「删除」计 —— 且 danger=false 才带得出
     「15 分钟免重复输入」那个口子。票据指向自己：同一张抽屉里连着删十行只输一次密码，
     抽屉一关（closeDrawer）票据作废。插行不需要验（纯新增，随时可删）。 */
  ['gridDelRow','删除',false,null,
    function(idx){
      var k = UI.selChart, r = Rpt.findChart(k) || {}, m = readGrid();
      var i = parseInt(idx, 10);
      var at = isNaN(i) ? m.rows.length : (i + 1);
      var lab = (!isNaN(i) && m.rows[i]) ? String(m.rows[i][0] == null ? '' : m.rows[i][0]).slice(0, 14) : '';
      return '删除图表「' + String(r.name || k || '') + '」数据表里的第 ' + at + ' 行' +
             (lab ? '（' + lab + '）' : '') + ' —— 还没入库，点「💾 保存图表」才生效';
    }, 'gridDelRow'],
  ['rteRow','删除',false,function(id, delta){ return delta < 0; },
    function(id, delta){
      var m = (UI.tab === 'mods') ? Rpt.findMod(UI.selMod) : null;
      return '删除' + (m ? ('模块 ' + (m.no || '') + '「' + String(m.title || '').slice(0, 24) + '」')
                          : '这一段正文') + '表格里光标所在的那一行 —— 还没入库，点保存才生效';
    }, 'rteRow'],
  ['createReport','新增',false,null,
    function(){ return '新建研报（代码 ' + String(($('n-code') || {}).value || '') +
                      '），会写入壳记录 + 31 个空模块'; }],
  /* 覆盖式写入：不可逆，永远要输密码 */
  ['importJSON','导入',true,null,
    function(){ return '把粘贴的 JSON 覆盖写入数据库（模块 + 图表，按 id upsert）'; }]
];
RGATE.forEach(function(sp){
  var name = sp[0], act = sp[1], danger = !!sp[2], when = sp[3], label = sp[4];
  var tickFn = sp[5] || null;
  var raw = Rpt[name];
  if(typeof raw !== 'function') return;
  Rpt[name] = function(){
    var args = [].slice.call(arguments);
    if(args.length && args[args.length - 1] === RPASS_OK){
      args.pop();
      return raw.apply(Rpt, args);
    }
    if(when && !when.apply(Rpt, args)) return raw.apply(Rpt, args);
    /* 抽屉是刚验过密码才打开的（票据未作废）→ 凭单直通，别让用户在同一张表单里输第二次 */
    if(rTickHas(name)) return raw.apply(Rpt, args);
    var txt;
    try{ txt = label.apply(null, args); }catch(e){ txt = name; }
    Rpt.askPass(txt, function(){
      if(tickFn) rTickIssue(tickFn);   /* 开票：这张抽屉里的「保存」凭票直通 */
      args.push(RPASS_OK);
      return raw.apply(Rpt, args);
    }, {act:act, danger:danger});
  };
  /* 给验收探针留的标记：可断言「这个方法确实被门禁包过」 */
  Rpt[name].__gated = true;
  Rpt[name].__act = act;
  Rpt[name].__danger = danger;
  Rpt[name].__raw = raw;
});



</script>
</body>
</html>
